[project]
name = "asterion-quantstats"
version = "0.1.0"
requires-python = "==3.12.*"
# These numerical releases still ship wheels for macOS 13 (Apple Silicon).
dependencies = ["quantstats==0.0.86", "protobuf==5.29.3", "numpy==2.3.5", "scipy==1.17.1"]

[dependency-groups]
build = ["pyinstaller==6.22.3"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
