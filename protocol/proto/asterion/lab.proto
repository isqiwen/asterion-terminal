syntax = "proto3";
package asterion.lab.proto;
import "asterion/strategy.proto";

// The Python research service, supervised by Terminal.
message Request {
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof body {
    HealthQuery health = 10;
    SummaryQuery summary = 15;
    DominantQuery dominant = 18;
    SessionsQuery sessions = 19;
    StrategiesQuery strategies = 24;
    BacktestRun backtest = 25;
    RunsQuery runs = 26;
    CancelRun cancel_run = 27;
    Sweep sweep = 28;
    SweepQuery sweep_runs = 29;
    CancelSweep cancel_sweep = 30;
    RunQuery run = 31;
    FactorRun factor = 32;
    ChartBarsQuery chart_bars = 33;
    StoredContractsQuery stored_contracts = 34;
    RunReportQuery run_report = 35;
    asterion.strategy.proto.Build strategy_package = 36;
    SourceQuery source = 37;
    SourceWrite save_source = 38;
    SourceQuery delete_source = 39;
  }
}
message HealthQuery {}

// What the research dataset holds now.
message SummaryQuery {}

// A contract's bars for the market page's chart (asterion_lab/chart.py):
// stored minutes gathered by `period` minutes (1, 5, 10, 15, 30 or 60), or
// daily bars by day, week, month, quarter or year, each with MACD.
message ChartBarsQuery {
  string contract = 1; // EXCHANGE/product/YYYY-MM
  string period = 3;
  // A result chart uses the run's recorded version. Empty selects latest only
  // for browsing historical data independently of a research result.
  string dataset_version = 4;
}
// The contracts a source has stored, with the days of each table.
// QuantStats figures of a finished run (asterion_lab/report.py).
message RunReportQuery {
  string id = 1;
}
message RunReport {
  string id = 1;
  string quantstats_version = 2;
  // sortino, omega, tail_ratio, ulcer_index, value_at_risk and
  // conditional_value_at_risk; a figure without a value is absent.
  map<string, double> figures = 3;
}
message StoredContractsQuery {
  string contract = 2; // only this one, when given
}
// A product's dominant series in [begin_day, end_day]. The dominant month of a
// day has the largest open interest on the previous trading day among the
// current month and later ones that settle that day, never moving back; a
// change takes effect on the next trading day.
message DominantQuery {
  string exchange = 1;
  string product = 2;
  string begin_day = 3;
  string end_day = 4;
  // A traded series leaves a month on its last day and needs bars of the
  // outgoing month on the roll day; one only read does not.
  bool traded = 5;
  // "none", or "ratio": earlier months scaled to the level of the last one.
  string adjustment = 6;
}
// The trading sessions of a product on the exchange's open days in
// [begin_day, end_day], from reviewed exchange documents.
message SessionsQuery {
  string exchange = 1;
  string product = 2;
  string begin_day = 3;
  string end_day = 4;
}
message Response {
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof body {
    Health health = 10;
    Error error = 11;
    Accepted accepted = 12;
    Summary summary = 14;
    DominantSeries dominant = 17;
    Sessions sessions = 18;
    Strategies strategies = 24;
    Runs runs = 25;
    SweepRuns sweep_runs = 26;
    RunDetail run = 27;
    FactorResult factor = 28;
    ChartBars chart_bars = 29;
    StoredContracts stored_contracts = 30;
    RunReport run_report = 31;
    asterion.strategy.proto.Package strategy_package = 32;
    Source source = 33;
  }
}
message Health {
  // The service name it was started as; a process restart keeps it.
  string instance_id = 1;
  string process_id = 2;
  string version = 3;
  uint64 uptime_ms = 4;
  bool initialized = 5;
}
message Error {
  string code = 1;
  string message = 2;
}
message Accepted {}

message TableSummary {
  string table = 1;
  uint64 rows = 2;
  uint32 partitions = 3;
  string first_day = 4;
  string last_day = 5;
}
message Summary {
  string dataset_version = 1;
  int64 created_ns = 2;
  repeated TableSummary tables = 3;
}
message ChartBar {
  int64 time_ms = 1; // when the period ended; days at 15:00 Beijing time of the last day
  string trading_day = 2; // the last trading day in the bar
  bool partial = 3; // a recorded minute in it is incomplete
  // Exact decimals as text.
  string open = 4;
  string high = 5;
  string low = 6;
  string close = 7;
  string volume = 8;
  // Absent for the first 33 bars.
  optional double macd_diff = 9;
  optional double macd_signal = 10;
  optional double macd_histogram = 11;
}
message ChartBars {
  string dataset_version = 1;
  string contract = 2;
  string period = 3;
  repeated ChartBar bars = 4;
}
message StoredContract {
  string contract = 1;
  string name = 2; // from the contract table, when it has the contract
  string daily_first = 3;
  string daily_last = 4;
  uint32 daily_days = 5;
  string minute_first = 6;
  string minute_last = 7;
  uint32 minute_days = 8;
}
message StoredContracts {
  string dataset_version = 1;
  repeated StoredContract contracts = 3;
}
message DominantDay {
  string day = 1;
  string contract = 2;
  // Exact decimals as text, adjusted as asked; empty when the month did not
  // trade or settle that day.
  string open = 3;
  string high = 4;
  string low = 5;
  string close = 6;
  string settlement = 7;
}
message Roll {
  string day = 1;
  string from_contract = 2;
  string to_contract = 3;
  // New over old settlement on the trading day before the roll.
  string ratio = 4;
}
message DominantSeries {
  string dataset_version = 1;
  string adjustment = 2;
  repeated DominantDay days = 3;
  repeated Roll rolls = 4;
}
// Beijing time, "YYYY-MM-DD HH:MM".
message SessionSegment {
  string begin = 1;
  string end = 2;
}
message SessionDay {
  string trading_day = 1;
  // No reviewed rule covers the day session: its times are unknown.
  bool day_known = 2;
  repeated SessionSegment day = 3;
  // held; none (the product has no night session); holiday_eve (none before a
  // statutory holiday); unknown (no reviewed rule, or a period not established).
  string night_state = 4;
  SessionSegment night = 5;
  repeated string sources = 6;
}
message SessionSource {
  string id = 1;
  string title = 2;
  string url = 3;
  string published = 4;
  string note = 5;
}
message Sessions {
  string reviewed = 1;
  repeated SessionDay days = 2;
  repeated SessionSource sources = 3;
}

// The strategies of the strategy directory: Strategy subclasses in the
// modules of its strategies/ directory, as the files are now.
message StrategiesQuery {
  string repository = 1; // the strategy directory
}
// One module of the strategy directory: strategies/<name>.py or
// factors/<name>.py. Built-in modules are read only.
message SourceQuery {
  string repository = 1;
  string path = 2;
}
message SourceWrite {
  string repository = 1;
  string path = 2;
  string content = 3;
  bool create = 4; // refused when the module exists
}
message Source {
  string path = 1;
  string content = 2;
  bool read_only = 3;
}
message StrategyParameter {
  string name = 1;
  string kind = 2; // bool, int, float or str
  asterion.strategy.proto.ParameterValue default = 3;
}
message StrategyEntry {
  string id = 1; // <module>.<class>
  string description = 2; // the class's docstring
  repeated StrategyParameter parameters = 3;
}
// A module that failed to import, with the end of its traceback.
message StrategyModuleError {
  string module = 1;
  string message = 2;
}
message Strategies {
  string repository = 1;
  string commit = 2;
  // Digest of what differs from the commit; empty when the work tree is clean.
  string changes = 3;
  repeated StrategyEntry strategies = 4;
  repeated StrategyModuleError errors = 5;
  repeated FactorEntry factors = 6;
}

// A factor: a public function of a module in the repository's factors/
// directory, named <module>.<function>. Its parameters named after bar fields
// receive them; the others are its settings, each with a default.
message FactorEntry {
  string id = 1;
  string description = 2; // the function's docstring
  repeated string inputs = 3; // bar fields, in the function's order
  repeated StrategyParameter parameters = 4;
}

// A factor evaluated across symbols: each day its values rank the symbols
// against their returns over the following bars. Symbols are contracts,
// products' dominant series or whole exchanges (every product of it).
message FactorRun {
  string repository = 1;
  string factor = 2;
  map<string, asterion.strategy.proto.ParameterValue> params = 3;
  repeated string symbols = 5;
  string begin_day = 6;
  string end_day = 7;
  repeated uint32 horizons = 8; // bars ahead; the first is the one groups use
  uint32 groups = 9;
  // Empty on a new UI request: Lab resolves it once before starting the child.
  // An explicit identity reuses that immutable version or fails if unavailable.
  string dataset_version = 10;
}
// The rank correlation (IC) of the factor with returns `horizon` bars ahead,
// over the days with at least three symbols.
message FactorHorizon {
  uint32 horizon = 1;
  uint32 days = 2;
  optional double mean = 3;
  optional double deviation = 4;
  optional double ir = 5; // mean / deviation
  optional double t = 6; // ir * sqrt(days)
  optional double positive = 7; // share of days above zero
}
message FactorDay {
  string trading_day = 1;
  uint32 symbols = 2; // with a factor value
  optional double ic = 3; // at the first horizon
  // Cumulative returns of each group, lowest factor first, and of the highest
  // group less the lowest; absent until the first day with enough symbols.
  repeated double groups = 4;
  optional double long_short = 5;
}
message FactorGroup {
  uint32 group = 1; // 1 holds the lowest values
  optional double mean_return = 2; // per bar
  optional double turnover = 3; // share of members new each day
}
// A product of an exchange that was left out, and why.
message FactorSkipped {
  string symbol = 1;
  string reason = 2;
}
message FactorResult {
  string commit = 1;
  string changes = 2;
  string dataset_version = 3;
  repeated string symbols = 4; // as evaluated
  repeated FactorSkipped skipped = 5;
  repeated FactorHorizon horizons = 6;
  repeated FactorDay days = 7;
  repeated FactorGroup groups = 8;
}

// The costs of one product, as COSTS in asterion_lab/backtest.py names them:
// margin_per_lot, open_fee, close_today_fee, close_yesterday_fee, margin_rate,
// open_fee_rate, close_today_fee_rate, close_yesterday_fee_rate; exact decimals.
message ProductCosts {
  string product = 1; // EXCHANGE/product
  repeated string values = 2;
}
// A strategy of the repository over the research dataset's bars. A symbol is a
// contract (EXCHANGE/product/YYYY-MM) or a product's traded dominant series
// (EXCHANGE/product). Amounts are exact decimals. Accepted when the run has
// started; its record says how it ends.
message BacktestRun {
  string id = 1;
  string repository = 2;
  string strategy = 3; // <module>.<class>
  map<string, asterion.strategy.proto.ParameterValue> params = 4;
  repeated string symbols = 6;
  string begin_day = 7;
  string end_day = 8;
  string deposit = 9;
  repeated ProductCosts costs = 10;
  uint32 slippage_ticks = 11;
  string max_order_lots = 12;
  string max_gross_lots = 13;
  uint32 max_working_orders = 14;
  // What ctx.weights may ask for in all, gross and net, as shares of equity.
  string max_gross_weight = 15;
  string max_net_weight = 16;
  // Statistics: periods in a year (0 for none) and an explicitly zero
  // risk-free rate; without both the Sharpe ratio is absent. Days from
  // holdout_day on are also measured apart from the days before it.
  double annual_periods = 17;
  bool zero_risk_free = 18;
  string holdout_day = 19;
  // Bars of this many minutes (1, 5, 10, 15, 30 or 60) from the stored
  // minutes; daily bars when 0.
  uint32 minutes = 20;
  // The research dataset's version, resolved once at admission and shared by
  // every candidate and rolling run of a sweep. Child processes read it,
  // never the latest one.
  string dataset_version = 22;
  // Fixed at admission like the versions above: the strategy is imported from
  // this copy of the repository's Python files, taken at this commit and changes.
  string source = 24;
  string commit = 25;
  string changes = 26;
}
message RunsQuery {}
message CancelRun {
  string id = 1;
}
message RunSummary {
  string id = 1;
  string strategy = 2;
  string commit = 3;
  string changes = 4;
  string dataset_version = 5;
  string state = 6; // running, succeeded, failed, interrupted
  string error = 7;
  int64 started_ns = 8;
  int64 finished_ns = 9;
  // A metric without a value (a ratio of nothing) is absent.
  map<string, double> metrics = 10;
  // In a sweep's runs: the parameter values this run was given.
  map<string, asterion.strategy.proto.ParameterValue> params = 11;
  // The sweep this run is one combination of, if any.
  string sweep = 12;
}
message Runs {
  repeated RunSummary runs = 1;
}

// The values one parameter takes in a sweep.
message ParameterValues {
  string name = 1;
  repeated asterion.strategy.proto.ParameterValue values = 2;
}
// The base run once for every combination of the parameters' values, at most
// 10000, each run its own record with id <sweep id>-<n>. At most `processes`
// runs at once (0: the processors less one); the rest wait their turn.
message Sweep {
  string id = 1;
  BacktestRun base = 2;
  repeated ParameterValues values = 3;
  uint32 processes = 4;
  // Rolling validation once every run has succeeded, instead of a holdout.
  WalkForward walk_forward = 5;
}
// Rounds select by the Sharpe ratio of `training_days` (at least 20) and are
// followed for `validation_days` (at least 1), at most 100 rounds; one account
// follows each round's choice (docs/lab.md). Its record is <sweep id>-rolling.
message WalkForward {
  uint32 training_days = 1;
  uint32 validation_days = 2;
}
// What the service gives the child that runs a sweep's rolling validation.
message RollingRun {
  string id = 1;
  string sweep = 2;
  BacktestRun base = 3;
  uint32 training_days = 4;
  uint32 validation_days = 5;
}
message SweepQuery {
  string id = 1;
}
// Runs of the sweep not started yet never start; those running end interrupted.
message CancelSweep {
  string id = 1;
}
// A sweep's runs in order. A run that has not started has no state yet, and
// one cancelled before it started never gets one. With a holdout day,
// `selected` names the run with the highest Sharpe ratio before the holdout,
// the first among equals, as the old comparison chose; empty when none has one.
message SweepRuns {
  string id = 1;
  repeated RunSummary runs = 2;
  uint32 waiting = 3;
  string selected = 4;
  // The rolling validation's account, once it has started.
  RunSummary rolling = 5;
  // Runs of the sweep, or its rolling validation, are still to start or to end.
  bool active = 6;
}

// One run's record for its result page. Amounts are exact decimals as text.
message RunQuery {
  string id = 1;
}
message RunEquity {
  int64 time_ns = 1;
  string equity = 2;
  bool settlement = 3; // a day's settlement, or the mark after a bar
}
message RunDay {
  string trading_day = 1;
  int64 time_ns = 2;
  string equity = 3;
  string balance = 4;
  string fees = 5;
  string margin = 6;
}
message RunFill {
  string fill = 1;
  string order = 2;
  int64 time_ns = 3;
  string contract = 4;
  string side = 5; // buy, sell
  string offset = 6; // open, close_today, close_yesterday
  string quantity = 7;
  string price = 8;
  string fee = 9;
}
message RunDetail {
  RunSummary summary = 1;
  // run.json as written when the run started: what reproduces it.
  string record = 2;
  repeated RunEquity equity = 3;
  repeated RunDay days = 4;
  repeated RunFill fills = 5;
}
