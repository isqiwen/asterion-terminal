syntax = "proto3";
package asterion.lab.proto;

// The Python research service. One per node, supervised by the Agent.
message Request {
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof body {
    HealthQuery health = 10;
    // Sent by Terminal's native layer only: the credential never passes
    // through the UI. The service keeps it in memory.
    ConfigureSource configure_source = 11;
    AcquireDaily acquire = 12;
    TasksQuery tasks = 13;
    CancelTask cancel = 14;
    SummaryQuery summary = 15;
    CoverageQuery coverage = 16;
    DailyBarsQuery daily_bars = 17;
    DominantQuery dominant = 18;
    SessionsQuery sessions = 19;
    CrossCheckQuery cross_check = 20;
    SourcesQuery sources = 21;
    SourceRead source_read = 22;
    SourceCoverageQuery source_coverage = 23;
  }
}
message HealthQuery {}
message ConfigureSource {
  string provider = 1;
  string credential = 2;
  uint32 requests_per_minute = 3;
  string host = 4;
  uint32 port = 5;
}
// Calendars, contract lists and daily bars of every exchange, for open days in
// [begin_day, end_day] (YYYY-MM-DD) not stored yet.
message AcquireDaily {
  string id = 1;
  string begin_day = 2;
  string end_day = 3;
  // Empty for every exchange.
  repeated string exchanges = 4;
  // Read stored days again, as after a change of the mapping rules. The new
  // version replaces their rows; earlier versions keep theirs.
  bool refresh = 5;
  string provider = 6;
  string table = 7;
  string contract = 8;
}
message TasksQuery {}
message CancelTask {
  string id = 1;
}
message SummaryQuery {
  string provider = 1;
}
message CoverageQuery {
  string provider = 1;
}
message DailyBarsQuery {
  string contract = 1; // EXCHANGE/product/YYYY-MM
  string provider = 4;
  string begin_day = 2;
  string end_day = 3;
}
// A product's dominant series in [begin_day, end_day]. The dominant month of a
// day has the largest open interest on the previous trading day among the
// current month and later ones that settle that day, never moving back; a
// change takes effect on the next trading day.
message DominantQuery {
  string exchange = 1;
  string product = 2;
  string begin_day = 3;
  string end_day = 4;
  // A traded series leaves a month on its last day and needs bars of the
  // outgoing month on the roll day; one only read does not.
  bool traded = 5;
  // "none", or "ratio": earlier months scaled to the level of the last one.
  string adjustment = 6;
  string provider = 7;
}
// The trading sessions of a product on the exchange's open days in
// [begin_day, end_day], from reviewed exchange documents.
message SessionsQuery {
  string provider = 5;
  string exchange = 1;
  string product = 2;
  string begin_day = 3;
  string end_day = 4;
}
// Compares a second source with the first over open days in [begin_day,
// end_day], at most 31 days. "settlement": the exchanges' settlement parameter
// files against Tushare's fut_settle, for the first products of decision D4.
// "daily": AKShare's daily bars against the warehouse. Nothing is stored.
message CrossCheckQuery {
  string kind = 1;
  string begin_day = 2;
  string end_day = 3;
}

message Response {
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof body {
    Health health = 10;
    Error error = 11;
    Accepted accepted = 12;
    Tasks tasks = 13;
    Summary summary = 14;
    Coverage coverage = 15;
    DailyBars daily_bars = 16;
    DominantSeries dominant = 17;
    Sessions sessions = 18;
    CrossCheck cross_check = 19;
    Sources sources = 21;
    SourceTable source_table = 22;
    SourceCoverage source_coverage = 23;
  }
}
message Health {
  // The service name it was started as; a process restart keeps it.
  string instance_id = 1;
  string process_id = 2;
  string version = 3;
  uint64 uptime_ms = 4;
  bool initialized = 5;
  // Providers with a credential held in memory.
  repeated string configured_sources = 6;
}
message Error {
  string code = 1;
  string message = 2;
}
message Accepted {}
message Task {
  string id = 1;
  string begin_day = 2;
  string end_day = 3;
  string state = 4; // running, succeeded, failed, cancelled
  uint32 days_total = 5;
  uint32 days_done = 6;
  // Open days the vendor had no rows for yet; they are asked again next time.
  uint32 days_empty = 7;
  uint32 requests = 8;
  string error_code = 9;
  string error = 10;
  // The newest version this task committed.
  string dataset_version = 11;
  int64 started_ns = 12;
  int64 finished_ns = 13;
  string provider = 14;
  string table = 15;
  string contract = 16;
}
message Tasks {
  repeated Task tasks = 1;
}
message TableSummary {
  string table = 1;
  uint64 rows = 2;
  uint32 partitions = 3;
  string first_day = 4;
  string last_day = 5;
}
message Summary {
  string dataset_version = 1;
  int64 created_ns = 2;
  repeated TableSummary tables = 3;
}
// Of each product and month: the days with daily bars, and the exchange's open days.
message MonthCoverage {
  string month = 1; // YYYY-MM
  uint32 days = 2;
  uint32 open_days = 3;
}
message ProductCoverage {
  string exchange = 1;
  string product = 2;
  repeated MonthCoverage months = 3;
}
message Coverage {
  string dataset_version = 1;
  repeated ProductCoverage products = 2;
}
message DailyBar {
  string day = 1;
  // Exact decimals as text; empty when absent.
  string open = 2;
  string high = 3;
  string low = 4;
  string close = 5;
  string settlement = 6;
  string volume = 7;
  string open_interest = 8;
}
message DailyBars {
  string dataset_version = 1;
  string contract = 2;
  repeated DailyBar bars = 3;
}
message DominantDay {
  string day = 1;
  string contract = 2;
  // Exact decimals as text, adjusted as asked; empty when the month did not
  // trade or settle that day.
  string open = 3;
  string high = 4;
  string low = 5;
  string close = 6;
  string settlement = 7;
}
message Roll {
  string day = 1;
  string from_contract = 2;
  string to_contract = 3;
  // New over old settlement on the trading day before the roll.
  string ratio = 4;
}
message DominantSeries {
  string dataset_version = 1;
  string adjustment = 2;
  repeated DominantDay days = 3;
  repeated Roll rolls = 4;
}
// Beijing time, "YYYY-MM-DD HH:MM".
message SessionSegment {
  string begin = 1;
  string end = 2;
}
message SessionDay {
  string trading_day = 1;
  // No reviewed rule covers the day session: its times are unknown.
  bool day_known = 2;
  repeated SessionSegment day = 3;
  // held; none (the product has no night session); holiday_eve (none before a
  // statutory holiday); unknown (no reviewed rule, or a period not established).
  string night_state = 4;
  SessionSegment night = 5;
  repeated string sources = 6;
}
message SessionSource {
  string id = 1;
  string title = 2;
  string url = 3;
  string published = 4;
  string note = 5;
}
message Sessions {
  string reviewed = 1;
  repeated SessionDay days = 2;
  repeated SessionSource sources = 3;
}
message CheckDifference {
  string contract = 1;
  string field = 2;
  string first = 3; // Tushare
  string second = 4; // the exchange's file, or AKShare
}
message CheckGroup {
  string exchange = 1;
  string day = 2;
  // Why this exchange has no second source; nothing is compared then.
  string unavailable = 3;
  uint32 compared_rows = 4;
  uint32 compared_values = 5;
  repeated string only_first = 6;
  repeated string only_second = 7;
  repeated CheckDifference differences = 8;
  // What the check could not compare, and why.
  string note = 9;
}
message CrossCheck {
  string kind = 1;
  repeated CheckGroup groups = 2;
}

// All data sources expose the same catalogue, coverage and partition-read operations.
message SourcesQuery {}
message SourceDescriptor {
  string id = 1;
  repeated string tables = 2;
  repeated string exchanges = 3;
  bool requires_credential = 4;
  bool requires_endpoint = 5;
  bool configured = 6;
}
message Sources {
  repeated SourceDescriptor sources = 1;
}
message SourceRead {
  string provider = 1;
  string table = 2;
  string exchange = 3;
  string day = 4; // One dated partition; calendars return that year.
  string contract = 5;
}
message SourceCell {
  optional string value = 1;
} // Decimal text; absent means unknown.
message SourceRow {
  repeated SourceCell cells = 1;
}
message SourceTable {
  string provider = 1;
  string table = 2;
  repeated string columns = 3;
  repeated SourceRow rows = 4;
  // Recorder-wide observation intervals, not per-contract completeness.
  repeated SourceObservation observations = 5;
}
message SourceObservation {
  string instance = 1;
  uint64 number = 2;
  int64 first_received_ms = 3;
  int64 last_received_ms = 4;
  uint64 ticks = 5;
  string end = 6;
}
message SourceCoverageQuery {
  string provider = 1;
}
message SourceCoverage {
  string provider = 1;
  bool known = 2;
  repeated string days = 3;
  string note = 4;
}
