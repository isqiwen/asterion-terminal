syntax = "proto3";
package asterion.data.proto;
import "asterion/data.proto";
import "asterion/resource.proto";
import "asterion/trading.proto";
import "asterion/node.proto";
import "asterion/task.proto";
import "asterion/market.proto";
import "asterion/material.proto";
import "asterion/intelligence.proto";

message DataId {
  string id = 1;
}
message DataSources {
  repeated HistorySource sources = 1;
}
// Stable instance identity belongs to the warehouse, not to an OS process.
message DataHealth {
  string instance_id = 1;
  string process_id = 2;
  string version = 3;
  uint64 uptime_ms = 4;
  bool initialized = 5;
  bool recovery_required = 6;
  reserved 7;
}
// Configured share for this Data instance, not an inferred provider entitlement.
message DownloadBudgetPolicy {
  reserved 1;
  string provider_id = 2;
  uint32 requests_per_minute = 3;
}
message DownloadBudgetConfiguration {
  string source = 1;
  string credential = 2;
  uint32 requests_per_minute = 3;
}
message DownloadPermit {
  bool granted = 1;
  uint32 retry_after_ms = 2;
}
// Data owns this single-partition acquisition path; task structures are observations only.
message AcquisitionSubmit {
  string id = 1;
  string authorization = 2;
}
message AcquisitionTaskRequest {
  oneof operation {
    AcquisitionSubmit submit = 1;
    DataId get = 2;
    DataId cancel = 3;
    DataId retry = 4;
    DataId result = 5;
    asterion.task.proto.TaskListQuery list = 6;
    asterion.task.proto.TaskMetadataEdit metadata_edit = 7;
    DataId history_usage = 8;
    asterion.task.proto.TaskRetirementRequest retirement = 9;
    DataId active_history_usage = 10;
    MaterialRequest material_submit = 11;
  }
}
message AcquisitionTaskResponse {
  asterion.task.proto.Task task = 1;
  asterion.task.proto.TaskList tasks = 2;
  TableUpdateResult table_update = 3;
  MinuteDownloadResult minutes = 4;
  HistoryUsage history_usage = 5;
  asterion.task.proto.TaskRetirement retirement = 6;
  MaterialReceipt material = 7;
}
// Data is the authority for retention of its immutable published versions.
message DataVersion {
  enum Kind {
    UNSPECIFIED = 0;
    MINUTE_VERSION = 1;
    TABLE_SNAPSHOT = 2;
  }

  Kind kind = 1;
  string version = 2;
}
message DataRetention {
  DataOwner source = 1;
  asterion.resource.proto.Object consumer = 2;
  repeated DataVersion versions = 3;
}
message DataRetentionRecord {
  enum Phase {
    UNSPECIFIED = 0;
    PREPARED = 1;
    CONFIRMED = 2;
    RELEASED = 3;
  }

  DataRetention retention = 1;
  Phase phase = 2;
}
message DataRetentionRequest {
  oneof operation {
    DataRetention prepare = 1;
    DataRetention confirm = 2;
    asterion.resource.proto.Object get = 3;
    asterion.resource.proto.Object release = 4;
  }
}
message MinuteRetirementRequest {
  string id = 1;
  bool execute = 2; // false is a read-only preview, never permission to delete later.
}
message MinuteRetirement {
  enum State {
    UNSPECIFIED = 0;
    AVAILABLE = 1;
    BLOCKED = 2;
    PENDING = 3;
    REMOVED = 4;
  }

  string id = 1;
  State state = 2;
  HistoryUsage internal_usage = 3;
  repeated DataRetentionRecord holds = 4;
  optional uint64 payload_bytes = 5; // allocated payload bytes observed during this preview
}
message MinuteRetirementsQuery {
  string after = 1;
  uint32 limit = 2;
}
message MinuteRetirements {
  repeated MinuteRetirement items = 1;
  string next_after = 2;
}
message TableRetirementRequest {
  string id = 1;
  bool execute = 2;
  string preview_digest = 3;
}
message TableRetirement {
  enum State {
    UNSPECIFIED = 0;
    AVAILABLE = 1;
    BLOCKED = 2;
    PENDING = 3;
    REMOVED = 4;
  }

  string id = 1;
  State state = 2;
  uint64 sequence = 3;
  bool current_head = 4;
  repeated string acquisitions = 5;
  HistoryUsage named_usage = 6;
  repeated DataRetentionRecord holds = 7;
  optional uint64 payload_bytes = 8;
  repeated string objects = 9;
  string preview_digest = 10;
}
message TableRetirements {
  repeated TableRetirement items = 1;
  string next_after = 2;
}
message ObservationAdmission {
  string id = 1;
  asterion.resource.proto.Object source = 2;
}
message ObservationOperation {
  enum State {
    UNSPECIFIED = 0;
    ADMITTED = 1;
    PUBLISHED = 2;
  }

  string id = 1;
  asterion.resource.proto.Object source = 2;
  asterion.resource.proto.Object archive = 3;
  State state = 4;
  int64 admitted_at_ms = 5;
  int64 published_at_ms = 6;
}
message ObservationQuery {
  oneof action {
    ObservationAdmission admit = 1;
    string execute = 2;
    string read = 3;
  }
}
message ObservationStatus {
  ObservationOperation operation = 1;
  asterion.market.proto.ObservationCapture capture = 2;
}
message DataRequest {
  reserved 13, 18, 20, 26;
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof operation {
    asterion.protocol.proto.Empty heartbeat = 10;
    asterion.node.proto.Quiesce quiesce = 11;
    asterion.protocol.proto.Empty sources = 12;
    HistoryConnectionVerify verify_connection = 14;
    HistoryFilter datasets = 15;
    DataId record = 16;
    MinutePageQuery minute_page = 17;
    BarDatasetRequest bar_dataset = 19;
    NamedDataset save_dataset = 21;
    DataId saved_dataset = 22;
    asterion.protocol.proto.Empty saved_datasets = 23;
    HistoryUpdateQuery update_plan = 24;
    DominantSeriesRequest dominant_series = 25;
    DataId history_usage = 27;
    DownloadAuthorizationRequest authorize_download = 28;
    DataId download_authorization = 29;
    DownloadAllocation allocate_download = 30;
    DownloadPreparation prepare_download = 31;
    DownloadPublication publish_download = 32;
    DownloadIdentity published_download = 33;
    DownloadIdentity download_credentials = 34;
    DownloadBudgetConfiguration configure_download_budget = 35;
    DownloadIdentity acquire_download_permit = 36;
    asterion.protocol.proto.Empty table_coverage = 37;
    TablePageQuery table_page = 38;
    TablePlanQuery table_plan = 39;
    TablePartitionRows store_table_partition = 40;
    TableSeriesRequest table_series = 41;
    TableProductsQuery table_products = 42;
    TableDailyQuery table_daily = 43;
    HistoryCoverageQuery coverage = 44;
    TableContractsQuery table_contracts = 45;
    TableListedContractsQuery table_listed_contracts = 46;
    MinuteEvidenceQuery minute_evidence = 47;
    MinuteRangeQuery minute_range = 48;
    TableRefreshQuery table_refresh_plan = 49;
    HistoricalMarginQuery historical_margins = 50;
    AcquisitionTaskRequest acquisition_task = 51;
    DataRetentionRequest retention = 52;
    MinuteRetirementRequest minute_retirement = 53;
    MinuteRetirementsQuery minute_retirements = 54;
    TableRetirementRequest table_retirement = 55;
    DataId table_retirements = 56;
    asterion.resource.proto.CatalogueQuery resources = 57;
    ObservationQuery observation = 58;
    asterion.protocol.proto.Empty material_sources = 59;
    MaterialReadQuery material_read = 60;
    asterion.resource.proto.Object intelligence_save = 61;
    asterion.resource.proto.Object intelligence_read = 62;
    asterion.resource.proto.Object intelligence_change_save = 63;
    asterion.resource.proto.Object intelligence_change_read = 64;
    asterion.resource.proto.Object intelligence_set_save = 65;
    asterion.resource.proto.Object intelligence_set_read = 66;
  }
}
message DataResponse {
  reserved 13, 18, 25;
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof result {
    asterion.protocol.proto.Error error = 10;
    DataHealth health = 11;
    DataSources sources = 12;
    HistoryConnectionVerification connection_verification = 14;
    HistoryDatasets datasets = 15;
    HistoryRecord record = 16;
    MinutePage minute_page = 17;
    BarDataset bar_dataset = 19;
    HistoryCoverages coverage = 20;
    NamedDataset saved_dataset = 21;
    NamedDatasets saved_datasets = 22;
    HistoryUpdatePlan update_plan = 23;
    DominantSeriesPreview dominant_series = 24;
    HistoryUsage history_usage = 26;
    DownloadAuthorization download_authorization = 27;
    DownloadDirectory download_directory = 28;
    PreparedDownload prepared_download = 29;
    PublishedDownload published_download = 30;
    DownloadCredentials download_credentials = 31;
    DownloadBudgetPolicy download_budget = 32;
    DownloadPermit download_permit = 33;
    TableCoverage table_coverage = 34;
    TablePage table_page = 35;
    TableUpdatePlan table_plan = 36;
    TablePartitionReceipt table_partition = 37;
    TableSeriesGroup table_series = 38;
    TableProducts table_products = 39;
    TableDailyPage table_daily = 40;
    HistoryCatalog table_contracts = 41;
    TableListedContracts table_listed_contracts = 42;
    MinuteEvidence minute_evidence = 43;
    MinuteRangeEvidence minute_range = 44;
    TableRefreshPlan table_refresh_plan = 45;
    HistoricalMargins historical_margins = 46;
    AcquisitionTaskResponse acquisition_task = 47;
    DataRetentionRecord retention = 48;
    MinuteRetirement minute_retirement = 49;
    MinuteRetirements minute_retirements = 50;
    TableRetirement table_retirement = 51;
    TableRetirements table_retirements = 52;
    asterion.resource.proto.Catalogue resources = 53;
    ObservationStatus observation = 54;
    MaterialSources material_sources = 55;
    MaterialRead material_read = 56;
    asterion.intelligence.proto.NoticeStorageReceipt intelligence_saved = 57;
    asterion.intelligence.proto.NoticeStoredContent intelligence_content = 58;
    asterion.intelligence.proto.NoticeStoredChange intelligence_change_content = 59;
    asterion.intelligence.proto.NoticeStoredSet intelligence_set_content = 60;
  }
}
