syntax = "proto3";
package asterion.research.proto;
import "asterion/resource.proto";

// Research organisation and declared judgement, never executable trading rules.
message ProjectDefinition {
  string title = 1;
  string question = 2;
  string hypothesis = 3;
  string mechanism = 4;
  string scope = 5;
  string data_needs = 6;
  string evaluation = 7;
  string support = 8;
  string refutation = 9;
  string limitations = 10;
  string notes = 11;
  repeated string sources = 12;
}
message ProjectDraft {
  string id = 1;
  asterion.resource.proto.Owner owner = 2;
  ProjectDefinition definition = 3;
  string digest = 4;
  int64 updated_at_ms = 5;
}
message HypothesisPlan {
  string id = 1;
  string project_id = 2;
  asterion.resource.proto.Owner owner = 3;
  ProjectDefinition definition = 4;
  string definition_digest = 5;
  int64 recorded_at_ms = 6;
  string parent_plan_id = 7;
  string revision_reason = 8;
  bool exploratory = 9;
}
message ProjectBinding {
  string project_id = 1;
  string plan_id = 2;
  string definition_digest = 3;
  asterion.resource.proto.Owner owner = 4;
}
message ProjectDraftSave {
  string project_id = 1;
  string expected_digest = 2;
  ProjectDefinition definition = 3;
}
message HypothesisFix {
  string plan_id = 1;
  string project_id = 2;
  string expected_draft_digest = 3;
  string parent_plan_id = 4;
  string revision_reason = 5;
}

enum ConclusionJudgment {
  CONCLUSION_JUDGMENT_UNSPECIFIED = 0;
  SUPPORTED = 1;
  REFUTED = 2;
  INSUFFICIENT = 3;
}

// Human interpretation of an exact formal result, never an automatic metric verdict.
message ConclusionWrite {
  string id = 1;
  ProjectBinding plan = 2;
  asterion.resource.proto.Object result = 3;
  ConclusionJudgment judgment = 4;
  string reason = 5;
  string previous_id = 6;
  string revision_reason = 7;
}
message ProjectConclusion {
  ConclusionWrite declaration = 1;
  string input_sha256 = 2;
  string program_artifact = 3;
  bool retrospective = 4; // Derived from the task admission binding, never client supplied.
  int64 recorded_at_ms = 5;
  string digest = 6;
}
message ProjectMutation {
  string id = 1; // Durable operation identity, independent of transport correlation.
  oneof operation {
    ProjectDraftSave save = 2;
    HypothesisFix fix = 3;
    ConclusionWrite conclude = 4;
  }
}
message ProjectReply {
  ProjectDraft draft = 1;
  HypothesisPlan plan = 2;
  repeated ProjectDraft drafts = 3;
  repeated HypothesisPlan plans = 4;
  string next_after = 5;
  ProjectConclusion conclusion = 6;
  repeated ProjectConclusion conclusions = 7;
}
message ProjectLookup {
  string id = 1;
}
message ProjectList {
  string project_id = 1;
  string after = 2;
  uint32 limit = 3;
}
message ProjectRequest {
  oneof operation {
    ProjectMutation mutation = 1;
    ProjectLookup draft = 2;
    ProjectLookup plan = 3;
    ProjectList drafts = 4;
    ProjectList plans = 5;
    ProjectLookup conclusion = 6;
    ProjectList conclusions = 7;
  }
}
