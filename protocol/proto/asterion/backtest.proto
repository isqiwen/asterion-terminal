syntax = "proto3";
package asterion.backtest.proto;
import "asterion/domain.proto";
import "asterion/trading.proto";
import "asterion/data.proto";

// Explicit model parameters for the single ordinary daily contract. The source
// is a user-supplied explanation, not a claim of verified provider provenance.
// A rate is a fraction, applied symmetrically after that day's P&L settlement.
message SettlementMargin {
  string trading_day = 1;
  asterion.protocol.proto.Decimal rate = 2;
  string source = 3;
}

// Immutable data resolved by Data and captured with calculation parameters by Task. paper.contracts hold the bars
// and trading days of each contract; the strategy runs on every contract.
message BacktestInput {
  reserved 1;
  string dataset_revision = 2;
  asterion.protocol.proto.PaperInput paper = 3;
  // One strategy is replayed as it is. Several, up to 32 and all different,
  // are compared on the trading days before `holdout_day` alone, and the one
  // those days favour is replayed over every day.
  repeated asterion.protocol.proto.Strategy strategies = 4;
  repeated asterion.data.proto.DominantSchedule series = 5;
  // Several strategies are compared in one of two ways. The first trading day
  // kept out of the comparison; empty with one strategy or a rolling one.
  string holdout_day = 6;
  // A rolling comparison; absent with one strategy or a holdout.
  BacktestWalkForward walk_forward = 7;
  repeated SettlementMargin settlement_margins = 8;
  asterion.data.proto.HistoricalMargins historical_margins = 9;
}
// A comparison that rolls forward by trading days. Each round scores the
// strategies over `training_days` and the account follows the best of them
// over the `validation_days` after; the next round begins `validation_days`
// later, and the last takes the days that remain. Before the first round's
// validation days the account holds nothing.
message BacktestWalkForward {
  uint32 training_days = 1;
  uint32 validation_days = 2;
}
// Month contracts of one product traded as its dominant series: on each
// trading day only the dominant month is traded, and one strategy runs on the
// series. Indexes refer to the contracts of the request; or the series is a
// product of the daily table, whose months Data finds.
message DominantSeries {
  repeated uint32 contracts = 1;
  ProductSeries product = 2;
}
// A product's daily bars in the market-wide daily table, traded as its
// dominant series. The months that trade become contracts with these costs.
message ProductSeries {
  asterion.data.proto.ProductBarsRequest data = 1;
  asterion.protocol.proto.CostSchedule cost_schedule = 2;
  uint32 slippage_ticks = 3;
}
// One contract of a backtest submission: Data resolves its bars before Task captures the input.
message BacktestContract {
  asterion.data.proto.BarDatasetRequest data = 1;
  asterion.protocol.proto.CostSchedule cost_schedule = 2;
  // Price increments every fill of the contract gives up.
  uint32 slippage_ticks = 3;
}
// Reuse is resolved from Task-owned verified input, never client observations.
message BacktestReuse {
  enum DataChoice {
    DATA_CHOICE_UNSPECIFIED = 0;
    FIXED = 1;
    NEW_SNAPSHOT = 2;
  }

  string source_id = 1;
  string source_result_digest = 2;
  string source_input_sha256 = 3;
  DataChoice choice = 4;
  string snapshot = 5;
  optional uint32 slippage_ticks = 6; // fixed-data single-contract sensitivity only
}
message BacktestRequest {
  repeated BacktestContract contracts = 1;
  asterion.protocol.proto.Decimal deposit = 2;
  asterion.protocol.proto.RiskLimits risk = 3;
  repeated asterion.protocol.proto.Strategy strategies = 4;
  repeated DominantSeries series = 5;
  // A date; the holdout begins on the first trading day on or after it.
  // Empty with one strategy or a rolling comparison.
  string holdout_from = 6;
  BacktestWalkForward walk_forward = 7;
  repeated SettlementMargin settlement_margins = 8;
  string margin_snapshot = 9;
}

enum EquityEvent {
  EQUITY_EVENT_UNSPECIFIED = 0;
  TRADE_MARK = 1;
  DAILY_SETTLEMENT = 2;
}

message EquityPoint {
  int64 timestamp_ns = 1;
  asterion.protocol.proto.Decimal equity = 2;
  EquityEvent event = 3;
}
message ContractSettlement {
  string venue = 1;
  string symbol = 2;
  asterion.protocol.proto.Decimal price = 3;
  asterion.protocol.proto.Decimal position_quantity = 4; // Net lots: long positive, short negative.
  // Optional gross lots and per-position-lot margin observed after settlement.
  // Absent on earlier results; net lots alone cannot reconstruct these.
  asterion.protocol.proto.Decimal gross_quantity = 5;
  asterion.protocol.proto.Decimal margin = 6;
}
message SettlementOccupancy {
  asterion.protocol.proto.Decimal margin = 1;
  asterion.protocol.proto.Decimal available = 2;
  asterion.protocol.proto.Decimal frozen = 3;
}
// Before/after refer to the same settled prices and positions. Final occupancy
// is in DaySettlement. No cash, fees or positions change during revaluation.
message MarginRevaluation {
  asterion.protocol.proto.Decimal previous_rate = 1;
  asterion.protocol.proto.Decimal rate = 2;
  asterion.protocol.proto.Decimal margin_before = 3;
  asterion.protocol.proto.Decimal available_before = 4;
}
message DaySettlement {
  string trading_day = 1;
  int64 timestamp_ns = 2;
  asterion.protocol.proto.Decimal balance = 3;
  asterion.protocol.proto.Decimal equity = 4;
  asterion.protocol.proto.Decimal realized = 5;
  asterion.protocol.proto.Decimal fees = 6;
  repeated ContractSettlement contracts = 7;
  SettlementOccupancy occupancy = 8; // optional observed model funds, not intraday peaks
  MarginRevaluation margin_revaluation = 9;
}
// What the days before the holdout showed of one compared strategy. Nothing
// from the holdout is recorded for a strategy that was not chosen.
message BacktestCandidate {
  double total_return = 1;
  double max_drawdown = 2;
  // Yearly Sharpe ratio; absent when the daily returns do not vary.
  optional double sharpe = 3;
}
// One round of a rolling comparison: what its training days showed of every
// strategy, in input order, and the one the account followed from first_day
// through its validation days. None is selected when none has a ratio.
message BacktestFold {
  string first_day = 1;
  repeated BacktestCandidate candidates = 2;
  optional uint32 selected = 3;
}
// Optional observations, recorded only for single-contract daily replays.
message BacktestFillDay {
  string fill_id = 1;
  string trading_day = 2;
}
message BacktestResult {
  reserved 1;
  string dataset_revision = 2;
  reserved 3;
  asterion.protocol.proto.Snapshot account = 4;
  repeated EquityPoint equity = 5;
  asterion.protocol.proto.Decimal max_drawdown = 6;
  repeated DaySettlement settlements = 7;
  // With several strategies: one entry per strategy in input order, and the
  // index of the one with the highest development Sharpe ratio, whose replay
  // the rest of this result is.
  repeated BacktestCandidate candidates = 8;
  uint32 selected = 9;
  // With a rolling comparison instead: its rounds, and the rest of this
  // result is the one account that followed each round's strategy in turn.
  repeated BacktestFold folds = 10;
  repeated BacktestFillDay fill_days = 11; // empty means no fill-date evidence
}
