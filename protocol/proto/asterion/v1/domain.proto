syntax = "proto3";
package asterion.protocol.v1;

// All authoritative decimal values use exactly eight fractional decimal places.
message Decimal { sint64 units = 1; }
message Contract {
  string venue = 1;
  string symbol = 2;
  string currency = 3;
  Decimal price_increment = 4;
  Decimal quantity_increment = 5;
  Decimal multiplier = 6;
  string product = 7;
  string delivery_month = 8;
}
// One OHLCV period of a single contract. trading_day is YYYY-MM-DD.
message Bar {
  string trading_day = 1;
  int64 timestamp_ns = 2;
  Decimal open = 3;
  Decimal high = 4;
  Decimal low = 5;
  Decimal close = 6;
  Decimal volume = 7;
}
// Provider settlement price of one trading day.
message TradingDay { string trading_day = 1; Decimal settlement_price = 2; }
