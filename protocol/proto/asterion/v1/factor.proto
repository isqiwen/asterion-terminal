syntax = "proto3";
import "asterion/v1/domain.proto";
import "asterion/v1/data.proto";
package asterion.factor.v1;
import "asterion/v1/trading.proto";

// Immutable bars resolved by the data service; no account or execution assumptions.
message FactorInput {
  uint32 version = 1; // 5
  string dataset_revision = 2;
  reserved 3, 4, 5;
  asterion.data.v1.BarDataset dataset = 11;
  repeated uint32 lookbacks = 9; // Strictly ascending, unique; 1..32 candidates.
  uint32 horizon = 6;
  // Required explicit evaluation; full_sample must be true.
  oneof evaluation {
    bool full_sample = 7;
    WalkForwardEvaluation walk_forward = 10;
    uint32 holdout_start = 8; // Zero-based first holdout bar.
  }
}
// Client submission: Task obtains the fixed dataset from Data before persisting input.
message FactorRequest {
  asterion.data.v1.BarDatasetRequest data = 1;
  repeated uint32 lookbacks = 2;
  uint32 horizon = 3;
  oneof evaluation {
    bool full_sample = 4;
    WalkForwardEvaluation walk_forward = 5;
    uint32 holdout_start = 6;
  }
}
message WalkForwardEvaluation {
  uint32 training_events = 1;
  uint32 validation_events = 2;
}
message FactorSample {
  uint32 event_index = 1;
  int64 timestamp_ns = 2;
  int64 label_timestamp_ns = 3;
  double value = 4;
  double forward_return = 5;
}
message FactorResult {
  uint32 version = 1;
  string dataset_revision = 2;
  string engine_version = 3;
  uint32 lookback = 4;
  uint32 horizon = 5;
  uint32 input_count = 6;
  repeated FactorSample samples = 7;
  reserved 8, 9;
  repeated FactorPartition partitions = 10;
  uint32 purged_count = 11;
  string selection_rule = 12;
  repeated FactorCandidate candidates = 13; // Development scores only.
  uint32 evaluation_warmup = 14;
  repeated FactorFold folds = 15;
}
message FactorCandidate {
  uint32 lookback = 1;
  uint32 sample_count = 2;
  optional double development_spearman = 3;
}
message FactorPartition {
  string name = 1;
  uint32 begin_index = 2;
  uint32 end_index = 3; // Exclusive event boundary, labels stay inside.
  uint32 sample_count = 4;
  // Absence means zero variance, never an invented zero correlation.
  optional double pearson = 5;
  optional double spearman = 6;
}

message FactorFold {
  uint32 training_begin = 1;
  uint32 training_end = 2;
  uint32 validation_end = 3;
  uint32 lookback = 4;
  repeated FactorCandidate candidates = 5;
  FactorPartition development = 6;
  FactorPartition holdout = 7;
}

// Daily close task retains provider trading dates. No trade timestamps,
// synthetic quantities, contract multiplier or execution assumptions.
message DailyFactorDataset {
  uint32 version = 1; // 2
  reserved 2; string source_dataset_id = 7;
  string source = 3;
  reserved 4; string contract_id = 20;
  string manifest_sha256 = 5;
  repeated asterion.data.v1.DailyBar bars = 6;
  asterion.data.v1.HistoryVersionEvidence history_evidence = 8;
}
message DailyFactorInput {
  uint32 version = 1;
  string dataset_revision = 2;
  DailyFactorDataset dataset = 3;
  uint32 lookback = 4;
  uint32 horizon = 5;
  oneof evaluation {
    bool full_sample = 6;
    uint32 holdout_start = 7;
  }
}
message DailyFactorSample {
  uint32 observation_index = 1;
  string trading_day = 2;
  string label_day = 3;
  double value = 4;
  double forward_return = 5;
}
message DailyFactorResult {
  uint32 version = 1;
  string dataset_revision = 2;
  string engine_version = 3;
  uint32 lookback = 4;
  uint32 horizon = 5;
  uint32 input_count = 6;
  repeated DailyFactorSample samples = 7;
  repeated FactorPartition partitions = 8;
  uint32 purged_count = 9;
}

// Clients select a service-owned completed download; they cannot upload bars or provenance.
message DailyFactorRequest {
  reserved 1; string source_dataset_id = 6;
  uint32 lookback = 2;
  uint32 horizon = 3;
  oneof evaluation { bool full_sample = 4; uint32 holdout_start = 5; }
}
