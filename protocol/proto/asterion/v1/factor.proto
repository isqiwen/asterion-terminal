syntax = "proto3";
import "asterion/v1/domain.proto";
import "asterion/v1/data.proto";
package asterion.factor.v1;
import "asterion/v1/trading.proto";

// Months of one product read as its dominant series. On each trading day the
// observations are the bars of the month the schedule names, each close
// multiplied by that roll's factor; the bars a month keeps past its last
// dominant day are not read.
message DominantBars {
  repeated asterion.data.v1.BarDataset months = 1;
  asterion.data.v1.DominantSchedule schedule = 2;
}
// One instrument's ordered closes, fixed by the data service. Bars keep their
// label timestamps; daily closes keep provider trading dates. Neither carries
// account or execution assumptions into a factor.
message FactorSeries {
  oneof source {
    asterion.data.v1.BarDataset bars = 1;
    DailyFactorDataset daily = 2;
    DominantBars dominant = 3;
  }
}
message FactorInput {
  uint32 version = 1; // 7
  string dataset_revision = 2; // The revision of the series.
  // One series is evaluated over its own observations. Three to twenty of the
  // same period, each a different contract or product, are evaluated across
  // them on the observations they all have; nothing is filled in. Windows,
  // horizon and boundaries count those shared observations.
  repeated FactorSeries series = 3;
  repeated uint32 lookbacks = 4; // Strictly ascending, unique; 1..32 candidates.
  uint32 horizon = 5;
  // Required explicit evaluation; full_sample must be true.
  oneof evaluation {
    bool full_sample = 6;
    WalkForwardEvaluation walk_forward = 7;
    uint32 holdout_start = 8; // Zero-based first holdout observation.
  }
}
// What Data resolves into one fixed series: a bar selection, a published
// daily version, or the months of a product to read as its dominant series.
// Clients cannot upload observations or provenance.
message FactorSeriesRequest {
  oneof source {
    asterion.data.v1.BarDatasetRequest bars = 1;
    string daily_dataset_id = 2;
    asterion.data.v1.DominantSeriesRequest dominant = 3;
  }
}
// Client submission: Task obtains the fixed series from Data before persisting input.
message FactorRequest {
  repeated FactorSeriesRequest series = 1;
  repeated uint32 lookbacks = 2;
  uint32 horizon = 3;
  oneof evaluation {
    bool full_sample = 4;
    WalkForwardEvaluation walk_forward = 5;
    uint32 holdout_start = 6;
  }
}
message WalkForwardEvaluation {
  uint32 training_events = 1;
  uint32 validation_events = 2;
}
// A feature and its label, by observation index. When they were observed is
// read from the fixed input, not repeated here.
message FactorSample {
  uint32 event_index = 1;
  double value = 2;
  double forward_return = 3;
}
// Across several contracts at one shared observation: how their features
// relate to their labels. Absent where either does not vary across contracts.
message FactorCrossSection {
  uint32 event_index = 1;
  optional double pearson = 2;
  optional double spearman = 3;
}
message FactorResult {
  uint32 version = 1;
  string dataset_revision = 2;
  string engine_version = 3;
  uint32 lookback = 4;
  uint32 horizon = 5;
  uint32 input_count = 6; // Observations the series share.
  // One row per evaluated observation: samples for one series, cross-sections
  // for several. The other list is empty.
  repeated FactorSample samples = 7;
  repeated FactorCrossSection cross_sections = 8;
  repeated FactorPartition partitions = 9;
  uint32 purged_count = 10;
  string selection_rule = 11;
  repeated FactorCandidate candidates = 12; // Development scores only.
  uint32 evaluation_warmup = 13;
  repeated FactorFold folds = 14;
}
message FactorCandidate {
  uint32 lookback = 1;
  uint32 sample_count = 2;
  optional double development_spearman = 3;
}
message FactorPartition {
  string name = 1;
  uint32 begin_index = 2;
  uint32 end_index = 3; // Exclusive event boundary, labels stay inside.
  uint32 sample_count = 4; // Evaluated observations.
  // One series: the correlation over its samples. Several: the mean of the
  // cross-sections that are defined. Absence means no defined value, never an
  // invented zero correlation.
  optional double pearson = 5;
  optional double spearman = 6;
  // Several series only: that mean over the standard deviation of the
  // cross-sections; absent with fewer than two or when they do not vary.
  optional double pearson_ratio = 7;
  optional double spearman_ratio = 8;
}

message FactorFold {
  uint32 training_begin = 1;
  uint32 training_end = 2;
  uint32 validation_end = 3;
  uint32 lookback = 4;
  repeated FactorCandidate candidates = 5;
  FactorPartition development = 6;
  FactorPartition holdout = 7;
}

// Daily closes of one published version, with provider trading dates. No
// trade timestamps, synthetic quantities, contract multiplier or execution
// assumptions.
message DailyFactorDataset {
  uint32 version = 1; // 2
  string source_dataset_id = 2;
  string source = 3;
  string contract_id = 4;
  string manifest_sha256 = 5;
  repeated asterion.data.v1.DailyBar bars = 6;
  asterion.data.v1.HistoryVersionEvidence history_evidence = 7;
}
