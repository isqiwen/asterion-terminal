syntax = "proto3";
import "asterion/v1/domain.proto";
import "asterion/v1/data.proto";
package asterion.factor.v1;
import "asterion/v1/trading.proto";

// Months of one product read as its dominant series. On each trading day the
// observations are the bars of the month the schedule names, each close
// multiplied by that roll's factor; the bars a month keeps past its last
// dominant day are not read.
message DominantBars {
  repeated asterion.data.v1.BarDataset months = 1;
  asterion.data.v1.DominantSchedule schedule = 2;
}
// One instrument's ordered closes, fixed by the data service. Bars keep their
// label timestamps; the closes of the market-wide daily table keep provider
// trading dates. None carries account or execution assumptions into a factor.
message FactorSeries {
  reserved 2;
  oneof source {
    asterion.data.v1.BarDataset bars = 1;
    DominantBars dominant = 3;
    asterion.data.v1.TableSeries table = 4;
  }
}
message LiquidityRule {
  uint32 minimum_history = 1;
  int64 minimum_volume = 2;
  int64 minimum_open_interest = 3;
}

enum MembershipReason {
  MEMBERSHIP_UNSPECIFIED = 0;
  MEMBERSHIP_ELIGIBLE = 1;
  MEMBERSHIP_UNOBSERVED = 2;
  MEMBERSHIP_INSUFFICIENT_HISTORY = 3;
  MEMBERSHIP_UNKNOWN_VOLUME = 4;
  MEMBERSHIP_UNKNOWN_OPEN_INTEREST = 5;
  MEMBERSHIP_BELOW_VOLUME = 6;
  MEMBERSHIP_BELOW_OPEN_INTEREST = 7;
}

// One row for each raw fixed daily close, including warm-up and the tail.
// A series absent on a date is unobserved, not a fabricated zero observation.
message FactorMembership {
  uint32 series_index = 1;
  string trading_day = 2;
  MembershipReason reason = 3;
}
message FactorInput {
  reserved 1;
  string dataset_revision = 2; // The revision of the series.
  // One series is evaluated over its own observations. Three to a hundred of
  // the same period, each a different contract or product, are evaluated
  // across them: at every observation any of them has, those that have it.
  // Nothing is filled in. Windows, horizon and boundaries count the
  // observations of them all.
  repeated FactorSeries series = 3;
  LiquidityRule liquidity = 10; // Optional; market-wide daily cross-sections only.
  // The feature. The term structure is read of dominant series alone, on the
  // trading days that have a term point.
  asterion.protocol.v1.Factor factor = 4;
  repeated uint32 lookbacks = 5; // Strictly ascending, unique; 1..32 candidates.
  uint32 horizon = 6;
  // Required explicit evaluation; full_sample must be true.
  oneof evaluation {
    bool full_sample = 7;
    WalkForwardEvaluation walk_forward = 8;
    uint32 holdout_start = 9; // Zero-based first holdout observation.
  }
}
// What Data resolves into fixed series: a bar selection, the months of a
// product to read as its dominant series, or instruments of the market-wide
// daily table, which make one series each. Clients cannot upload
// observations or provenance.
message FactorSeriesRequest {
  reserved 2;
  oneof source {
    asterion.data.v1.BarDatasetRequest bars = 1;
    asterion.data.v1.DominantSeriesRequest dominant = 3;
    asterion.data.v1.TableSeriesRequest tables = 4;
  }
}
// Client submission: Task obtains the fixed series from Data before persisting input.
message FactorRequest {
  LiquidityRule liquidity = 8;
  // Admission-only guard for explicit reuse of fixed data; not a new input identity.
  string expected_dataset_revision = 9;
  repeated FactorSeriesRequest series = 1;
  asterion.protocol.v1.Factor factor = 2;
  repeated uint32 lookbacks = 3;
  uint32 horizon = 4;
  oneof evaluation {
    bool full_sample = 5;
    WalkForwardEvaluation walk_forward = 6;
    uint32 holdout_start = 7;
  }
}
message WalkForwardEvaluation {
  uint32 training_events = 1;
  uint32 validation_events = 2;
}
// A feature and its label, by observation index. When they were observed is
// read from the fixed input, not repeated here.
message FactorSample {
  uint32 event_index = 1;
  double value = 2;
  double forward_return = 3;
}
// Across several contracts at one observation: how the features of those that
// have one there relate to their labels.
// Absent with fewer than three, and where either does not vary across them.
message FactorCrossSection {
  uint32 event_index = 1;
  optional double pearson = 2;
  optional double spearman = 3;
  reserved 4;
  // Actual participants, highest feature first; equal values keep input order.
  repeated FactorMember members = 5;
}
message FactorMember {
  uint32 series_index = 1;
  double value = 2;
  double forward_return = 3;
}
message FactorResult {
  repeated FactorMembership memberships = 15;
  reserved 1;
  string dataset_revision = 2;
  reserved 3;
  uint32 lookback = 4;
  uint32 horizon = 5;
  uint32 input_count = 6; // Observations any of the series has.
  // One row per evaluated observation: samples for one series, cross-sections
  // for several. The other list is empty.
  repeated FactorSample samples = 7;
  repeated FactorCrossSection cross_sections = 8;
  repeated FactorPartition partitions = 9;
  uint32 purged_count = 10;
  string selection_rule = 11;
  repeated FactorCandidate candidates = 12; // Development scores only.
  uint32 evaluation_warmup = 13;
  repeated FactorFold folds = 14;
}
message FactorCandidate {
  uint32 lookback = 1;
  uint32 sample_count = 2;
  optional double development_spearman = 3;
}
message FactorPartition {
  string name = 1;
  uint32 begin_index = 2;
  uint32 end_index = 3; // Exclusive event boundary, labels stay inside.
  uint32 sample_count = 4; // Evaluated observations.
  // One series: the correlation over its samples. Several: the mean of the
  // cross-sections that are defined. Absence means no defined value, never an
  // invented zero correlation.
  optional double pearson = 5;
  optional double spearman = 6;
  // Several series only: that mean over the standard deviation of the
  // cross-sections; absent with fewer than two or when they do not vary.
  optional double pearson_ratio = 7;
  optional double spearman_ratio = 8;
  // Several series only: entry k - 1 holds k of them on each side, up to
  // half of them.
  repeated FactorSpread spreads = 9;
}
// The mean label of the series with the highest features and of those with
// the lowest, over the `observations` of a partition that had enough series
// for two such sides; zeros when none had. Equal features keep the order the
// series were given in.
message FactorSpread {
  double highest = 1;
  double lowest = 2;
  uint32 observations = 3;
}

message FactorFold {
  uint32 training_begin = 1;
  uint32 training_end = 2;
  uint32 validation_end = 3;
  uint32 lookback = 4;
  repeated FactorCandidate candidates = 5;
  FactorPartition development = 6;
  FactorPartition holdout = 7;
}
