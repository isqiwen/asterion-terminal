syntax = "proto3";
import "asterion/v1/health.proto";
package asterion.protocol.v1;

import "asterion/v1/domain.proto";
import "asterion/v1/data.proto";

// Per-lot amounts plus notional rates (price x quantity x multiplier x rate).
message Costs { Decimal margin_per_lot = 1; Decimal open_fee = 2; Decimal close_today_fee = 3; Decimal close_yesterday_fee = 4; Decimal margin_rate = 5; Decimal open_fee_rate = 6; Decimal close_today_fee_rate = 7; Decimal close_yesterday_fee_rate = 8; }
message CostVersion { string effective_from = 1; string source = 2; Costs values = 3; }
message CostSchedule { repeated CostVersion versions = 1; }
message RiskLimits { Decimal max_order_quantity = 1; Decimal max_gross_quantity = 2; uint64 max_working_orders = 3; }
// One contract of a backtest portfolio: its bars, trading days and costs. The
// contract is the dataset's contract.
message PaperContract { asterion.data.v1.BarDataset dataset = 1; CostSchedule cost_schedule = 2; }
// Every contract shares the same trading days; each day ends with the
// dataset settlement prices.
message PaperInput { Decimal deposit = 1; RiskLimits risk = 2; repeated PaperContract contracts = 3; }
// A CTP futures account. Non-secret identities only: the password and the
// authentication code are entered at every connection and never stored.
message LiveBroker { string front = 1; string broker_id = 2; string user_id = 3; string app_id = 4; }
// A policy is independent of the account and of physical journal segments.
message LivePolicy {
  RiskLimits risk = 1; repeated Contract contracts = 2; Decimal max_price_deviation = 3;
}
message LivePolicyChange { LivePolicy policy = 1; string risk_artifact = 2; }
message LiveInput { LiveBroker broker = 1; LivePolicy policy = 2; string account_id = 3; }
message LiveCredentials { string password = 1; string auth_code = 2; }
// The owner confirms the account by its user ID. The permission lasts across
// connections and trading days.
message LiveAuthorize { string user_id = 1; }
// The owner verified at the broker that an unconfirmed order does not exist;
// it stops counting as working exposure. It is never resent either way.
message LiveResolve { string order_id = 1; }
enum Side { SIDE_UNSPECIFIED = 0; BUY = 1; SELL = 2; }
// What contracts are compared by; a window counts observations.
// PRICE_MOMENTUM: the close over the close a window earlier, less one.
// TERM_STRUCTURE: the mean over a window of how far the dominant month of a
// series settled above a later month the day before, as a year's worth.
// Unspecified is invalid.
enum Factor { FACTOR_UNSPECIFIED = 0; PRICE_MOMENTUM = 1; TERM_STRUCTURE = 2; }
// Which sides of a contract a strategy may hold. Unspecified is invalid.
enum PositionSides { POSITION_SIDES_UNSPECIFIED = 0; LONG_AND_SHORT = 1; LONG_ONLY = 2; SHORT_ONLY = 3; }
// The rules a strategy takes its side by. Windows count completed bars.
// Long while the average of the last `fast` closes is above that of the last
// `slow`, short while it is below.
message MovingAverageCross { uint32 fast = 1; uint32 slow = 2; }
// Long from a close above the highest high of the `entry` bars before it,
// short from one below their lowest low. The side is given up when a close
// passes the opposite extreme of the `exit` bars before it.
message ChannelBreakout { uint32 entry = 1; uint32 exit = 2; }
// Long while the close is above the close `lookback` bars earlier, short
// while it is below.
message Momentum { uint32 lookback = 1; }
// Short from a close more than `width` standard deviations above the mean of
// the last `window` closes, long from one as far below it. The side is given
// up when a close returns to that mean.
message BandReversion { uint32 window = 1; Decimal width = 2; }
// A rule over several contracts at once, for backtests: on every
// `rebalance`-th bar that all of them have, they are ranked by `factor` over
// a window of `lookback` such bars. The `count` highest are held long and the
// `count` lowest short until the next ranking, or the other way round when
// `reversed`; the rest are flat. A held contract holds the lots whose value
// at that bar's close is nearest `notional`, so contracts of different sizes
// weigh alike. The term structure ranks dominant series alone, on the bars of
// days that have a term point.
message CrossRank { Factor factor = 1; bool reversed = 2; uint32 lookback = 3; uint32 rebalance = 4; uint32 count = 5; Decimal notional = 6; }
// What a strategy trades by: one rule, the lots it holds while the rule takes
// a side, and the sides it may hold; it is flat on a side it may not hold and
// while the rule takes none. A rule over several contracts sizes each by its
// notional and has no quantity.
message Strategy {
  Decimal quantity = 1;
  PositionSides sides = 2;
  oneof rule {
    MovingAverageCross moving_average = 3;
    ChannelBreakout breakout = 4;
    Momentum momentum = 5;
    BandReversion reversion = 6;
    CrossRank cross = 7;
  }
}
// CLOSE leaves bucket assignment to the exchange rule (see ClosePolicy).
enum Offset { OFFSET_UNSPECIFIED = 0; OPEN = 1; CLOSE_TODAY = 2; CLOSE_YESTERDAY = 3; CLOSE = 4; }
enum OrderState { ORDER_STATE_UNSPECIFIED = 0; ACCEPTED = 1; PARTIALLY_FILLED = 2; FILLED = 3; CANCELLED = 4; REJECTED = 5; }
message Empty {}
message Submit { string order_id = 1; string venue = 2; string symbol = 3; Side side = 4; Offset offset = 5; Decimal quantity = 6; Decimal price = 7; }
message Cancel { string order_id = 1; }
// Hands the authorized account to one strategy run on one allowed contract.
// The run reads minute bars from the market service on the account's machine,
// continues across connections and trading days, and ends with the
// authorization.
message StrategyStart {
  string venue = 1; string symbol = 2; Strategy strategy = 3;
  string market_endpoint = 4; string market_service = 5;
}
message Command {
  string request_id = 1;
  oneof operation { Submit submit = 2; Cancel cancel = 3; LiveAuthorize live_authorize = 4; Empty live_revoke = 5; LiveResolve live_resolve = 6; LivePolicyChange live_policy = 7;
    StrategyStart strategy_start = 8; Empty strategy_stop = 9; }
}
// A connection is bound to one immutable process session.
message Request {
  uint32 version = 1;
  string session_id = 2;
  string correlation_id = 3;
  // Stable account identity, required for commands.
  string account_id = 4;
  // The policy reviewed by the caller; required for every command.
  string policy_revision = 5;
  oneof operation { Empty snapshot = 10; Empty recover = 11; Command command = 12; Empty shutdown = 13; Empty attach = 14; Empty heartbeat = 15;
    LiveInput live_create = 16; LiveCredentials live_connect = 17; Empty live_disconnect = 18;
    Empty live_costs = 19; }
}
message ContractState { Contract contract = 1; Costs costs = 2; Decimal mark = 3; CostSchedule cost_schedule = 4; }
message Position { string venue = 1; string symbol = 2; Side side = 3; bool today = 4; Decimal quantity = 5; Decimal basis = 6; }
message Order { string id = 1; string venue = 2; string symbol = 3; Side side = 4; Offset offset = 5; Decimal quantity = 6; Decimal limit_price = 7; Decimal filled = 8; OrderState state = 9; }
message Fill { string id = 1; string order_id = 2; string venue = 3; string symbol = 4; Decimal quantity = 5; Decimal price = 6; }
message Snapshot {
  repeated ContractState contracts = 1;
  Decimal balance = 2; Decimal equity = 3; Decimal available = 4;
  Decimal margin = 5; Decimal frozen = 6; Decimal fees = 7;
  Decimal realized = 8; Decimal unrealized = 9;
  uint32 cursor = 10; uint32 total = 11; optional int64 timestamp_ns = 12;
  bool recovery_required = 13;
  repeated Position positions = 14; repeated Order orders = 15; repeated Fill fills = 16;
  RiskLimits risk = 17;
}
// Broker-reported account state; the broker owns the live ledger.
message LiveFunds {
  Decimal balance = 1; Decimal available = 2; Decimal margin = 3; Decimal commission = 4;
  Decimal close_profit = 5; Decimal position_profit = 6;
}
message LivePosition { string venue = 1; string symbol = 2; Side side = 3; Decimal today = 4; Decimal yesterday = 5; }
// status: submitted, accepted, partially_filled, filled, cancelled, rejected.
message LiveOrder {
  string id = 1; string broker_key = 2; string exchange_order_id = 3; string venue = 4; string symbol = 5;
  Side side = 6; Offset offset = 7; Decimal quantity = 8; Decimal filled = 9; Decimal limit_price = 10;
  string status = 11; int32 error_code = 12;
}
message LiveTrade {
  string id = 1; string order_id = 2; string venue = 3; string symbol = 4; Side side = 5; Offset offset = 6;
  Decimal quantity = 7; Decimal price = 8; string trading_day = 9; string trade_time = 10;
}
// An order this session recorded for sending that the synchronized broker
// does not report. It is never resent.
message UnconfirmedOrder { string id = 1; string broker_key = 2; string trading_day = 3; }
// The account's margin and commission rates for one contract, as the broker
// reports them. state: querying, ready or unavailable; costs only when ready.
message LiveCosts {
  string venue = 1; string symbol = 2; string state = 3; int32 error_code = 4;
  int64 queried_ms = 5; Costs costs = 6;
}
// Lasts until the owner revokes it, the policy changes or the service restarts.
message LiveAuthorization { int64 authorized_at_ms = 1; }
// The account's current or last strategy run. state: running or stopped; a
// stopped run states why. target is the position wanted in lots, positive
// long and negative short; absent until the rule has seen `warmup` bars.
message LiveStrategy {
  string id = 1; string venue = 2; string symbol = 3; Strategy strategy = 4; uint32 warmup = 5;
  string state = 6; string reason = 7; int64 started_ms = 8;
  uint64 bars = 9; int64 bar_ms = 10; optional Decimal target = 11; repeated string orders = 12;
}
message JournalCapacity {
  uint64 records_used = 1; uint64 records_limit = 2;
  uint64 bytes_used = 3; uint64 bytes_limit = 4;
}
message LiveSnapshot {
  LiveBroker broker = 1; RiskLimits risk = 2; repeated Contract contracts = 3;
  // disconnected, connecting, authenticating, logging_in, confirming,
  // synchronizing, ready or error.
  string phase = 4; int32 error_code = 5; string trading_day = 6; int64 synchronized_ms = 7;
  LiveFunds funds = 8;
  repeated LivePosition positions = 9; repeated LiveOrder orders = 10; repeated LiveTrade trades = 11;
  LiveAuthorization authorization = 12;
  repeated UnconfirmedOrder unconfirmed = 13;
  bool recovery_required = 14;
  repeated LiveCosts costs = 15;
  Decimal max_price_deviation = 16;
  JournalCapacity capacity = 17;
  string account_id = 18;
  // Immutable event segments; excludes the active journal file.
  uint64 segment_count = 19;
  string policy_revision = 20; string risk_artifact = 21;
  LiveStrategy strategy = 22;
}
message Error { string code = 1; string message = 2; }
message Health { string instance_id = 1; string version = 2; uint64 uptime_ms = 3; bool initialized = 4; bool recovery_required = 5; asterion.runtime.v1.ExecutionHealth execution = 6; }
message Response {
  uint32 version = 1; string session_id = 2; string correlation_id = 3;
  oneof result { Error error = 10; Empty closed = 11; Empty uninitialized = 12; Health health = 13; LiveSnapshot live = 14; }
}
