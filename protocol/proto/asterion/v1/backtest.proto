syntax = "proto3";
package asterion.backtest.v1;
import "asterion/v1/domain.proto";
import "asterion/v1/trading.proto";
import "asterion/v1/data.proto";

// Immutable data resolved by Data and captured with calculation parameters by Task. paper.contracts hold the bars
// and trading days of each contract; the strategy runs on every contract.
message BacktestInput {
  uint32 version = 1; // 9
  string dataset_revision = 2;
  asterion.protocol.v1.PaperInput paper = 3;
  // One strategy is replayed as it is. Several, up to 32 and all different,
  // are compared on the trading days before `holdout_day` alone, and the one
  // those days favour is replayed over every day.
  repeated asterion.protocol.v1.Strategy strategies = 4;
  repeated DominantSchedule series = 5;
  // The first trading day kept out of the comparison; empty with one strategy.
  string holdout_day = 6;
}
// Month contracts of one product traded as its dominant series: on each
// trading day only the dominant month is traded, and one strategy runs on the
// series. Indexes refer to the contracts of the request.
message DominantSeries { repeated uint32 contracts = 1; }
// From trading_day on, the contract (an index into paper.contracts) is the
// dominant month. factor multiplies its raw prices for the strategy's signal:
// ratio back-adjustment, 1 for the last segment. Orders, fills, margin and
// profit always use the raw prices of the real contract.
message DominantRoll {
  string trading_day = 1;
  uint32 contract = 2;
  asterion.protocol.v1.Decimal factor = 3;
}
// The resolved schedule of one series; rolls ascend by trading day and by
// delivery month.
message DominantSchedule { repeated DominantRoll rolls = 1; }
// Resolves month contracts as a dominant series without submitting anything.
message DominantSeriesRequest { repeated asterion.data.v1.BarDatasetRequest months = 1; }
// months: indexes of the request's months that are dominant at some point,
// in delivery-month order; datasets and schedule contracts follow that order.
message DominantSeriesPreview {
  repeated uint32 months = 1;
  repeated asterion.data.v1.BarDataset datasets = 2;
  DominantSchedule schedule = 3;
}
// One contract of a backtest submission: Data resolves its bars before Task captures the input.
message BacktestContract {
  asterion.data.v1.BarDatasetRequest data = 1;
  asterion.protocol.v1.CostSchedule cost_schedule = 2;
}
message BacktestRequest {
  repeated BacktestContract contracts = 1;
  asterion.protocol.v1.Decimal deposit = 2;
  asterion.protocol.v1.RiskLimits risk = 3;
  repeated asterion.protocol.v1.Strategy strategies = 4;
  repeated DominantSeries series = 5;
  // A date; the holdout begins on the first trading day on or after it.
  // Empty with one strategy.
  string holdout_from = 6;
}
enum EquityEvent { EQUITY_EVENT_UNSPECIFIED = 0; TRADE_MARK = 1; DAILY_SETTLEMENT = 2; }
message EquityPoint {
  int64 timestamp_ns = 1;
  asterion.protocol.v1.Decimal equity = 2;
  EquityEvent event = 3;
}
message ContractSettlement {
  string venue = 1;
  string symbol = 2;
  asterion.protocol.v1.Decimal price = 3;
  asterion.protocol.v1.Decimal position_quantity = 4; // Net lots: long positive, short negative.
}
message DaySettlement {
  string trading_day = 1;
  int64 timestamp_ns = 2;
  asterion.protocol.v1.Decimal balance = 3;
  asterion.protocol.v1.Decimal equity = 4;
  asterion.protocol.v1.Decimal realized = 5;
  asterion.protocol.v1.Decimal fees = 6;
  repeated ContractSettlement contracts = 7;
}
// What the days before the holdout showed of one compared strategy. Nothing
// from the holdout is recorded for a strategy that was not chosen.
message BacktestCandidate {
  double total_return = 1;
  double max_drawdown = 2;
  // Yearly Sharpe ratio; absent when the daily returns do not vary.
  optional double sharpe = 3;
}
message BacktestResult {
  uint32 version = 1;
  string dataset_revision = 2;
  string engine_version = 3;
  asterion.protocol.v1.Snapshot account = 4;
  repeated EquityPoint equity = 5;
  asterion.protocol.v1.Decimal max_drawdown = 6;
  repeated DaySettlement settlements = 7;
  // With several strategies: one entry per strategy in input order, and the
  // index of the one with the highest development Sharpe ratio, whose replay
  // the rest of this result is.
  repeated BacktestCandidate candidates = 8;
  uint32 selected = 9;
}

