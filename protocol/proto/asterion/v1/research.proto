syntax = "proto3";
import "asterion/v1/node.proto";
import "asterion/v1/domain.proto";
package asterion.research.v1;
import "asterion/v1/trading.proto";
import "asterion/v1/factor.proto";
import "asterion/v1/data.proto";

message SmaStrategy { uint32 fast = 1; uint32 slow = 2; asterion.protocol.v1.Decimal quantity = 3; }
// Immutable input resolved by the task service. paper.contracts hold the bars
// and trading days of each contract; the SMA strategy runs on every contract.
message BacktestInput {
  uint32 version = 1; // 8
  string dataset_revision = 2;
  asterion.protocol.v1.PaperInput paper = 3;
  SmaStrategy sma = 4;
}
// One contract of a backtest submission: the task service resolves its bars.
message BacktestContract {
  asterion.data.v1.BarDatasetRequest data = 1;
  reserved 2;
  asterion.protocol.v1.CostSchedule cost_schedule = 3;
}
message BacktestRequest {
  repeated BacktestContract contracts = 1;
  asterion.protocol.v1.Decimal deposit = 2;
  asterion.protocol.v1.RiskLimits risk = 3;
  SmaStrategy sma = 4;
}
enum EquityEvent { EQUITY_EVENT_UNSPECIFIED = 0; TRADE_MARK = 1; DAILY_SETTLEMENT = 2; }
message EquityPoint {
  int64 timestamp_ns = 1;
  asterion.protocol.v1.Decimal equity = 2;
  EquityEvent event = 3;
}
message ContractSettlement {
  string venue = 1;
  string symbol = 2;
  asterion.protocol.v1.Decimal price = 3;
  asterion.protocol.v1.Decimal position_quantity = 4;
}
message DaySettlement {
  string trading_day = 1;
  int64 timestamp_ns = 2;
  asterion.protocol.v1.Decimal balance = 3;
  asterion.protocol.v1.Decimal equity = 4;
  asterion.protocol.v1.Decimal realized = 5;
  asterion.protocol.v1.Decimal fees = 6;
  repeated ContractSettlement contracts = 7;
}
message BacktestResult {
  uint32 version = 1;
  string dataset_revision = 2;
  string engine_version = 3;
  asterion.protocol.v1.Snapshot account = 4;
  repeated EquityPoint equity = 5;
  asterion.protocol.v1.Decimal max_drawdown = 6;
  repeated DaySettlement settlements = 7;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  CANCEL_REQUESTED = 3;
  SUCCEEDED = 4;
  FAILED = 5;
  CANCELLED = 6;
  INTERRUPTED = 7;
}
enum TaskKind { TASK_KIND_UNSPECIFIED = 0; BACKTEST = 1; FACTOR = 2; reserved 3, 4; MINUTE_DOWNLOAD = 5; DAILY_DOWNLOAD = 6; DAILY_FACTOR = 7; }
message Task {
  string id = 1;
  reserved 13, 18;
  oneof definition { BacktestInput input = 2; FactorInput factor = 11; asterion.data.v1.MinuteDownload minutes = 19; asterion.data.v1.DailyDownload daily = 21; DailyFactorInput daily_factor = 22; }
  TaskKind kind = 12;
  TaskState state = 3;
  uint32 attempt = 4;
  uint32 completed = 5;
  uint32 total = 6;
  string error = 7;
  string result_digest = 8;
  string trading_day = 9;
  string instrument = 10;
  string source_name = 14;
  string data_source = 23;
  string risk_artifact = 25; // Immutable native risk SHA-256 for backtests.
  string provider_artifact = 24; // Immutable native provider SHA-256 for downloads.
  uint32 minute_interval_minutes = 20; // summary projection; zero for other task kinds
  // Service-owned durable order, independent of task ID and wall-clock changes.
  uint32 submission_sequence = 15;
  // UTC wall-clock observations in milliseconds; not used for durations/order.
  int64 submitted_at_ms = 16;
  int64 updated_at_ms = 17;
}
message TaskList { repeated Task tasks = 1; repeated asterion.data.v1.HistorySource sources = 2; }
message TaskClaim { string id = 1; TaskKind kind = 2; }
message TaskId { string id = 1; }
message TaskSubmit { reserved 2, 3, 4, 5; string id = 1; oneof definition { BacktestRequest backtest = 10; FactorRequest factor_request = 11; asterion.data.v1.MinuteDownload minutes = 6; asterion.data.v1.DailyDownload daily = 8; DailyFactorRequest daily_factor = 9; } string provider_token = 7; }
message TaskAttempt { Task task = 1; string token = 2; string provider_token = 3; string output_directory = 4; }
message TaskProgress { string id = 1; string token = 2; uint32 completed = 3; }
message TaskFinish { reserved 5, 6; string id = 1; string token = 2; oneof output { BacktestResult result = 3; FactorResult factor = 4; asterion.data.v1.MinuteDownloadResult minutes = 7; asterion.data.v1.DailyDownloadResult daily = 8; DailyFactorResult daily_factor = 9; } }
message TaskFailure { string id = 1; string token = 2; string error = 3; string error_code = 4; }
message TaskCancelAck { string id = 1; string token = 2; }
// Private Task Service -> Agent dispatch contract. The Agent reports processes;
// Task Service owns queue ordering, task-kind mapping and concurrency policy.
enum WorkerProgram { WORKER_PROGRAM_UNSPECIFIED = 0; BACKTEST_PROGRAM = 1; FACTOR_PROGRAM = 2; DATA_PIPELINE_PROGRAM = 3; }
message TaskDispatch { repeated string running = 1; }
message TaskLaunch {
  string task_id = 1;
  WorkerProgram program = 2;
  reserved 3;
  bool minute_download = 4;
  bool daily_download = 5;
  bool daily_factor = 6;
  string provider_artifact = 7;
  string risk_artifact = 8;
}
message TaskLaunches { repeated TaskLaunch launches = 1; }
message TaskRequest {
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof operation {
    TaskSubmit submit = 10;
    TaskId get = 11;
    asterion.protocol.v1.Empty list = 12;
    TaskId cancel = 13;
    TaskId retry = 14;
    TaskId result = 15;
    asterion.protocol.v1.Empty heartbeat = 16;
    TaskClaim claim = 17;
    TaskProgress progress = 18;
    TaskFinish finish = 19;
    TaskFailure fail = 20;
    TaskCancelAck cancel_ack = 21;
    asterion.data.v1.MinutePageQuery minute_page = 23;
    asterion.data.v1.DailyPageQuery daily_page = 24;
    asterion.data.v1.BarDatasetRequest bar_dataset = 25;
    asterion.data.v1.HistoryCatalogQuery history_catalog = 26;
    asterion.data.v1.HistoryFilter history_datasets = 27;
    asterion.data.v1.HistoryConnectionVerify verify_connection = 28;
    asterion.data.v1.HistoryFilter history_coverage = 29;
    TaskDispatch dispatch = 22; asterion.node.v1.Quiesce quiesce = 30;
  }
}
message TaskHealth { string instance_id = 1; string version = 2; uint64 uptime_ms = 3; bool recovery_required = 4; }
message TaskResponse {
  reserved 17, 19;
  // Present only with a completed result, captured under the same store lock.
  Task result_task = 18;
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof result {
    Task task = 10;
    TaskList tasks = 11;
    BacktestResult backtest = 12;
    TaskHealth health = 13;
    asterion.protocol.v1.Error error = 14;
    TaskAttempt attempt = 15;
    FactorResult factor = 16;
    TaskLaunches launches = 20;
    asterion.data.v1.MinuteDownloadResult minutes = 21;
    asterion.data.v1.MinutePage minute_page = 22;
    asterion.data.v1.DailyDownloadResult daily = 23;
    asterion.data.v1.DailyPage daily_page = 24;
    DailyFactorResult daily_factor = 25;
    asterion.data.v1.BarDataset bar_dataset = 26;
    asterion.data.v1.HistoryCatalog history_catalog = 27;
    asterion.data.v1.HistoryDatasets history_datasets = 28;
    asterion.data.v1.HistoryConnectionVerification connection_verification = 29;
    asterion.data.v1.HistoryCoverages history_coverage = 30;
  }
}
