syntax = "proto3";
import "asterion/v1/node.proto";
import "asterion/v1/domain.proto";
package asterion.task.v1;
import "asterion/v1/trading.proto";
import "asterion/v1/factor.proto";
import "asterion/v1/backtest.proto";
import "asterion/v1/data.proto";
import "asterion/v1/data_service.proto";

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  CANCEL_REQUESTED = 3;
  SUCCEEDED = 4;
  FAILED = 5;
  CANCELLED = 6;
  INTERRUPTED = 7;
  PUBLISHING = 8;
}
enum TaskKind { TASK_KIND_UNSPECIFIED = 0; BACKTEST = 1; FACTOR = 2; reserved 3, 4; MINUTE_DOWNLOAD = 5; DAILY_DOWNLOAD = 6; DAILY_FACTOR = 7; }
message Task {
  string id = 1;
  reserved 13, 18;
  oneof definition { asterion.backtest.v1.BacktestInput input = 2; asterion.factor.v1.FactorInput factor = 11; asterion.data.v1.MinuteDownload minutes = 19; asterion.data.v1.DailyDownload daily = 21; asterion.factor.v1.DailyFactorInput daily_factor = 22; }
  TaskKind kind = 12;
  TaskState state = 3;
  uint32 attempt = 4;
  uint32 completed = 5;
  uint32 total = 6;
  string error = 7;
  string result_digest = 8;
  string trading_day = 9;
  string instrument = 10;
  string source_name = 14;
  string data_source = 23;
  asterion.data.v1.DownloadPublication publication = 27;
  string history_dataset_id = 26; // Projection of the verified published download result.
  string risk_artifact = 25; // Immutable native risk SHA-256 for backtests.
  string download_authorization = 28;
  string provider_artifact = 24; // Immutable native provider SHA-256 for downloads.
  uint32 minute_interval_minutes = 20; // summary projection; zero for other task kinds
  // Service-owned durable order, independent of task ID and wall-clock changes.
  uint32 submission_sequence = 15;
  // UTC wall-clock observations in milliseconds; not used for durations/order.
  int64 submitted_at_ms = 16;
  int64 updated_at_ms = 17;
}
message TaskCapacity { reserved 1, 3; uint32 uncommitted = 2; uint32 retained_tasks = 4; uint32 active_used = 5; uint32 active_limit = 6; uint32 active_reserved = 7; }
message TaskListQuery { uint32 limit = 1; uint32 before_sequence = 2; }
message TaskList {
  reserved 2;
  repeated Task tasks = 1; // One bounded page, in submission order.
  TaskCapacity capacity = 3;
  repeated Task active_tasks = 4; // Scheduling state is independent of the history page.
  uint32 next_before_sequence = 5;
  uint32 failed_count = 6;
  uint32 interrupted_count = 7;
}
message TaskClaim { string id = 1; TaskKind kind = 2; }
message TaskId { string id = 1; }
message TaskSubmit { reserved 2 to 8, 12; string id = 1; oneof definition { asterion.backtest.v1.BacktestRequest backtest = 10; asterion.factor.v1.FactorRequest factor_request = 11; asterion.factor.v1.DailyFactorRequest daily_factor = 9; string download_authorization = 13; } }
// Small execution definition, projected from Task-owned immutable evidence.
// Backtest contracts already follow the resolved month order. The fixed schedules
// below replace request.series: workers never select dominant months again.
message TaskExecution {
  string input_sha256 = 1;
  oneof parameters {
    asterion.backtest.v1.BacktestRequest backtest = 2;
    asterion.factor.v1.FactorRequest factor = 3;
    asterion.factor.v1.DailyFactorRequest daily_factor = 4;
  }
  repeated asterion.backtest.v1.DominantSchedule schedules = 5;
}
message TaskAttempt {
  reserved 3;
  Task task = 1; // Calculation summary only; downloads retain their definition.
  string token = 2;
  string output_directory = 4;
  string data_endpoint = 5;
  string data_instance = 6;
  TaskExecution execution = 7;
}
message TaskProgress { string id = 1; string token = 2; uint32 completed = 3; }
message TaskFinish { reserved 5, 6; string id = 1; string token = 2; oneof output { asterion.backtest.v1.BacktestResult result = 3; asterion.factor.v1.FactorResult factor = 4; asterion.data.v1.MinuteDownloadResult minutes = 7; asterion.data.v1.DailyDownloadResult daily = 8; asterion.factor.v1.DailyFactorResult daily_factor = 9; } }
message TaskFailure { string id = 1; string token = 2; string error = 3; string error_code = 4; }
message TaskCancelAck { string id = 1; string token = 2; }
// Private Task Service -> Agent dispatch contract. The Agent reports processes;
// Task Service owns queue ordering, task-kind mapping and concurrency policy.
enum WorkerProgram { WORKER_PROGRAM_UNSPECIFIED = 0; BACKTEST_PROGRAM = 1; FACTOR_PROGRAM = 2; DATA_PIPELINE_PROGRAM = 3; }
// Agent reserves node-wide capacity before dispatch. Missing allowance is invalid;
// zero observes a full node without authorizing a worker launch.
message TaskDispatch { repeated string running = 1; optional uint32 launch_slots = 2; }
message TaskLaunch {
  string task_id = 1;
  WorkerProgram program = 2;
  reserved 3;
  bool minute_download = 4;
  bool daily_download = 5;
  bool daily_factor = 6;
  string provider_artifact = 7;
  string risk_artifact = 8;
}
message TaskLaunches { repeated TaskLaunch launches = 1; }
message TaskRequest {
  reserved 23 to 29, 31 to 34, 36;
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof operation {
    TaskSubmit submit = 10;
    TaskId get = 11;
    TaskListQuery list = 12;
    TaskId cancel = 13;
    TaskId retry = 14;
    TaskId result = 15;
    asterion.protocol.v1.Empty heartbeat = 16;
    TaskClaim claim = 17;
    TaskProgress progress = 18;
    TaskFinish finish = 19;
    TaskFailure fail = 20;
    TaskCancelAck cancel_ack = 21;
    TaskId history_usage = 35;
    TaskDispatch dispatch = 22; asterion.node.v1.Quiesce quiesce = 30;
  }
}
message TaskHealth { string instance_id = 1; string version = 2; uint64 uptime_ms = 3; bool recovery_required = 4; bool initialized = 5; string process_id = 6; string data_instance = 7; }
message TaskResponse {
  reserved 17, 19, 22, 24, 26 to 32, 34, 36;
  // Present only with a completed result, captured under the same store lock.
  Task result_task = 18;
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof result {
    Task task = 10;
    TaskList tasks = 11;
    asterion.backtest.v1.BacktestResult backtest = 12;
    TaskHealth health = 13;
    asterion.protocol.v1.Error error = 14;
    TaskAttempt attempt = 15;
    asterion.factor.v1.FactorResult factor = 16;
    TaskLaunches launches = 20;
    asterion.data.v1.MinuteDownloadResult minutes = 21;
    asterion.data.v1.DailyDownloadResult daily = 23;
    asterion.factor.v1.DailyFactorResult daily_factor = 25;
    asterion.data.v1.HistoryUsage history_usage = 35;
  }
}

// Owned storage records. Sealed event segments preserve the exact event bytes;
// they do not change task identity or create another task-state authority.
message StoredTaskEvent { string task_id = 1; uint64 sequence = 2; bytes body = 3; }
message StoredTaskEventSegment { uint32 version = 1; repeated StoredTaskEvent events = 2; }

// Current metadata is committed in the same transaction as its state event.
// Fixed inputs and results remain in owned files and are never cached here.
message StoredTaskRecord {
  Task task = 1;
  string input_digest = 2;
  uint64 input_bytes = 3;
  string token = 4;
  uint64 event_sequence = 5;
}
