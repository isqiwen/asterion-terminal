syntax = "proto3";
package asterion.dataset.proto;

// Market 的不可变 Parquet 数据集。provider 是来源 ID，research 是研究用合成数据集。
// dataset_version/sha256 为 64 位小写十六进制摘要；日期 YYYY-MM-DD，月份 YYYY-MM。
// 首次 after_* 为空；后续传对应 next_*（字典序排他），next_* 为空即末页。
// 同一次遍历保留 provider、dataset_version 与过滤条件；数据集列表允许并发新增来源。
// created_ns 为 Unix UTC 纳秒。分区 key 来自版本清单，不是任意文件路径。
// 来源尚未发布时，查询当前版本返回空 dataset_version 和空数据，后续需等待发布。
message SourcesQuery {
  string after_provider = 1;
  uint32 limit = 2; // 0 = 64, at most 128.
}
message Source {
  string provider = 1;
  string dataset_version = 2;
  int64 created_ns = 3;
}
message Sources {
  repeated Source sources = 1;
  string next_provider = 2;
}
// Empty version selects current only on the first page. Retain the returned
// version for all further reads; a missing version is never replaced by current.
message VersionQuery {
  string provider = 1;
  string dataset_version = 2;
  string after_key = 3;
  uint32 limit = 4; // 0 = 128, at most 512 partitions.
  string table = 5; // Empty selects all tables.
  string exchange = 6; // Empty selects all exchanges.
}
message Partition {
  string key = 1;
  string sha256 = 2;
  uint64 rows = 3;
  repeated string days = 4; // Recorded acquisition days; not proof of intraday completeness.
  string source = 5; // In the research dataset: the provider this partition is taken from.
}
message Version {
  string provider = 1;
  string dataset_version = 2;
  string parent = 3;
  int64 created_ns = 4;
  repeated Partition partitions = 5;
  string next_key = 6;
}
// Only a partition named by this version is readable. Paths are never accepted.
message FileQuery {
  string provider = 1;
  string dataset_version = 2;
  string key = 3;
  uint64 offset = 4; // 首块为 0；下一块为返回 offset + data.size。
  uint32 limit = 5; // 0 = 1 MiB, at most 1 MiB.
}
message File {
  string provider = 1;
  string dataset_version = 2;
  string key = 3;
  string sha256 = 4; // 整个文件的摘要；收齐后校验，不是当前块摘要。
  uint64 offset = 5;
  uint64 size = 6; // 完整文件字节数；offset + data.size == size 时结束。
  bytes data = 7; // Original immutable Parquet bytes; amounts are not converted to floats.
}
// dataset_version 为空选择当前，返回值用于固定后续所有读取。
message SummaryQuery {
  string provider = 1;
  string dataset_version = 2;
}
message TableSummary {
  string table = 1;
  uint64 partitions = 2;
  uint64 rows = 3;
  string first_day = 4;
  string last_day = 5;
}
message Summary {
  string provider = 1;
  string dataset_version = 2;
  int64 created_ns = 3;
  repeated TableSummary tables = 4;
}

// Product/month coverage of one immutable version, paged by product key.
message CoverageQuery {
  string provider = 1;
  string dataset_version = 2; // Required; normally returned by Summary.
  string after_product = 3; // EXCHANGE/product, exclusive.
  uint32 limit = 4; // 0 = 64, at most 128 products.
}
message MonthCoverage {
  string month = 1;
  uint32 days = 2;
  uint32 open_days = 3; // 0 means the stored calendar cannot establish coverage.
}
message ProductCoverage {
  string exchange = 1;
  string product = 2;
  repeated MonthCoverage months = 3;
}
message Coverage {
  string provider = 1;
  string dataset_version = 2;
  repeated ProductCoverage products = 3;
  string next_product = 4;
}

// The minutes Tushare and the recorder both hold (their current versions),
// compared minute by minute on open, high, low, close and volume. A recorded
// minute marked partial is counted, not compared.
message ComparisonQuery {}
message ComparedDay {
  string contract = 1;
  string day = 2;
  uint32 compared = 3;
  uint32 differing = 4;
  uint32 tushare_only = 5;
  uint32 recorder_only = 6;
  uint32 partial = 7;
}
message Comparison {
  string tushare_version = 1;
  string recorder_version = 2;
  uint32 days = 3; // contract-days both sources hold
  uint32 differing_days = 4;
  // The latest 500 contract-days with any difference or missing minute.
  repeated ComparedDay differing = 5;
}

// One contract-day's minutes that differ between Tushare and the recorder:
// minutes only one source has, and minutes whose values disagree. Recorded
// minutes marked partial are left out.
message DifferencesQuery {
  string contract = 1; // EXCHANGE/product/YYYY-MM
  string day = 2; // YYYY-MM-DD
}
message MinuteValues {
  string open = 1;
  string high = 2;
  string low = 3;
  string close = 4;
  string volume = 5;
}
message MinuteDifference {
  int64 start_ms = 1;
  MinuteValues tushare = 2; // absent when only the recorder has the minute
  MinuteValues recorder = 3; // absent when only Tushare has it
}
message Differences {
  string contract = 1;
  string day = 2;
  repeated MinuteDifference minutes = 3;
}
