syntax = "proto3";
package asterion.market.proto;
import "asterion/recording.proto";
import "asterion/dataset.proto";
import "asterion/acquisition.proto";
message Empty {}
message Instrument {
  string venue = 1;
  string symbol = 2;
}
message CatalogContract {
  Instrument instrument = 1;
  string product = 2;
  string expiry = 3;
  int32 multiplier = 4;
  string price_tick = 5;
  string name = 6;
  string contract_id = 7;
}
message CatalogState {
  string phase = 1;
  string error_code = 2;
  string diagnostic = 3;
  string trading_day = 4;
  repeated CatalogContract contracts = 5;
}
// Selection belongs to this stream. Empty selects all collected contracts.
// Change selection by opening a new watch, which starts with a full baseline.
message Watch {
  repeated Instrument instruments = 1;
}
// Initial read: empty stream_id and after_sequence=0. Subsequent reads must
// retain stream identity; this bounded volatile stream is not a durable archive.
message ReadEvents {
  string stream_id = 1;
  uint64 after_sequence = 2;
  uint32 limit = 3;
}
message Request {
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof operation {
    Empty snapshot = 13;
    Watch watch = 14;
    Empty heartbeat = 15;
    ReadEvents events = 16;
    MinuteRequest minutes = 18;
    asterion.recording.proto.StatusQuery recording_status = 19;
    asterion.recording.proto.DaysQuery recorded_days = 20;
    asterion.recording.proto.MinutesQuery recorded_minutes = 21;
    asterion.dataset.proto.SourcesQuery datasets = 22;
    asterion.dataset.proto.VersionQuery dataset = 23;
    asterion.dataset.proto.FileQuery dataset_file = 24;
    asterion.dataset.proto.SummaryQuery dataset_summary = 25;
    asterion.acquisition.proto.TaskQuery acquisition_task = 26;
    asterion.acquisition.proto.TasksQuery acquisition_tasks = 27;
    asterion.acquisition.proto.Request acquisition_start = 28;
    asterion.acquisition.proto.TaskQuery acquisition_cancel = 29;
    asterion.acquisition.proto.SourcesQuery acquisition_sources = 30;
    asterion.dataset.proto.CoverageQuery dataset_coverage = 31;
    asterion.dataset.proto.ComparisonQuery minute_comparison = 32;
  }
}
message DepthLevel {
  optional string price = 1;
  optional int64 quantity = 2;
}
message Quote {
  Instrument instrument = 1;
  optional string last = 2;
  optional string bid = 3;
  optional string ask = 4;
  int64 bid_quantity = 5;
  int64 ask_quantity = 6;
  int64 volume = 7;
  optional string previous_settlement = 8;
  optional string high = 9;
  optional string low = 10;
  optional string open_interest = 11;
  string action_day = 12;
  string trading_day = 13;
  string update_time = 14;
  int64 source_ms = 15;
  int64 received_ms = 16;
  // Exactly four entries on each side for levels 2..5. Missing values stay absent.
  repeated DepthLevel bid_levels = 17;
  repeated DepthLevel ask_levels = 18;
  optional string open = 19;
  optional string upper_limit = 20;
  optional string lower_limit = 21;
  optional string previous_close = 22;
  optional string open_interest_change = 23;
  // Per-unit session average price (provider turnover / volume / multiplier).
  optional string average_price = 24;
}
// change_1m_percent: last price versus the latest observation at least 60 s
// earlier in the same trading day; absent until such an observation exists.
message Subscription {
  Instrument instrument = 1;
  string state = 2;
  int32 error_code = 3;
  Quote quote = 4;
  optional string change_1m_percent = 5;
}
message MinuteRequest {
  Instrument instrument = 1;
}
// Minute bars built by the market service from the observations it received.
// first_observation_ms marks where this service began observing the trading
// day; interrupted means observations were lost after that point.
message MinuteBar {
  int64 start_ms = 1;
  string open = 2;
  string high = 3;
  string low = 4;
  string close = 5;
  int64 volume = 6;
  optional string average_price = 7;
  optional string open_interest = 8;
}
message MinuteSeries {
  Instrument instrument = 1;
  string trading_day = 2;
  int64 first_observation_ms = 3;
  bool interrupted = 4;
  repeated MinuteBar bars = 5;
  optional string previous_settlement = 6;
}
// Watch sends its first catalog in full. Later frames may omit only the same
// catalog revision within that watch connection and service instance.
// The first watch frame and every membership reset carry all subscriptions.
// Otherwise subscriptions_delta carries changed rows relative to base_sequence,
// the previous frame on this connection. Unknown/missing baselines are rejected.
// Snapshot and command responses always carry full subscriptions and catalog.
message Snapshot {
  string instance_id = 1;
  string phase = 2;
  int32 error_code = 3;
  uint64 sequence = 4;
  uint64 out_of_order = 5;
  repeated Subscription subscriptions = 6;
  CatalogState catalog = 7;
  repeated Instrument watchlist = 8;
  uint64 catalog_revision = 9;
  bool catalog_omitted = 10;
  bool subscriptions_delta = 11;
  uint64 base_sequence = 12;
}
message Health {
  string instance_id = 1;
  string phase = 2;
  bool initialized = 3;
}
message Error {
  string code = 1;
  string message = 2;
}
message Response {
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof result {
    Snapshot snapshot = 10;
    Health health = 11;
    Error error = 12;
    EventBatch events = 13;
    MinuteSeries minutes = 14;
    asterion.recording.proto.Status recording_status = 15;
    asterion.recording.proto.Days recorded_days = 16;
    asterion.recording.proto.Minutes recorded_minutes = 17;
    asterion.dataset.proto.Sources datasets = 18;
    asterion.dataset.proto.Version dataset = 19;
    asterion.dataset.proto.File dataset_file = 20;
    asterion.dataset.proto.Summary dataset_summary = 21;
    asterion.acquisition.proto.Task acquisition_task = 22;
    asterion.acquisition.proto.Tasks acquisition_tasks = 23;
    asterion.acquisition.proto.Sources acquisition_sources = 24;
    asterion.dataset.proto.Coverage dataset_coverage = 25;
    asterion.dataset.proto.Comparison minute_comparison = 26;
  }
}

message QuoteObservation {
  Quote quote = 1;
  bool out_of_order = 2;
}
message Event {
  uint64 sequence = 1;
  int64 received_ms = 2;
  // subscription is one acknowledgement, without a cached quote.
  oneof observation {
    Snapshot status = 10;
    QuoteObservation quote = 11;
    Subscription subscription = 12;
  }
}
message EventBatch {
  string stream_id = 1;
  uint64 oldest_sequence = 2;
  uint64 latest_sequence = 3;
  bool gap = 4;
  bool failed = 5;
  repeated Event events = 6;
}
