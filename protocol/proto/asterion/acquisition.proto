syntax = "proto3";
package asterion.acquisition.proto;

// 已配置的供应商能力；已有数据集通过 list_datasets 独立查询。
message SourcesQuery {}
message Source {
  string provider = 1;
  repeated string tables = 2; // daily / minutes / settlement / calendar / contracts。
  repeated string exchanges = 3;
}
message Sources {
  repeated Source sources = 1;
  bool can_manage = 2; // 当前已验证证书是否有采集管理权限。
}

// start_acquisition 的持久任务参数。任务属于 Market，提交方断线不停止任务。
// id 由客户端生成，1..64 字符 [A-Za-z0-9_-]，重复提交返回 conflict。
// 收到 QUEUED 只表示已接纳；用 get_acquisition_task 查询终态。
// 时间范围包含首尾，1990-01-01 起；供应商最多采到昨天，recorder 可读取今天。
// refresh=false 跳过已采集日期，true 重新获取并发布新版本。
message Request {
  string id = 1;
  string provider = 2;
  string table = 3;
  string begin_day = 4; // YYYY-MM-DD。
  string end_day = 5; // YYYY-MM-DD。
  repeated string exchanges = 6; // 空选来源支持的全部交易所；单合约分钟仅选其交易所。
  bool refresh = 7;
  // minutes 使用 EXCHANGE/product/YYYY-MM；其他表为空。
  // 仅 recorder 支持空 contract（全部合约），此时 exchanges 必须为空。
  string contract = 8;
}

// 正常 QUEUED → RUNNING → SUCCEEDED；QUEUED/RUNNING 均可失败或取消。
// 服务重启把未完成任务标为 INTERRUPTED；终态不可重新运行，重试使用新 ID。
// 取消/失败也可能发布已完成分区，dataset_version 是该任务最后已发布版本。
enum TaskState {
  TASK_STATE_UNSPECIFIED = 0; // 无有效状态，服务不返回。
  TASK_STATE_QUEUED = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_SUCCEEDED = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_CANCELLED = 5;
  TASK_STATE_INTERRUPTED = 6;
}

message Task {
  Request request = 1;
  TaskState state = 2;
  uint64 days_total = 3; // 计划的交易所×日期数；分钟采集按合约×日期计数。
  uint64 days_done = 4; // 已处理工作项，含跳过与无数据项；单位同 days_total。
  uint64 days_empty = 5; // 请求过但没有数据的工作项；单位同 days_total。
  uint64 requests = 6; // 已发送给来源的请求数。
  string dataset_version = 7;
  string error_code = 8;
  string error = 9;
  int64 started_ns = 10; // 接纳时间，Unix UTC 纳秒。
  int64 finished_ns = 11; // 终态时间，Unix UTC 纳秒；未结束为 0。
}
// cancel_acquisition 仅发出取消意图，已完成任务保持其终态；不存在的 ID 返回 not_found。
message TaskQuery {
  string id = 1;
}
message TasksQuery {
  string after_id = 1; // 首次为空；后续传上一页 next_id，按 ID 字典序排他分页。
  uint32 limit = 2; // 0 = 64，最多 128。
}
message Tasks {
  repeated Task tasks = 1;
  string next_id = 2; // 空表示没有下一页；任务列表在分页期间可能变化。
}
