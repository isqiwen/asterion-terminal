syntax = "proto3";
package asterion.research.proto;
import "asterion/resource.proto";
import "asterion/domain.proto";
import "asterion/trading.proto";

enum ModelMethod {
  MODEL_METHOD_UNSPECIFIED = 0;
  MODEL_LINEAR = 1;
  MODEL_RIDGE = 2;
}

message ModelSpecification {
  string name = 1;
  string purpose = 2;
  string limitations = 3;
  asterion.resource.proto.Object source = 4;
  ModelMethod method = 5;
  optional bool fit_intercept = 6;
  asterion.protocol.proto.Decimal alpha = 7;
  uint32 training_begin = 8;
  uint32 training_end = 9; // Half-open original observation indices, not calendar guesses.
  bool standardize = 10;

  enum Weights {
    WEIGHTS_UNSPECIFIED = 0;
    EQUAL = 1;
  }

  Weights weights = 11;
  uint32 run_budget = 12;
  uint32 time_budget_seconds = 13;
  int64 valid_until_ms = 14;

  enum Mode {
    MODE_UNSPECIFIED = 0;
    POST_HOC_DIAGNOSTIC = 1;
  }

  Mode mode = 15;
}
message ModelDraft {
  string id = 1;
  asterion.resource.proto.Owner owner = 2;
  ModelSpecification specification = 3;
  string digest = 4;
  int64 updated_at_ms = 5;
}
// Verified and captured by Research. The client supplies only the result reference.
message ModelSource {
  asterion.resource.proto.Object result = 1;
  string input_sha256 = 2;
  uint64 input_bytes = 3;
  uint32 attempt = 4;
  string program_artifact = 5;
  uint32 observations = 6;
  uint32 holdout_start = 7;
  uint32 horizon = 8;
  uint32 required_history = 9;
  uint32 lookback = 10;
  asterion.protocol.proto.Factor factor = 11;
  asterion.resource.proto.Object variable_definition = 12;
  sint32 price_power = 13;
  bool historical_availability_unknown = 14;
}
message ModelPlan {
  string id = 1;
  string draft_id = 2;
  string draft_digest = 3;
  asterion.resource.proto.Owner owner = 4;
  ModelSpecification specification = 5;
  ModelSource source = 6;
  string program_artifact = 7;
  string digest = 8;
  int64 recorded_at_ms = 9;
  uint32 training_samples = 10; // Actual mature eligible labels, captured before admission.
}

message ModelDraftSave {
  string draft_id = 1;
  string expected_digest = 2;
  ModelSpecification specification = 3;
}
message ModelFix {
  string plan_id = 1;
  string draft_id = 2;
  string expected_digest = 3;
}
// Independent immutable mapping; these are direction intents, never position weights.
message ModelMappingSpecification {
  string name = 1;
  string purpose = 2;
  asterion.resource.proto.Object model = 3;
  asterion.protocol.proto.Decimal short_threshold = 4;
  asterion.protocol.proto.Decimal long_threshold = 5;

  enum Middle {
    MIDDLE_UNSPECIFIED = 0;
    NO_NEW_DIRECTION = 1;
  }

  Middle middle = 6;
  int64 valid_until_ms = 7;
}
message ModelMapping {
  string id = 1;
  asterion.resource.proto.Owner owner = 2;
  ModelMappingSpecification specification = 3;
  asterion.resource.proto.Object plan = 4;
  ModelSource source = 5;
  int64 model_published_at_ms = 6;
  string digest = 7;
  int64 recorded_at_ms = 8;
  ModelSpecification.Mode mode = 9;
  repeated ModelTimeFold folds =
    10; // Time-model source only; actual validation windows, not all input rows.
}
message ModelMappingSave {
  string mapping_id = 1;
  ModelMappingSpecification specification = 2;
}
message ModelTimeFold {
  uint32 training_begin = 1;
  uint32 training_end = 2;
  uint32 validation_begin = 3;
  uint32 validation_end = 4;
}
message ModelTimeSpecification {
  string name = 1;
  string purpose = 2;
  string limitations = 3;
  asterion.resource.proto.Object recipe = 4; // Fixed model_plan, never a full-period fitted model.
  repeated ModelTimeFold folds = 5;
  uint32 run_budget = 6;
  uint32 time_budget_seconds = 7;
  int64 valid_until_ms = 8;
}
message ModelTimeBoundary {
  uint32 event_index = 1;
  string trading_day = 2; // Exact provider/source label, not inferred from UTC.
  optional int64 timestamp_ns = 3; // Absent for date-only daily tables.
}
message ModelTimePlan {
  string id = 1;
  asterion.resource.proto.Owner owner = 2;
  ModelTimeSpecification specification = 3;
  ModelPlan recipe = 4;
  string digest = 5;
  int64 recorded_at_ms = 6;
  repeated uint32 training_counts = 7; // Verified mature members per declared fold.
  // Four original observations per fold, in training begin/end, validation begin/end order.
  // End markers are exclusive; clocks are labels, never historical availability claims.
  repeated ModelTimeBoundary boundaries = 8;
}
message ModelTimeSave {
  string plan_id = 1;
  ModelTimeSpecification specification = 2;
}
message ModelTimeTrainingRequest {
  asterion.resource.proto.Object plan = 1;
}
message ModelTimeInput {
  ModelTimePlan plan = 1;
}
message ModelTimeRow {
  uint32 event_index = 1;
  optional double prediction = 2;

  enum Exclusion {
    EXCLUSION_UNSPECIFIED = 0;
    INCLUDED = 1;
    WARMUP = 2;
    FEATURE_UNAVAILABLE = 3;
    LABEL_UNAVAILABLE = 4;
    CROSSED_LABEL = 5;
    NON_FINITE_PREDICTION = 6;
  }

  Exclusion exclusion = 3;
}
message ModelTimeFoldResult {
  ModelTimeFold scope = 1;
  repeated uint32 training_members = 2;
  double intercept = 3;
  double coefficient = 4;
  double training_residual_sum_squares = 5;
  double regularization = 6;
  double training_objective = 7;
  ModelStandardization standardization = 8;
  repeated ModelTimeRow predictions = 9;
  uint32 evaluated = 10;
  double validation_residual_sum_squares = 11;
  optional double validation_mean_squared_error = 12;
}
message ModelTimeResult {
  asterion.resource.proto.Object plan = 1;
  repeated ModelTimeFoldResult folds = 2;
  int64 computed_at_ms = 3;
}
message ModelMutation {
  string id = 1;
  oneof operation {
    ModelDraftSave save = 2;
    ModelFix fix = 3;
    ModelMappingSave mapping = 4;
    ModelTimeSave time_validation = 5;
  }
}
message ModelRead {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    DRAFT = 1;
    PLAN = 2;
    MAPPING = 3;
    TIME_PLAN = 4;
  }

  Kind kind = 1;
  string id = 2;
}
message ModelPage {
  ModelRead.Kind kind = 1;
  string after = 2;
  uint32 limit = 3;
}
message ModelMappingPreview {
  asterion.resource.proto.Object mapping = 1;
  uint32 begin = 2;
  uint32 limit = 3;
}
message ModelTimeMappedRow {
  uint32 fold_index = 1;
  ModelTimeRow observation = 2;
}
message ModelMappedRow {
  oneof original {
    ModelTrainingRow observation = 1;
    ModelTimeMappedRow time_observation = 3;
  }

  enum Intent {
    INTENT_UNSPECIFIED = 0;
    LONG_DIRECTION = 1;
    SHORT_DIRECTION = 2;
    NO_NEW_DIRECTION = 3;
    PREDICTION_UNAVAILABLE = 4;
    EXPIRED = 5;
  }

  Intent intent = 2;
}
// A bounded read of original predictions, explicitly not historical executable decisions.
message ModelMappingProjection {
  ModelMapping mapping = 1;
  repeated ModelMappedRow rows = 2;
  uint32 total = 3;
  uint32 begin = 4;
  optional uint32 next_begin = 5;
  int64 observed_at_ms = 6;
}
message ModelRequest {
  oneof operation {
    ModelMutation mutation = 1;
    ModelRead read = 2;
    ModelPage list = 3;
    ModelMappingPreview preview = 4;
  }
}
message ModelReply {
  oneof record {
    ModelDraft draft = 1;
    ModelPlan plan = 2;
    ModelMapping mapping = 6;
    ModelMappingProjection projection = 8;
    ModelTimePlan time_plan = 9;
  }
  repeated ModelDraft drafts = 3;
  repeated ModelPlan plans = 4;
  string next_after = 5;
  repeated ModelMapping mappings = 7;
  repeated ModelTimePlan time_plans = 10;
}

message ModelTrainingRequest {
  asterion.resource.proto.Object plan = 1;
}
message ModelTrainingInput {
  ModelPlan plan = 1;
}
message ModelTrainingRow {
  uint32 event_index = 1;

  enum Role {
    ROLE_UNSPECIFIED = 0;
    TRAINING = 1;
    OTHER_DEVELOPMENT = 2;
    HOLDOUT = 3;
  }

  Role role = 2;

  enum Reason {
    REASON_UNSPECIFIED = 0;
    FITTED = 1;
    NOT_TRAINING = 2;
    WARMUP = 3;
    MISSING_FEATURE = 4;
    MISSING_LABEL = 5;
    CROSSED_LABEL = 6;
  }

  Reason reason = 3;

  enum PredictionState {
    PREDICTION_UNSPECIFIED = 0;
    PREDICTED = 1;
    FEATURE_UNAVAILABLE = 2;
    NON_FINITE_PREDICTION = 3;
  }

  PredictionState prediction_state = 4;
  optional double prediction = 5;
}
// Fitted exclusively on the plan's mature eligible training members; n-1 denominator.
message ModelStandardization {
  uint32 training_samples = 1;
  double mean = 2;
  double sample_standard_deviation = 3;
}
message ModelTrainingResult {
  asterion.resource.proto.Object plan = 1;
  uint32 training_samples = 2;
  double intercept = 3;
  double coefficient = 4;
  double residual_sum_squares = 5;
  double regularization = 6;
  double objective = 7;
  repeated ModelTrainingRow rows = 8;
  int64 fitted_at_ms = 9; // Compute completion, never proof of historical live availability.
  ModelStandardization standardization = 10;
}

// Fictional new-feature cases test fixed model consumption, never market accuracy or orders.
enum ModelDecisionReason {
  MODEL_DECISION_REASON_UNSPECIFIED = 0;
  MODEL_DECISION_READY = 1;
  MODEL_NOT_READY = 2;
  MODEL_MAPPING_NOT_READY = 3;
  MODEL_INPUT_NOT_READY = 4;
  MODEL_FEATURE_UNAVAILABLE = 5;
  MODEL_NON_FINITE_PREDICTION = 6;
  MODEL_DECISION_EXPIRED = 7;
}

message ModelDecisionCase {
  string name = 1;
  int64 boundary_ns = 2; // Explicit fictional completed decision boundary, UTC.
  int64 feature_available_at_ns = 3;
  optional double feature = 4; // Dimensionless, ordered exactly as the fixed scalar model.
  ModelMappedRow.Intent expected_intent = 5;
  ModelDecisionReason expected_reason = 6;
}
message ModelDecisionTrialRequest {
  asterion.resource.proto.Object mapping = 1;
  optional uint32 fold_index =
    2; // Required only for a time-model source; never auto-select a fold.
  bool fictional = 3;
  string purpose = 4;
  repeated ModelDecisionCase cases = 5; // Original expectations freeze at task admission.
  uint32 time_budget_seconds = 6;
}
message ModelDecisionTrialInput {
  ModelMapping mapping = 1;
  ModelDecisionTrialRequest request = 2;
  uint32 model_attempt = 3;
  oneof source {
    ModelTrainingInput training = 4;
    ModelTimeInput time = 5;
  }
}
message ModelDecisionTrialRow {
  uint32 index = 1;
  optional double prediction = 2;
  ModelMappedRow.Intent intent = 3;
  ModelDecisionReason reason = 4;
  bool matches = 5;
}
message ModelDecisionTrialResult {
  repeated ModelDecisionTrialRow rows = 1;
  uint32 matched = 2;
  bool all_match = 3; // Incorrect expectations are a completed comparison, not execution failure.
  int64 computed_at_ms = 4;
}

// A new conditional historical experiment, not reuse of precomputed predictions as past-ready models.
// Select an existing immutable mapping; its source plan and evidence are resolved by Research.
message ModelReplaySelection {
  asterion.resource.proto.Object mapping = 1;
  uint32 fold_index = 2;
  asterion.protocol.proto.Decimal quantity = 3;
  asterion.protocol.proto.PositionSides sides = 4;
  uint32 processing_delay_bars = 5;
  uint32 time_budget_seconds = 6;
  ModelReplayDefinition.Availability availability = 7;
}
message ModelReplayDefinition {
  ModelMapping mapping = 1;
  ModelTimeInput training = 2;
  uint32 model_attempt = 3;
  uint32 fold_index = 4;
  asterion.protocol.proto.Decimal quantity = 5;
  asterion.protocol.proto.PositionSides sides = 6;
  uint32 processing_delay_bars =
    7; // Explicit positive simulated delay after the training-cut boundary.
  uint32 time_budget_seconds = 8;

  enum Availability {
    AVAILABILITY_UNSPECIFIED = 0;
    ASSUME_ORIGINAL_BAR_CLOSE =
      1; // Declared diagnostic assumption; original historical availability stays unknown.
  }

  Availability availability = 9;
}
message ModelReplayFit {
  repeated uint32 training_members = 1;
  double intercept = 2;
  double coefficient = 3;
  double training_residual_sum_squares = 4;
  double regularization = 5;
  double training_objective = 6;
  ModelStandardization standardization = 7;
  uint32 started_index = 8;
  uint32 ready_index = 9;
  int64 started_boundary_ns = 10;
  int64 ready_boundary_ns = 11;
  int64 actual_started_at_ms = 12;
  int64 actual_fitted_at_ms = 13;
  int64 actual_duration_ns = 14;
}
message ModelReplayDecision {
  uint32 source_index = 1;
  int64 boundary_ns = 2;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    BEFORE_TRAINING = 1;
    MODEL_PENDING = 2;
    OUTSIDE_VALIDATION = 3;
    FEATURE_UNAVAILABLE = 4;
    NON_FINITE_PREDICTION = 5;
    EXPIRED = 6;
    MAPPED = 7;
  }

  Phase phase = 3;
  optional double feature = 4;
  optional double prediction = 5;
  ModelMappedRow.Intent intent = 6;
  // A new target after the shared quantity/side policy; absent is no new target, never zero.
  asterion.protocol.proto.Decimal target = 7;
  string intent_id = 8;

  enum TargetDisposition {
    DISPOSITION_UNSPECIFIED = 0;
    NO_NEW_TARGET = 1;
    NEXT_BAR = 2;
    OUTSIDE_REPLAY = 3;
  }

  TargetDisposition disposition = 9;
}
message ModelReplayFill {
  string fill_id = 1; // The original account owns its quantity, price and fee.
  uint32 source_index = 2;
  int64 boundary_ns = 3;
  uint32 decision_source_index = 4;
  string intent_id = 5;
}
message ModelReplayResult {
  ModelReplayFit fit = 1;
  repeated ModelReplayDecision decisions = 2;
  bool historical_availability_unknown = 3;
  repeated ModelReplayFill fills = 4;
}
