syntax = "proto3";
package asterion.task.proto;
import "asterion/trading.proto";
import "asterion/task_state.proto";
import "asterion/research_variable.proto";
import "asterion/research_statistics.proto";
import "asterion/research_evaluation.proto";
import "asterion/research_sample.proto";
import "asterion/research_strategy.proto";
import "asterion/research_logic.proto";
import "asterion/factor.proto";
import "asterion/backtest.proto";
import "asterion/data.proto";
import "asterion/resource.proto";
import "asterion/account_review.proto";
import "asterion/material.proto";

enum TaskKind {
  TASK_KIND_UNSPECIFIED = 0;
  BACKTEST = 1;
  FACTOR = 2;
  MINUTE_DOWNLOAD = 3;
  reserved 4;
  TABLE_UPDATE = 5;
  ACCOUNT_REVIEW = 6;
  MATERIAL_ACQUISITION = 7;
  STATISTICS = 10;
  SAMPLE = 11;
  LOGIC_TRIAL = 12;
  PERFORMANCE_EVALUATION = 15;
}

// Descriptive state is independent of immutable calculation inputs and results.
message TaskDerivation {
  string source_id = 1;
  string source_result_digest = 2;
  string data_choice = 3;
  string snapshot = 4;
  string source_instance = 5;
}
message TaskMetadata {
  uint32 revision = 1;
  string name = 2;
  string note = 3;
  TaskDerivation derivation = 4;
}
message TaskMetadataEdit {
  string id = 1;
  uint32 expected_revision = 2;
  string name = 3;
  string note = 4;
}
message Task {
  string id = 1;
  TaskMetadata metadata = 27;
  asterion.resource.proto.Object retirement =
    30; // Durable lifecycle decision, separate from execution.
  asterion.data.proto.TableRefreshTarget table_refresh =
    28; // summary projection of immutable input
  reserved 5;
  oneof definition {
    asterion.backtest.proto.BacktestInput input = 2;
    asterion.factor.proto.FactorInput factor = 3;
    asterion.data.proto.MinuteDownload minutes = 4;
    asterion.data.proto.TableUpdate table_update = 26;
    asterion.research.proto.AccountReviewInput account_review = 31;
    asterion.data.proto.MaterialInput material = 32;
    asterion.research.proto.StatisticsInput statistics = 38;
    asterion.research.proto.SampleInput sample = 39;
    asterion.research.proto.LogicTrialInput logic_trial = 41;
    asterion.research.proto.EvaluationInput evaluation = 46;
  }
  TaskKind kind = 6;
  TaskState state = 7;
  uint32 attempt = 8;
  uint32 completed = 9;
  uint32 total = 10;
  string error = 11;
  string error_code = 29; // optional observed execution failure code; empty means unknown
  string result_digest = 12;
  string trading_day = 13;
  string instrument = 14;
  string source_name = 15;
  string data_source = 16;
  asterion.data.proto.DownloadPublication publication = 17;
  string history_dataset_id = 18; // Projection of the verified published download result.
  string risk_artifact = 19; // Immutable native risk SHA-256 for backtests.
  // Actual Research executable, fixed separately from reusable data/parameter bytes.
  string program_artifact = 35;
  reserved 36;
  asterion.research.proto.StrategyUse strategy_use = 40;
  asterion.resource.proto.Object variable_definition = 37;
  string download_authorization = 20;
  string provider_artifact = 21; // Immutable native provider SHA-256 for downloads.
  uint32 minute_interval_minutes = 22; // summary projection; zero for other task kinds
  // Service-owned durable order, independent of task ID and wall-clock changes.
  uint32 submission_sequence = 23;
  // UTC wall-clock observations in milliseconds; not used for durations/order.
  int64 submitted_at_ms = 24;
  int64 updated_at_ms = 25;
}
message TaskRetirementRequest {
  string id = 1;
  bool execute = 2;
}
message TaskRetirement {
  enum State {
    AVAILABLE = 0;
    BLOCKED = 1;
    RETIRED = 2;
  }

  asterion.resource.proto.Object object = 1;
  Task task = 2;
  State state = 3;
  repeated string consumers = 4;
  bool active = 5;
  bool admission_busy = 6;
  bool source_release_confirmed = 7;
  asterion.protocol.proto.Error release_error = 8;
}
message TaskCapacity {
  uint32 uncommitted = 1;
  uint32 retained_tasks = 2;
  uint32 active_used = 3;
  uint32 active_limit = 4;
  uint32 active_reserved = 5;
}
message TaskListQuery {
  uint32 limit = 1;
  uint32 before_sequence = 2;
}
message TaskList {
  repeated Task tasks = 1; // One bounded page, in submission order.
  TaskCapacity capacity = 2;
  repeated Task active_tasks = 3; // Scheduling state is independent of the history page.
  uint32 next_before_sequence = 4;
  uint32 failed_count = 5;
  uint32 interrupted_count = 6;
}
message TaskId {
  string id = 1;
}
// Small execution definition, projected from Task-owned immutable evidence.
// Backtest contracts already follow the resolved month order. The fixed schedules
// below replace request.series, and are those of a factor request's dominant
// series in order: execution never select dominant months again.
message TaskExecution {
  string input_sha256 = 1;
  string program_artifact = 10;
  reserved 11;
  asterion.research.proto.StrategyUse strategy_use = 15;
  asterion.research.proto.VariableDefinition variable_definition = 12;
  asterion.data.proto.DataOwner data_owner = 6;
  oneof parameters {
    asterion.backtest.proto.BacktestRequest backtest = 2;
    asterion.factor.proto.FactorRequest factor = 3;
    asterion.research.proto.AccountReviewExecution account_review = 7;
    asterion.research.proto.StatisticsInput statistics = 13;
    asterion.research.proto.SampleExecution sample = 14;
    asterion.research.proto.LogicTrialInput logic_trial = 16;
    asterion.research.proto.EvaluationInput evaluation = 20;
  }
  repeated asterion.data.proto.DominantSchedule schedules = 4;
  asterion.data.proto.HistoricalMargins historical_margins = 5;
}
message TaskAttempt {
  Task task = 1; // Calculation summary only; downloads retain their definition.
  string token = 2;
  string output_directory = 3;
  string data_endpoint = 4;
  string data_instance = 5;
  TaskExecution execution = 6;
}
message TaskFinish {
  reserved 6;
  string id = 1;
  string token = 2;
  oneof output {
    asterion.backtest.proto.BacktestResult result = 3;
    asterion.factor.proto.FactorResult factor = 4;
    asterion.data.proto.MinuteDownloadResult minutes = 5;
    asterion.data.proto.TableUpdateResult table_update = 7;
    asterion.research.proto.AccountReviewResult account_review = 8;
    asterion.data.proto.MaterialReceipt material = 9;
    asterion.research.proto.StatisticsResult statistics = 12;
    asterion.research.proto.SampleResult sample = 13;
    asterion.research.proto.LogicTrialResult logic_trial = 14;
    asterion.research.proto.EvaluationResult evaluation = 17;
  }
}

message TaskHealth {
  string instance_id = 1;
  string version = 2;
  uint64 uptime_ms = 3;
  bool recovery_required = 4;
  bool initialized = 5;
  string process_id = 6;
  reserved 7;
}
message TaskResponse {
  reserved 19, 31, 32;
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  // Present only with a completed result, captured under the same store lock.
  Task result_task = 4;
  // The digest of result_task's input as the owner stored it at admission.
  string result_input_sha256 = 5;
  oneof result {
    Task task = 10;
    TaskList tasks = 11;
    asterion.backtest.proto.BacktestResult backtest = 12;
    TaskHealth health = 13;
    asterion.protocol.proto.Error error = 14;
    asterion.factor.proto.FactorResult factor = 16;
    asterion.data.proto.MinuteDownloadResult minutes = 18;
    asterion.data.proto.HistoryUsage history_usage = 20;
    asterion.data.proto.TableUpdateResult table_update = 21;
    asterion.resource.proto.ReleaseDecision release_decision = 22;
    TaskRetirement retirement = 23;
    asterion.resource.proto.Catalogue resources = 24;
    asterion.research.proto.AccountReviewResult account_review = 25;
    asterion.data.proto.MaterialReceipt material = 26;
    asterion.research.proto.VariableReply variable = 33;
    asterion.research.proto.StatisticsResult statistics = 34;
    asterion.research.proto.SampleResult sample = 35;
    asterion.research.proto.StrategyReply strategy = 36;
    asterion.research.proto.LogicTrialResult logic_trial = 37;
    asterion.research.proto.LogicReply logic = 38;
    asterion.research.proto.EvaluationResult evaluation = 43;
  }
}

// Owned storage records. Sealed event segments preserve the exact event bytes;
// they do not change task identity or create another task-state authority.
message StoredTaskEvent {
  string task_id = 1;
  uint64 sequence = 2;
  bytes body = 3;
}
message StoredTaskEventSegment {
  reserved 1;
  repeated StoredTaskEvent events = 2;
}

// Current metadata is committed in the same transaction as its state event.
// Fixed inputs and results remain in owned files and are never cached here.
message StoredTaskRecord {
  Task task = 1;
  string input_digest = 2;
  uint64 input_bytes = 3;
  string token = 4;
  uint64 event_sequence = 5;
}

// Current in-flight creation record; it is not an admitted task or a format migration.
message PreparedTaskSubmission {
  string instance_id = 1;
  StoredTaskRecord record = 2;
  TaskExecution execution = 3;
}
