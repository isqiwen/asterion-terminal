syntax = "proto3";
package asterion.resource.proto;

// Logical custody, independent of transport, process generation and installation.
message Owner {
  string node_id = 1;
  string service_id = 2;
  string domain = 3;
}
message Object {
  Owner owner = 1;
  string kind = 2;
  string id = 3;
  string version = 4;
}

// Queried from the semantic owner; absence or lost contact is never RELEASED.
message ReleaseDecision {
  enum State {
    UNKNOWN = 0;
    RETAINED = 1;
    RELEASED = 2;
  }

  Object object = 1;
  State state = 2;
}

// Rebuilt from each semantic owner. Catalogues never authorize deletion.
message CatalogueQuery {
  string kind = 1;
  string after = 2;
  uint32 limit = 3;
}
message CatalogueEntry {
  enum State {
    UNSPECIFIED = 0;
    REGISTERED = 1;
    SEALED = 2;
    RETIRED = 3;
  }

  Object object = 1;
  State state = 2;
  string name = 3;
  optional uint64 logical_bytes = 4;
  string relative_location = 5; // display locator only, never object identity
}
message Catalogue {
  Owner owner = 1;
  string kind = 2;
  repeated CatalogueEntry items = 3;
  string next_after = 4;
}
