syntax = "proto3";
package asterion.intelligence.proto;
import "asterion/resource.proto";
import "asterion/data.proto";
import "asterion/material.proto";
import "asterion/domain.proto";
import "asterion/trading.proto";
import "asterion/node.proto";

// Original UTF-8 bytes [begin,end), not character indexes or generated prose.
message EvidenceSpan {
  uint64 begin = 1;
  uint64 end = 2;
  string text = 3;
}

enum NoticeUseMode {
  UNSPECIFIED_USE = 0;
  POST_HOC_RESEARCH = 1;
  STRICT_HISTORY = 2;
}

// First supported human verification rule: a planned contract margin announcement.
// Missing editable fields remain drafts; this is never a publication decision.
message NoticeCandidate {
  string id = 1;
  asterion.resource.proto.Object material = 2;
  asterion.data.proto.TableListedContractsQuery dictionary = 3;
  string contract = 4;
  EvidenceSpan subject = 5;
  EvidenceSpan parameter = 6;
  EvidenceSpan effective_day = 7;
  EvidenceSpan percentage = 8;
  EvidenceSpan modality = 9;
  string rule_id = 10;
  string use_scope = 11;
  NoticeUseMode use_mode = 12;
  // Explicit follow-up statement; never inferred from a title or contract alone.
  asterion.resource.proto.Object event = 13;
}

enum NoticeCheckState {
  UNSPECIFIED_CHECK = 0;
  PASS = 1;
  BLOCKED = 2;
  UNKNOWN = 3;
}

message NoticeFieldCheck {
  string field = 1;
  NoticeCheckState state = 2;
  string reason = 3;
}
message NoticeAssessment {
  repeated NoticeFieldCheck checks = 1;
  repeated string limitations = 2;
  optional asterion.protocol.proto.Decimal margin_ratio = 3;
  string effective_day = 4;
  bool planned_marker_present = 5;
  bool ready_for_human_review = 6;
}
// Source originals and the entire foundation snapshot remain in Data.
// Only the matching dictionary row and small literal evidence are retained here.
message NoticeInput {
  asterion.resource.proto.Owner owner = 1;
  NoticeCandidate candidate = 2;
  asterion.data.proto.MaterialReceipt material = 3;
  asterion.resource.proto.Object dictionary_reference = 4;
  asterion.data.proto.TableListedContract dictionary_entry = 5;
  string program_artifact = 6;
}
message NoticeReview {
  enum Action {
    UNSPECIFIED_ACTION = 0;
    APPROVE = 1;
    REJECT = 2;
  }

  string id = 1;
  asterion.resource.proto.Object candidate = 2;
  string operator_name = 3;
  string reason = 4;
  Action action = 5;
  repeated NoticeFieldCheck checks = 6;
}
message NoticeVerification {
  NoticeReview review = 1;
  int64 verified_at_ms = 2;
  string program_artifact = 3;
}
message NoticePublishRequest {
  string id = 1;
  asterion.resource.proto.Object candidate = 2;
  asterion.resource.proto.Owner data_owner = 3;
  string reason = 4;
}
// Immutable prepared publication bytes. Data saving them does not publish Intelligence.
message NoticePayload {
  asterion.resource.proto.Owner owner = 1;
  string id = 2;
  asterion.resource.proto.Object candidate = 3;
  NoticeInput input = 4;
  NoticeAssessment assessment = 5;
  NoticeVerification verification = 6;
  int64 processed_at_ms = 7;
  string publication_reason = 8;
}
message NoticePublicationIntent {
  asterion.resource.proto.Object reference = 1;
  NoticePayload payload = 2;
  asterion.resource.proto.Owner data_owner = 3;
  int64 prepared_at_ms = 4;
}
message NoticeStorageReceipt {
  asterion.resource.proto.Object content = 1;
  asterion.resource.proto.Object origin = 2;
  uint64 bytes = 3;
  int64 stored_at_ms = 4;
}
message NoticePublicationRecord {
  asterion.resource.proto.Owner owner = 1;
  string id = 2;
  asterion.resource.proto.Object candidate = 3;
  asterion.resource.proto.Object preparation = 4;
  NoticeStorageReceipt storage = 5;
  int64 available_at_ms = 6;
}
message NoticePublished {
  asterion.resource.proto.Object reference = 1;
  NoticePublicationRecord publication = 2;
}

// Immutable event definition. Its initial statement stays fixed when a later
// correction changes the current view. Other statements explicitly name this event.
message NoticeEvent {
  asterion.resource.proto.Object reference = 1;
  asterion.resource.proto.Object initial_publication = 2;
  string contract = 3;
  string use_scope = 4;
  string rule_id = 5;
  int64 available_at_ms = 6;
}

// Human decisions append new fixed evidence. They never edit an old statement.
message NoticeChangeRequest {
  enum Action {
    UNSPECIFIED_CHANGE = 0;
    CORRECT = 1;
    WITHDRAW = 2;
  }

  string id = 1;
  asterion.resource.proto.Object event = 2;
  asterion.resource.proto.Object expected_head = 3;
  Action action = 4;
  asterion.resource.proto.Object replacement = 5;
  asterion.resource.proto.Object material = 6;
  EvidenceSpan evidence = 7;
  string operator_name = 8;
  string reason = 9;
  bool human_confirmed = 10;
  optional int64 effective_at_ms = 11;
}
message NoticeChangeInput {
  asterion.resource.proto.Owner owner = 1;
  NoticeChangeRequest request = 2;
  asterion.data.proto.MaterialReceipt material = 3;
  string program_artifact = 4;
}
message NoticeChangePayload {
  NoticeChangeInput input = 1;
  asterion.resource.proto.Object affected_publication = 2;
  int64 reviewed_at_ms = 3;
}
message NoticeChangeIntent {
  asterion.resource.proto.Object reference = 1;
  NoticeChangePayload payload = 2;
  asterion.resource.proto.Owner data_owner = 3;
  int64 prepared_at_ms = 4;
}
message NoticeChangePublished {
  asterion.resource.proto.Object reference = 1;
  asterion.resource.proto.Object preparation = 2;
  NoticeStorageReceipt storage = 3;
  int64 available_at_ms = 4;
  uint64 sequence = 5;
}
message NoticeChangeRecord {
  NoticeChangeIntent intent = 1;
  NoticeChangePublished published = 2;
}
message NoticeEventQuery {
  asterion.resource.proto.Object event = 1;
  optional int64 as_of_ms = 2;
}
message NoticeEventView {
  NoticeEvent event = 1;
  asterion.resource.proto.Object head = 2;
  asterion.resource.proto.Object selected_publication = 3;
  bool withdrawn = 4;
  NoticeChangeRecord latest_change = 5;
  // Current unfinished operation observation, excluded from historical views.
  NoticeChangeRecord pending_change = 6;
}
message NoticeStoredChange {
  NoticeStorageReceipt receipt = 1;
  NoticeChangePayload payload = 2;
}

// Explicitly selected, bounded historical knowledge; never a claim of market-wide coverage.
message NoticeSetQuery {
  repeated asterion.resource.proto.Object events = 1;
  NoticeUseMode use_mode = 2;
  int64 as_of_ms = 3;
  string use_scope = 4;
}
message NoticeSetRequest {
  string id = 1;
  string name = 2;
  NoticeSetQuery query = 3;
  string program_artifact = 4;
  asterion.resource.proto.Owner data_owner = 5;
}
message NoticeSetLimitation {
  asterion.resource.proto.Object source = 1;
  string reason = 2;
}
message NoticeSetMember {
  NoticeEventView event = 1;
  NoticePublished publication = 2;
  repeated NoticeSetLimitation limitations = 3;
}
message NoticeSetExclusion {
  asterion.resource.proto.Object event = 1;
  repeated NoticeSetLimitation reasons = 2;
}
// Data owns the original statement/change bytes. The set fixes references and knowledge.
message NoticeSetPayload {
  asterion.resource.proto.Owner owner = 1;
  NoticeSetRequest request = 2;
  repeated NoticeSetMember members = 3;
  repeated NoticeSetExclusion exclusions = 4;
}
message NoticeSetPreview {
  NoticeSetPayload payload = 1;
  int64 observed_at_ms = 2;
}
message NoticeSetIntent {
  asterion.resource.proto.Object reference = 1;
  NoticeSetPayload payload = 2;
  asterion.resource.proto.Owner data_owner = 3;
  int64 prepared_at_ms = 4;
}
message NoticeSetPublished {
  asterion.resource.proto.Object reference = 1;
  asterion.resource.proto.Object preparation = 2;
  NoticeStorageReceipt storage = 3;
  int64 available_at_ms = 4;
}
message NoticeSetRecord {
  NoticeSetIntent intent = 1;
  NoticeSetPublished published = 2;
}
message NoticeStoredSet {
  NoticeStorageReceipt receipt = 1;
  NoticeSetPayload payload = 2;
}
message NoticeSetCommand {
  oneof operation {
    NoticeSetRequest preview = 1;
    NoticeSetRequest publish = 2;
    NoticeId get = 3;
    asterion.resource.proto.Object preparation = 4;
    asterion.resource.proto.Object publication = 5;
  }
}

enum NoticeState {
  UNSPECIFIED_NOTICE = 0;
  PREPARING = 1;
  DRAFT = 2;
  VERIFIED = 3;
  PUBLISHING = 4;
  PUBLISHED = 5;
  REJECTED = 6;
  ABANDONED = 7;
}

message NoticeRecord {
  asterion.resource.proto.Object reference = 1;
  NoticeInput input = 2;
  NoticeAssessment assessment = 3;
  NoticeState state = 4;
  int64 created_at_ms = 5;
  int64 updated_at_ms = 6;
  NoticeVerification verification = 7;
  NoticePublicationIntent intent = 8;
  NoticePublished published = 9;
  NoticeEvent event = 10;
}

message NoticeAbandonRequest {
  string id = 1;
  asterion.resource.proto.Object candidate = 2;
  string reason = 3;
}

// Semantic commands stay with Intelligence. There is no public command for
// supplying a Data receipt; publish obtains it from the selected Data owner.
// A source custody relation is distinct from Research task admission.
// PREPARED and CONFIRMED both hold; only the consumer's durable release can free it.
message NoticeConsumerBinding {
  asterion.resource.proto.Object source = 1;
  asterion.resource.proto.Object consumer = 2;
  string use_scope = 3;
}
message NoticeConsumerRecord {
  enum Phase {
    UNSPECIFIED_PHASE = 0;
    PREPARED = 1;
    CONFIRMED = 2;
    RELEASED = 3;
  }

  NoticeConsumerBinding binding = 1;
  Phase phase = 2;
  int64 created_at_ms = 3;
  int64 updated_at_ms = 4;
}
message NoticeConsumerQuery {
  asterion.resource.proto.Object source = 1;
  string after = 2;
  uint32 limit = 3;
}
message NoticeConsumerPage {
  repeated NoticeConsumerRecord items = 1;
  string next_after = 2;
}
message NoticeConsumerCommand {
  oneof operation {
    NoticeConsumerBinding prepare = 1;
    NoticeConsumerBinding confirm = 2;
    asterion.resource.proto.Object get = 3;
    asterion.resource.proto.Object release = 4;
    NoticeConsumerQuery list = 5;
  }
}
message NoticeId {
  string id = 1;
}
message NoticeListQuery {
  string after = 1;
  uint32 limit = 2;
  optional NoticeState state = 3;
}
message NoticeRecords {
  repeated NoticeRecord items = 1;
}
message IntelligenceHealth {
  string instance_id = 1;
  string process_id = 2;
  bool initialized = 3;
  bool quiescing = 4;
}

// Positions belong to one stable Intelligence owner and are committed with
// semantic publication. Wall-clock time is evidence, never the stream cursor.
enum NoticeDeliveryKind {
  NOTICE_DELIVERY_UNSPECIFIED = 0;
  STATEMENT_PUBLISHED = 1;
  EVENT_CORRECTED = 2;
  EVENT_WITHDRAWN = 3;
}

message NoticeDelivery {
  uint64 position = 1;
  asterion.resource.proto.Object source = 2;
  asterion.resource.proto.Object event = 3;
  string contract = 4;
  string rule_id = 5;
  string use_scope = 6;
  NoticeDeliveryKind kind = 7;
  int64 available_at_ms = 8;
  asterion.resource.proto.Object initial_publication = 9;
}
message NoticeDeliveryFilter {
  repeated string contracts = 1;
  string rule_id = 2;
  string use_scope = 3;
  repeated NoticeDeliveryKind kinds = 4;
  bool include_followup_statements = 5;
}
message NoticeDeliveryQuery {
  NoticeDeliveryFilter filter = 1;
  uint64 after = 2;
  optional uint64 through = 3;
  uint32 limit = 4;
}
message NoticeDeliveryPage {
  asterion.resource.proto.Owner owner = 1;
  NoticeDeliveryQuery query = 2;
  uint64 head = 3;
  uint64 through = 4;
  uint64 scanned_through = 5;
  repeated NoticeDelivery items = 6;
  bool more = 7;
}
message NoticeSubscriptionDefinition {
  enum Consumer {
    CONSUMER_UNSPECIFIED = 0;
    APPLICATION_REMINDER = 1;
  }

  string id = 1;
  string name = 2;
  NoticeDeliveryFilter filter = 3;
  uint64 start_after = 4;
  Consumer consumer = 5;
}
message NoticeSubscriptionRecord {
  asterion.resource.proto.Object reference = 1;
  NoticeSubscriptionDefinition definition = 2;
  bool active = 3;
  uint64 revision = 4;
  uint64 confirmed_through = 5;
  uint64 paused_through = 6;
  uint64 gap_through = 7;
  int64 created_at_ms = 8;
  int64 updated_at_ms = 9;
  asterion.resource.proto.Object pending_delivery = 10;
}
message NoticeSubscriptionView {
  NoticeSubscriptionRecord subscription = 1;
  uint64 head = 2;
}
// The owner admits at most 64 subscriptions; this read includes paused records.
message NoticeSubscriptions {
  asterion.resource.proto.Owner owner = 1;
  uint64 head = 2;
  repeated NoticeSubscriptionRecord items = 3;
}
message NoticeSubscriptionControl {
  asterion.resource.proto.Object subscription = 1;
  uint64 expected_revision = 2;
  bool active = 3;
  optional uint64 gap_through = 4;
}
message NoticeSubscriptionOffer {
  asterion.resource.proto.Object subscription = 1;
  string operation_id = 2;
  uint64 after = 3;
  uint64 through = 4;
  bool historical = 5;
}
message NoticeDeliveryBatchPayload {
  NoticeSubscriptionOffer request = 1;
  NoticeDeliveryPage page = 2;
  int64 offered_at_ms = 3;
}
message NoticeDeliveryBatch {
  asterion.resource.proto.Object reference = 1;
  NoticeDeliveryBatchPayload payload = 2;
  bool acknowledged = 3;
}
message NoticeReminder {
  asterion.resource.proto.Object subscription = 1;
  NoticeDelivery change = 2;
  int64 first_offered_at_ms = 3;
  bool historical = 4;
}
message NoticeReminderQuery {
  asterion.resource.proto.Object subscription = 1;
  uint64 after = 2;
  uint32 limit = 3;
}
message NoticeReminderPage {
  asterion.resource.proto.Object subscription = 1;
  uint64 after = 2;
  repeated NoticeReminder items = 3;
  uint64 next_after = 4;
}
message NoticeDeliveryLookup {
  asterion.resource.proto.Object subscription = 1;
  string operation_id = 2;
}
message NoticeSubscriptionCommand {
  oneof operation {
    NoticeSubscriptionDefinition preview = 1;
    NoticeSubscriptionDefinition create = 2;
    NoticeId get = 3;
    NoticeSubscriptionControl control = 4;
    NoticeSubscriptionOffer offer = 5;
    asterion.resource.proto.Object acknowledge = 6;
    NoticeReminderQuery reminders = 7;
    NoticeDeliveryLookup delivery = 8;
    asterion.protocol.proto.Empty list = 9;
  }
}
message IntelligenceRequest {
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof operation {
    asterion.protocol.proto.Empty heartbeat = 10;
    NoticeCandidate submit = 11;
    NoticeId get = 12;
    NoticeListQuery list = 13;
    NoticeReview review = 14;
    NoticePublishRequest publish = 15;
    asterion.resource.proto.Object preparation = 16;
    asterion.resource.proto.Object publication = 17;
    NoticeAbandonRequest abandon = 18;
    asterion.resource.proto.Object release_decision = 19;
    asterion.node.proto.Quiesce quiesce = 20;
    asterion.resource.proto.CatalogueQuery resources = 21;
    NoticeConsumerCommand consumer = 22;
    asterion.resource.proto.Object event = 23;
    NoticeChangeRequest change = 24;
    asterion.resource.proto.Object change_preparation = 25;
    NoticeId change_get = 26;
    NoticeEventQuery event_view = 27;
    NoticeSetCommand event_set = 28;
    NoticeDeliveryQuery deliveries = 29;
    NoticeSubscriptionCommand subscription = 30;
  }
}
message IntelligenceResponse {
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  oneof result {
    asterion.protocol.proto.Error error = 10;
    IntelligenceHealth health = 11;
    NoticeRecord record = 12;
    NoticeRecords records = 13;
    NoticeVerification verification = 14;
    NoticePublicationIntent preparation = 15;
    NoticePublished publication = 16;
    asterion.resource.proto.ReleaseDecision release_decision = 17;
    asterion.resource.proto.Catalogue resources = 18;
    NoticeConsumerRecord consumer = 19;
    NoticeConsumerPage consumer_page = 20;
    NoticeEvent event = 21;
    NoticeChangeIntent change_preparation = 22;
    NoticeChangeRecord change = 23;
    NoticeEventView event_view = 24;
    NoticeSetPreview set_preview = 25;
    NoticeSetRecord event_set = 26;
    NoticeSetIntent set_preparation = 27;
    NoticeSetRecord set_publication = 28;
    NoticeDeliveryPage deliveries = 29;
    NoticeSubscriptionView subscription = 30;
    NoticeDeliveryBatch delivery_batch = 31;
    NoticeReminderPage reminders = 32;
    NoticeSubscriptions subscriptions = 33;
  }
}
message NoticeStoredContent {
  NoticeStorageReceipt receipt = 1;
  NoticePayload payload = 2;
}
