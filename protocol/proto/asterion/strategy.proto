syntax = "proto3";
package asterion.strategy.proto;

message Empty {}
message ParameterValue {
  oneof value {
    bool flag = 1;
    int64 integer = 2;
    double number = 3;
    string text = 4;
  }
}
// strategy.json, authored in the user's repository. Only these Python files
// are published. A package has no account, instance parameters or market data.
message Manifest {
  string name = 1;
  string version = 2;
  string entry = 3; // module:Class
  string runtime = 4; // python3.12-numpy2.3.5
  repeated string files = 5;
  // The research run whose copy of the code these files are; empty when they
  // come from the repository's working tree. Set by Lab, never authored.
  string research_run = 6;
}
message File {
  string path = 1;
  bytes content = 2;
}
message Package {
  Manifest manifest = 1;
  repeated File files = 2;
}
message Build {
  string repository = 1;
  string manifest = 2; // relative path of the descriptor within that repository
  string run = 3; // a succeeded research run to take the files from, or empty
}
message PackageRef {
  string name = 1;
  string version = 2;
}
// Explicit nominal exposure limits, in eight-place Decimal units. This is
// instance configuration, never strategy code or a grant of authorization.
message WeightBudget {
  optional sint64 gross_units = 1;
  optional sint64 net_units = 2;
}
message Instance {
  string id = 1;
  PackageRef package = 2;
  repeated string contracts = 3; // native EXCHANGE/symbol, never continuous series
  string period = 4; // 1d, or 1m through 60m
  map<string, ParameterValue> params = 5;
  WeightBudget weight_budget = 6; // required when the strategy outputs weights
  // An ended instance with the same configuration: its recorded bars are
  // replayed into the new strategy before live bars, without executing targets.
  string resume_from = 7;
}
message InstanceStatus {
  Instance configuration = 1;
  // Readiness never implies account authorization or permission to send orders.
  string state = 2; // warming, ready, stopped, failed, interrupted
  string error = 3;
  uint64 process_id = 4;
  uint64 completed_steps = 5;
  Decision last_decision = 6;
  bool paused = 7; // targets only reduce positions
  repeated InstanceEvent events = 8; // the latest, oldest first
}
message InstanceEvent {
  int64 time_ms = 1;
  string text = 2;
}
message State {
  repeated Manifest packages = 1;
  InstanceStatus instance = 2;
}
message Stop {
  string instance_id = 1; // stop only the instance the caller inspected
}
message Pause {
  string instance_id = 1;
  bool paused = 2;
}
message Request {
  oneof operation {
    Package publish = 1;
    Empty inspect = 2;
    Instance start = 3;
    Stop stop = 4;
    Pause pause = 5;
    Stop flatten = 6; // pauses the instance and closes its contracts
  }
}
// Private Trading-to-child IPC. No order or authorization operation.
message ChildRequest {
  oneof operation {
    Instance load = 1;
    Empty stop = 2;
    Bars bars = 3;
  }
}
message ChildReply {
  string error = 1;
  bool loaded = 2;
  Decision decision = 3;
}

// Exact received-input record. Prices and weights use eight-place Decimal units.
message Bar {
  string contract = 1;
  string trading_day = 2;
  int64 end_ms = 3; // minute end; daily bars use the trading-date midnight label
  sint64 open_units = 4;
  sint64 high_units = 5;
  sint64 low_units = 6;
  sint64 close_units = 7;
  int64 volume = 8;
  optional sint64 open_interest_units = 9;
}
message Bars {
  uint64 sequence = 1;
  repeated Bar bars = 2; // same label, ordered by the instance's contract selection
}
message Target {
  string contract = 1;
  oneof value {
    sint64 lots = 2;
    sint64 weight_units = 3;
  }
}
message Decision {
  uint64 sequence = 1;
  bool ready = 2;
  repeated Target targets = 3; // empty until explicitly ready; never orders
}
