syntax = "proto3";
package warehouse;
import "asterion/common.proto";

// Warehouse: one versioned dataset, and acquiring what it lacks.

message Request {
  uint64 id = 1;
  oneof call {
    common.Empty get_status = 10;

    GetDatasetVersion get_dataset_version = 21;
    ReadDatasetFile read_dataset_file = 22;
    DatasetRef get_dataset_summary = 23;
    DatasetRef get_dataset_coverage = 24;
    ListDatasetVersions list_dataset_versions = 27;
    CompareDatasetVersions compare_dataset_versions = 28;
    GetTableRows get_table_rows = 29;

    common.Empty get_acquisition_options = 30;
    StartAcquisition start_acquisition = 31;
    TaskId get_acquisition_task = 32;
    ListAcquisitionTasks list_acquisition_tasks = 33;
    TaskId cancel_acquisition = 34;
    // Acquisitions that bring each acquired table to yesterday's trading day;
    // a table with a queued or running task is left out.
    common.Empty start_update = 35;
  }
}

message Response {
  uint64 id = 1;
  oneof result {
    common.Error error = 2;
    Status get_status = 10;

    DatasetVersion get_dataset_version = 21;
    DatasetFile read_dataset_file = 22;
    DatasetSummary get_dataset_summary = 23;
    DatasetCoverage get_dataset_coverage = 24;
    DatasetVersions list_dataset_versions = 27;
    DatasetChange compare_dataset_versions = 28;
    TableRows get_table_rows = 29;

    AcquisitionOptions get_acquisition_options = 30;
    AcquisitionTask start_acquisition = 31;
    AcquisitionTask get_acquisition_task = 32;
    AcquisitionTasks list_acquisition_tasks = 33;
    AcquisitionTask cancel_acquisition = 34;
    // The admitted tasks; none when every table is up to date or busy.
    AcquisitionTasks start_update = 35;
  }
}

// ---- Status

message Status {
  string version = 1;
  int64 started_ms = 2;
  uint64 disk_free_bytes = 3;
  // Hash of this service's schemas; Terminal compares it with its own.
  string protocol = 4;
}

// ---- Datasets

enum Table {
  TABLE_UNSPECIFIED = 0;
  TABLE_CALENDAR = 1;
  TABLE_CONTRACTS = 2;
  TABLE_DAILY = 3;
  TABLE_MINUTES = 4;
  TABLE_SETTLEMENT = 5;
  TABLE_PRICE_TICKS = 6;
}

// An empty version names the current one.
message DatasetRef {
  string version = 1;
}

message Dataset {
  string version = 1;
  int64 created_ms = 2;
}

message GetDatasetVersion {
  DatasetRef dataset = 1;
  Table table = 2;
  string exchange = 3;
  string after_key = 4;
}

message DatasetVersion {
  Dataset dataset = 1;
  string parent = 2;
  repeated Partition partitions = 3;
  string next_key = 4;
}

message Partition {
  string key = 1;
  Table table = 2;
  string sha256 = 3;
  uint64 rows = 4;
  repeated string days = 5;
}

message ReadDatasetFile {
  DatasetRef dataset = 1;
  string key = 2;
  uint64 offset = 3;
}

message DatasetFile {
  string sha256 = 1;
  uint64 size = 2;
  uint64 offset = 3;
  bytes data = 4;
}

message DatasetSummary {
  Dataset dataset = 1;
  repeated TableSummary tables = 2;
}

message TableSummary {
  Table table = 1;
  uint64 partitions = 2;
  uint64 rows = 3;
  string first_day = 4;
  string last_day = 5;
  // Daily, minutes, settlement and price ticks, by the version's calendar: the
  // last day the table should hold through yesterday (Beijing), and the open
  // days each exchange (each contract, for minutes) lacks from its first day
  // through then. Empty and 0 for the other tables and without a calendar.
  string expected_last_day = 6;
  uint64 missing = 7;
  // Open days in that span that every source still answered empty after two
  // more of the exchange's trading days; not in `missing`, and not acquired
  // again unless refetched.
  uint64 source_empty = 8;
}

// Versions, newest first: from the current one, or after `after_version` when paging.
message ListDatasetVersions {
  string after_version = 1;
}

message DatasetVersions {
  // Each compared with its parent.
  repeated DatasetChange versions = 1;
  // Empty on the last page.
  string next_version = 2;
}

message CompareDatasetVersions {
  string version = 1;
  string base = 2;
}

// The partitions `dataset` adds to `base`, replaces in it and removes from it.
message DatasetChange {
  Dataset dataset = 1;
  // Empty for a source's first version.
  string base = 2;
  uint32 added = 3;
  uint32 replaced = 4;
  uint32 removed = 5;
}

// A page of a reference table of one exchange, limited to the days given;
// price tick rules are selected by overlap with their effective interval.
message GetTableRows {
  DatasetRef dataset = 1;
  Table table = 2;
  string exchange = 3;
  string first_day = 4;
  string last_day = 5;
  uint32 offset = 6;
}

message TableRows {
  repeated string columns = 1;
  // At most 100, as text; an absent value is empty.
  repeated TableRow rows = 2;
  uint32 total = 3;
}

message TableRow {
  repeated string values = 1;
}

message DatasetCoverage {
  // Daily bars.
  repeated ProductCoverage products = 1;
  // Minute bars, from the version's partition list.
  repeated ContractCoverage contracts = 2;
}

message ProductCoverage {
  string product = 1;
  repeated MonthCoverage months = 2;
}

message MonthCoverage {
  string month = 1;
  uint32 days = 2;
  uint32 open_days = 3;
  // Open days without bars that every source answered empty.
  uint32 empty_days = 4;
}

message ContractCoverage {
  // EXCHANGE/product/YYYY-MM
  string contract = 1;
  repeated MinuteMonth months = 2;
}

// Trading days with minutes in one month.
message MinuteMonth {
  string month = 1;
  uint32 days = 2;
  uint32 empty_days = 3;
}

// ---- Acquisition

// What Warehouse can acquire.
message AcquisitionOptions {
  repeated Table tables = 1;
  repeated string exchanges = 2;
}

// The client chooses the id. Warehouse takes what it lacks from its sources in order
// of priority. A task names exchanges (none means all of them) and both days, or
// instruments: products (EXCHANGE/product) and contracts (EXCHANGE/product/YYYY-MM),
// where a missing day means each contract's listing or delisting day. Daily,
// settlement and price ticks of instruments cover their exchanges' whole days.
// Minutes take instruments only; calendar and contracts take exchanges only.
message StartAcquisition {
  string id = 1;
  Table table = 2;
  string first_day = 3;
  string last_day = 4;
  repeated string exchanges = 5;
  repeated string instruments = 6;
  bool refetch = 7;
}

message TaskId {
  string id = 1;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_QUEUED = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_SUCCEEDED = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_CANCELLED = 5;
  TASK_STATE_INTERRUPTED = 6;
}

// Items are exchange-days, or contract-days for minutes.
message AcquisitionTask {
  StartAcquisition request = 1;
  TaskState state = 2;
  uint64 items = 3;
  uint64 items_done = 4;
  uint64 items_empty = 5;
  uint64 requests_sent = 6;
  common.Error error = 7;
  int64 started_ms = 8;
  optional int64 finished_ms = 9;
}

// Newest first; 20 a page.
message ListAcquisitionTasks {
  string after_id = 1;
}

message AcquisitionTasks {
  repeated AcquisitionTask tasks = 1;
  // Empty on the last page.
  string next_id = 2;
}
