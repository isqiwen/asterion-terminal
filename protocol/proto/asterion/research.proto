syntax = "proto3";
package asterion.research.proto;
import "asterion/task.proto";
import "asterion/research_variable.proto";
import "asterion/research_statistics.proto";
import "asterion/research_evaluation.proto";
import "asterion/research_sample.proto";
import "asterion/research_strategy.proto";
import "asterion/research_logic.proto";
import "asterion/data.proto";
import "asterion/resource.proto";
import "asterion/node.proto";
import "asterion/trading.proto";
import "asterion/backtest.proto";
import "asterion/factor.proto";
message ResearchSubmit {
  reserved 11;
  StrategyUse strategy_use = 14;
  string id = 1;
  asterion.data.proto.DataOwner data_owner = 7;
  asterion.task.proto.TaskDerivation derivation = 6;
  reserved 4;
  oneof definition {
    asterion.backtest.proto.BacktestRequest backtest = 2;
    asterion.factor.proto.FactorRequest factor_request = 3;
    asterion.backtest.proto.BacktestReuse backtest_reuse = 5;
    StatisticsRequest statistics = 12;
    SampleRequest sample = 13;
    LogicTrialRequest logic_trial = 15;
    EvaluationRequest evaluation = 18;
  }
}
message ResearchRequest {
  uint32 version = 1;
  string service_id = 2;
  string correlation_id = 3;
  reserved 34, 35;
  oneof operation {
    VariableRequest variable = 36;
    StrategyRequest strategy = 37;
    LogicRequest logic = 38;
    ResearchSubmit submit = 10;
    asterion.task.proto.TaskId get = 11;
    asterion.task.proto.TaskListQuery list = 12;
    asterion.task.proto.TaskId cancel = 13;
    asterion.task.proto.TaskId retry = 14;
    asterion.task.proto.TaskId result = 15;
    asterion.protocol.proto.Empty heartbeat = 16;
    asterion.node.proto.Quiesce quiesce = 23;
    asterion.task.proto.TaskId history_usage = 24;
    asterion.task.proto.TaskMetadataEdit metadata_edit = 25;
    asterion.task.proto.TaskId metadata_get = 26;
    asterion.task.proto.TaskId recover_submission = 27;
    asterion.task.proto.TaskId abandon_preparation = 28;
    asterion.resource.proto.Object release_decision = 29;
    asterion.task.proto.TaskRetirementRequest retirement = 30;
    asterion.resource.proto.CatalogueQuery resources = 31;
  }
}
