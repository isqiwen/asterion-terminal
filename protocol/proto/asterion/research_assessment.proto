syntax = "proto3";
package asterion.research.proto;
import "asterion/resource.proto";
import "asterion/domain.proto";
import "asterion/task_state.proto";
import "asterion/research_batch.proto";
import "asterion/research_project.proto";

// A bounded extract from an original successful account, never a re-run or a
// substitute for the original result. Currency and units come from fixed input.
message BatchAssessmentAccount {
  string currency = 1;
  string first_day = 2;
  string last_day = 3;
  uint32 settlement_days = 4;
  asterion.protocol.proto.Decimal deposit = 5;
  asterion.protocol.proto.Decimal closing_equity = 6;
  asterion.protocol.proto.Decimal fees = 7;
  asterion.protocol.proto.Decimal net_profit = 8;
}
message BatchAssessmentTask {
  string id = 1;
  asterion.task.proto.TaskState state = 2;
  uint32 attempt = 3;
  bool retired = 4;
  string error = 5;
  string input_sha256 = 6;
  string result_sha256 = 7;
  string program_artifact = 8;
  string risk_artifact = 9;
  BatchAssessmentAccount account = 10; // Present only with a verified success.
}
message BatchAssessmentSnapshot {
  BacktestBatchState batch = 1;
  BatchAssessmentTask source = 2;
  // Only admitted/actually observed tasks; the manifest still lists every member.
  repeated BatchAssessmentTask members = 3;
}
message BatchAssessmentDeclaration {
  string id = 1;
  asterion.resource.proto.Object batch = 2;
  string expected_snapshot = 3; // Exact preview facts acknowledged by the user.
  string question = 4;
  string scope = 5;
  ConclusionJudgment judgment = 6;
  string reason = 7;
  string selected_task_id = 8; // Empty is a legitimate no-selection decision.
  string selection_reason = 9;
  string unselected_reason = 10;
  bool validation_information_used = 11;
  string information_use = 12; // Declaration, never proof that holdout was unused.
  string previous_id = 13;
  string revision_reason = 14;
}
message BatchAssessment {
  BatchAssessmentDeclaration declaration = 1;
  BatchAssessmentSnapshot snapshot = 2;
  asterion.resource.proto.Owner owner = 3;
  string program_artifact = 4; // Actual recorder, distinct from original producer.
  int64 recorded_at_ms = 5;
  string digest = 6;
}
message BatchAssessmentMutation {
  string id = 1; // Durable operation identity.
  BatchAssessmentDeclaration save = 2;
}
message BatchAssessmentPage {
  string batch_id = 1;
  string after = 2;
  uint32 limit = 3;
}
message BatchAssessmentRequest {
  oneof operation {
    asterion.resource.proto.Object preview = 1;
    BatchAssessmentMutation mutation = 2;
    string read = 3;
    BatchAssessmentPage list = 4;
  }
}
message BatchAssessmentReply {
  BatchAssessmentSnapshot preview = 1;
  string preview_digest = 2;
  BatchAssessment assessment = 3;
  repeated BatchAssessment assessments = 4;
  string next_after = 5;
}
