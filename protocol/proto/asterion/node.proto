syntax = "proto3";
import "asterion/health.proto";
package asterion.node.proto;

// The local services as the Terminal runs them.
enum ServiceKind {
  UNSPECIFIED_SERVICE = 0;
  LAB = 5;
}

message Service {
  string id = 1;
  string state = 4;
  bool desired_running = 5;
  uint64 pid = 6;
  uint32 restarts = 7;
  string error = 8;
  string health = 9;
  int64 last_heartbeat_ms = 10;
  string endpoint = 11;
  string directory = 12;
  ServiceKind kind = 13;
  asterion.runtime.proto.ExecutionHealth execution = 19;
}
message Status {
  string instance_id = 1;
  string node_id = 13; // Stable identity of this machine's data; instance_id is one Terminal run.
  string os = 2;
  string arch = 3;
  string version = 4;
  uint64 uptime_ms = 5;
  repeated Service services = 6;
  uint64 pid = 8;

  enum Phase {
    UNSPECIFIED = 0;
    INITIALIZING = 1;
    READY = 2;
    RECOVERY_REQUIRED = 3;
  }

  Phase phase = 10;
  Error failure = 11;
  asterion.runtime.proto.ExecutionHealth execution = 12;
}
message Error {
  string message = 1;
  string code = 2;
}
