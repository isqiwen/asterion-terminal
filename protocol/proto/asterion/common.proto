syntax = "proto3";
package common;

// Types every service shares.
//
// Every request is answered by a response with the same id whose result field
// has the same name as the request's call field, or by an error.
// Days are "YYYY-MM-DD", months "YYYY-MM"; times are Unix UTC milliseconds.
// A contract is "EXCHANGE/product/YYYY-MM" and a product "EXCHANGE/product".
// Paged reads pass the previous page's next_* as after_*; an empty next_* ends.

message Empty {}

// Exact decimal text, such as "3456.5".
message Decimal {
  string text = 1;
}

// A contract as the exchange and the CTP counter name it, such as SHFE rb2701.
message Instrument {
  string exchange = 1;
  string symbol = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNAVAILABLE = 2;
  ERROR_CODE_CONFLICT = 3;
  ERROR_CODE_PERMISSION_DENIED = 4;
  ERROR_CODE_RESOURCE_EXHAUSTED = 5;
  ERROR_CODE_CANCELLED = 6;
  ERROR_CODE_NOT_FOUND = 7;
  ERROR_CODE_RECOVERY_REQUIRED = 8;
  ERROR_CODE_OPERATION_FAILED = 9;
  ERROR_CODE_INTERNAL_ERROR = 10;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum Period {
  PERIOD_UNSPECIFIED = 0;
  PERIOD_MINUTES_1 = 1;
  PERIOD_MINUTES_5 = 2;
  PERIOD_MINUTES_10 = 3;
  PERIOD_MINUTES_15 = 4;
  PERIOD_MINUTES_30 = 5;
  PERIOD_MINUTES_60 = 6;
  PERIOD_DAY = 7;
  PERIOD_WEEK = 8;
  PERIOD_MONTH = 9;
  PERIOD_QUARTER = 10;
  PERIOD_YEAR = 11;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

// CLOSE lets the exchange choose between today's and yesterday's positions.
enum Offset {
  OFFSET_UNSPECIFIED = 0;
  OFFSET_OPEN = 1;
  OFFSET_CLOSE = 2;
  OFFSET_CLOSE_TODAY = 3;
  OFFSET_CLOSE_YESTERDAY = 4;
}

// Margin and fees per lot, plus rates of price x lots x multiplier.
message Costs {
  Decimal margin_per_lot = 1;
  Decimal margin_rate = 2;
  Decimal open_fee = 3;
  Decimal open_fee_rate = 4;
  Decimal close_today_fee = 5;
  Decimal close_today_fee_rate = 6;
  Decimal close_yesterday_fee = 7;
  Decimal close_yesterday_fee_rate = 8;
}

message RiskLimits {
  Decimal max_order_lots = 1;
  Decimal max_gross_lots = 2;
  uint32 max_working_orders = 3;
}
