name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: asterion
          POSTGRES_PASSWORD: asterion
          POSTGRES_DB: asterion
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ASTERION_DATABASE_URL: postgresql://asterion:asterion@127.0.0.1:5432/asterion
      ASTERION_DATA_ROOT: .state/data
      ASTERION_TEST_DATABASE_URL: postgresql://asterion:asterion@127.0.0.1:5432/asterion
      ASTERION_NATIVE_DATABASE_TEST_CONFIG: >-
        {"backend":"postgresql","host":"127.0.0.1","port":5432,"database":"asterion","user":"asterion","password":"asterion","options":"","connect_timeout_ms":5000,"statement_timeout_ms":30000}
      ASTERION_TOKEN: ci-only-local-test-token-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: uv sync --locked
      - run: cargo fmt --all --check
      - run: cargo test --workspace --release --locked
      - run: cargo test -p asterion-kernel --test database --release --locked -- --ignored
      - run: cargo test -p asterion-kernel --test events_database --release --locked -- --ignored
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: uv run python scripts/generate_domain_models.py --check
      - run: uv run python scripts/generate_task_contract.py --check
      - run: uv run python scripts/generate_communication.py --check
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check src tests scripts bindings/python/asterion_bindings
      - run: uv run ruff format --check src tests scripts bindings/python/asterion_bindings
      - run: uv run pyright
      - run: uv run pytest -q
      - run: uv run python scripts/export_schema.py
      - run: pnpm --filter @asterion/terminal exec openapi-typescript ../../docs/openapi.json -o ../../bindings/typescript/src/schema.d.ts
      - run: git diff --exit-code -- docs/openapi.json docs/reference-schema.json bindings/typescript/src/schema.d.ts services/server/forwarded_routes.json services/server/authorization.json
      - run: pnpm build && pnpm test
      - run: pnpm --filter @asterion/terminal exec playwright install --with-deps chromium
      - run: |
          uv run asterion init
          uv run asterion serve --port 8001 > /tmp/asterion-serve.log 2>&1 &
          .venv/bin/asterion-server --listen 127.0.0.1:8000 --upstream http://127.0.0.1:8001 > /tmp/asterion-server.log 2>&1 &
          uv run asterion worker > /tmp/asterion-worker.log 2>&1 &
          pnpm --filter @asterion/terminal test:e2e
