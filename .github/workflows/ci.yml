name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: asterion
          POSTGRES_PASSWORD: asterion
          POSTGRES_DB: asterion
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ASTERION_DATABASE_URL: postgresql+psycopg://asterion:asterion@127.0.0.1:5432/asterion
      ASTERION_TEST_DATABASE_URL: postgresql+psycopg://asterion:asterion@127.0.0.1:5432/asterion
      ASTERION_TOKEN: ci-only-local-test-token-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright
      - run: uv run pytest -q
      - run: uv run python scripts/export_schema.py
      - run: pnpm --filter @asterion/terminal exec openapi-typescript ../../docs/openapi.json -o src/api/schema.d.ts
      - run: git diff --exit-code -- docs/openapi.json apps/terminal/src/api/schema.d.ts
      - run: pnpm build && pnpm test
      - run: pnpm --filter @asterion/terminal exec playwright install --with-deps chromium
      - run: |
          uv run asterion init
          uv run asterion serve > /tmp/asterion-serve.log 2>&1 &
          uv run asterion worker > /tmp/asterion-worker.log 2>&1 &
          pnpm --filter @asterion/terminal test:e2e
