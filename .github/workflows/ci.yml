name: Core services and macOS Terminal
on: [push, pull_request]
jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install clang-format==23.1.1
      - name: C++ formatting
        run: python scripts/format_cpp.py --check
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript formatting
        run: pnpm format:check
      - name: TypeScript types
        run: pnpm exec tsc --noEmit -p apps/clients/terminal/tsconfig.json
      - name: TypeScript lint
        run: pnpm lint
  core:
    strategy:
      fail-fast: false
      matrix:
        # Linux matches the image the remote bundle is built on. GCC 11 on 22.04
        # leaks initializer-list elements when a later element throws.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install conan==2.32.0 ninja
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      # Dependencies build optimized: embedded DuckDB with debug information
      # exceeds the Agent artifact limit on Linux.
      - run: conan install . -s "&:build_type=Debug" -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing
      - run: cmake --preset conan-debug
      # -k 0 reports every failing translation unit in one run, not only the first.
      - run: cmake --build --preset conan-debug -- -k 0
      - run: ctest --preset conan-debug --output-on-failure
      - name: Prepare Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Native Agent upgrade and recovery
        timeout-minutes: 5
        run: python tests/native_agent_upgrade.py --build build/Debug --allow-user-service
      - name: Install SSH acceptance prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          sudo systemctl start ssh.service
      - name: Repair runner sudoers permissions
        if: runner.os == 'Linux'
        # The hosted image ships /etc/sudoers.d/runner with mode 0640, which
        # the initializer's full visudo check rightly rejects.
        run: sudo chmod 0440 /etc/sudoers.d/runner
      - name: Real SSH and native system service acceptance
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: python tests/ssh_system_service.py --build build/Debug --allow-system-service
  remote-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install conan==2.32.0 ninja
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: conan install . -s build_type=Release -s compiler.cppstd=20 -o with_tests=False -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing
      - run: cmake --preset conan-release
      - run: cmake --build --preset conan-release --target asterion-node-agent asterion-trading asterion-market-data asterion-task-service asterion-backtest asterion-factor asterion-data-pipeline asterion-strategy
      - name: Verify native Linux executables
        run: |
          ./build/Release/asterion-node-agent --version
          ./build/Release/asterion-trading --version
          ./build/Release/asterion-task-service --version
          ./build/Release/asterion-backtest --version
          ./build/Release/asterion-factor --version
          ./build/Release/asterion-data-pipeline --version
          ./build/Release/asterion-strategy --version
          ldd build/Release/asterion-node-agent
          ldd build/Release/asterion-trading
      - run: python scripts/deployment_bundle.py build/Release
      - uses: actions/upload-artifact@v4
        with:
          name: remote-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: build/Release/deployment/*.zip

  terminal:
    needs: remote-linux
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ASTERION_CPP_BUILD: ${{ github.workspace }}/build/Debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
      - run: python -m pip install conan==2.32.0 ninja
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: remote-linux-*
          merge-multiple: true
          path: build/linux-bundles
      - name: Build and link native desktop
        run: python scripts/desktop.py check
      - run: ctest --preset conan-debug --output-on-failure
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Exercise native Electron host
        run: pnpm test:desktop
      - name: Build macOS DMG
        run: python scripts/desktop.py build
      - run: ctest --preset conan-release --output-on-failure
      - name: Exercise installed macOS desktop
        timeout-minutes: 8
        run: python tests/electron_installer.py build/desktop/*.dmg
      - name: Upload installed desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-desktop-${{ matrix.os }}
          if-no-files-found: warn
          path: build/installed-desktop/
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.os }}
          if-no-files-found: error
          path: build/desktop/*.dmg

  core-sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sanitizer: address,undefined
          - os: macos-latest
            sanitizer: thread
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install conan==2.32.0 ninja
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: conan install . -s "&:build_type=Debug" -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing
      - run: cmake --preset conan-debug -DASTERION_SANITIZERS=${{ matrix.sanitizer }}
      - run: cmake --build --preset conan-debug
      # The full-budget and large-dataset tests measure capacity, not thread
      # safety; instrumented, they exceed the services' own request timeouts and
      # starve the rest of the run. The uninstrumented jobs run them.
      - run: ctest --preset conan-debug --output-on-failure -E "FullResearchBarBudget|FullSessionBudget|LargeResearchDatasets"
        env:
          ASTERION_TIMING_SCALE: "20"
          # Uninstrumented protobuf poisons its own arena memory and annotates
          # its repeated fields through inlined header code; ignore manual
          # poisoning and container annotations, keep heap checks.
          ASAN_OPTIONS: ${{ contains(matrix.sanitizer, 'address') && 'allow_user_poisoning=0:detect_container_overflow=0' || '' }}
