name: Asterion CI
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# The packaged desktop supports macOS 13.0; build every macOS job for it so
# APIs from newer systems fail here, not in the release build.
env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check whether non-documentation files changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            if ! git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            range="${base}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            range="${before}..${{ github.sha }}"
          fi
          changed=$(git diff --name-only "$range")
          if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install clang-format==23.1.1 ruff==0.17.5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: C/C++, Protobuf and frontend formatting
        run: pnpm format:check
      - name: Generated protocol types are current
        run: pnpm generate:protocol && test -z "$(git status --porcelain apps/clients/terminal/src/generated)"
      - name: TypeScript types
        run: pnpm exec tsc --noEmit -p apps/clients/terminal/tsconfig.json
      - name: TypeScript and Python lint
        run: pnpm lint
      - name: Shell scripts (shellcheck)
        run: |
          for svc in market trading warehouse; do
            cat "apps/services/$svc/scripts/setup.sh" apps/services/common/scripts/setup.sh | shellcheck -
          done
          shellcheck scripts/services/build_linux_services.sh scripts/services/linux-services-container.sh
      - name: Documentation links and heading anchors
        run: python3 scripts/check_docs_links.py
      - name: TypeScript unit and component tests
        run: pnpm test:unit

  release-macos:
    name: Release / macOS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    env:
      ASTERION_CPP_BUILD: ${{ github.workspace }}/build/Release
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - &runner-image
        name: Read runner image version
        id: runner-image
        run: echo "version=${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - &ccache
        name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.26
        with:
          install: binary
          max-size: 1G
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ github.job }}
      - &conan-cache
        name: Cache Conan packages
        id: conan-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conan-packages.tgz
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ github.job }}-${{ hashFiles('VERSION', 'conan.lock', 'conanfile.py', 'conan/**', 'scripts/prepare_ctp.py', 'scripts/desktop/desktop.py', '.github/workflows/ci.yml') }}
      - &conan-restore
        name: Restore Conan packages
        if: steps.conan-cache.outputs.cache-hit == 'true'
        run: conan cache restore "${{ runner.temp }}/conan-packages.tgz"
      - name: Cache uv and Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/uv
            ~/Library/Caches/electron
          key: runtime-caches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/services/lab/uv.lock', 'scripts/desktop/python_runtime.py', 'pnpm-lock.yaml') }}
          restore-keys: |
            runtime-caches-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Build Terminal installer and native desktop
        run: python scripts/desktop/desktop.py package-test --prepare-python
      - &conan-save
        name: Prepare Conan cache
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: conan cache save '*:*' --no-source -cc core:compresslevel=1 --file "${{ runner.temp }}/conan-packages.tgz"
      # Linux-only Trading daemon process tests run on Release / Linux; keep C++
      # Trading unit tests and every macOS/Lab/Market/Warehouse/Terminal test here.
      - name: Run C++ and Lab test suite
        run: ctest --preset conan-release --output-on-failure -E '^(strategy_stream_process|cross_session_portfolio_process|dominant_roll_process|capital_risk_process|webhook_process|strategy_process|emergency_migration_process|live_process|trading_remote_instances|acceptance_dry_run|trading_startup)$'
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Browser end-to-end tests (2 parallel shards)
        run: |
          ASTERION_DEV_PORT=1424 ASTERION_E2E_OUTPUT_DIR=./test-results-1 pnpm run test:e2e --shard=1/2 > build/e2e-shard-1.log 2>&1 &
          pid1=$!
          ASTERION_DEV_PORT=1425 ASTERION_E2E_OUTPUT_DIR=./test-results-2 pnpm run test:e2e --shard=2/2 > build/e2e-shard-2.log 2>&1 &
          pid2=$!
          rc1=0; wait "$pid1" || rc1=$?
          rc2=0; wait "$pid2" || rc2=$?
          echo "::group::Playwright E2E shard 1/2 (exit $rc1)"
          cat build/e2e-shard-1.log
          echo "::endgroup::"
          echo "::group::Playwright E2E shard 2/2 (exit $rc2)"
          cat build/e2e-shard-2.log
          echo "::endgroup::"
          test "$rc1" -eq 0 && test "$rc2" -eq 0
      - name: Exercise native Electron host
        run: pnpm test:desktop
      - name: Upload Terminal installer
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: build/desktop-test/*.dmg

  # The whole browser suite runs on the macOS job. Only the @trading tests run
  # here, because the trading service runs on Linux only and they skip elsewhere.
  release-linux:
    name: Release / Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      ASTERION_CPP_BUILD: ${{ github.workspace }}/build/Release
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - *runner-image
      - *ccache
      - *conan-cache
      - *conan-restore
      - name: Cache uv and Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            ~/.cache/electron
          key: runtime-caches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/services/lab/uv.lock', 'scripts/desktop/python_runtime.py', 'pnpm-lock.yaml') }}
          restore-keys: |
            runtime-caches-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Prepare a display and the Electron sandbox
        # Ubuntu 24.04 restricts the unprivileged user namespaces that the
        # Chromium sandbox uses; the Terminal never runs with --no-sandbox.
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # A crashed renderer never exits while the kernel pipes its core to
          # systemd-coredump, and RLIMIT_CORE does not apply to a pipe.
          sudo sysctl -w kernel.core_pattern=core
      - name: Build Terminal installer and native desktop
        env:
          ASTERION_CONAN_CACHE_HIT: ${{ steps.conan-cache.outputs.cache-hit == 'true' && '1' || '' }}
        run: python scripts/desktop/desktop.py package-test --prepare-python
      - *conan-save
      - name: Build service installers
        run: |
          cmake --build build/Release --target asterion_trading_setup asterion_warehouse_setup asterion_market_setup
          echo "PRODUCT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Verify service executables
        run: |
          ./build/Release/asterion_trading --version
          ldd build/Release/asterion_trading
          ./build/Release/asterion_warehouse --version
          ldd build/Release/asterion_warehouse
          ./build/Release/asterion_market --version
          ldd build/Release/asterion_market
      - name: Upload Trading installer
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: build/Release/Asterion-Trading-${{ env.PRODUCT_VERSION }}-linux-x86_64.sh
      - name: Upload Warehouse installer
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: build/Release/Asterion-Warehouse-${{ env.PRODUCT_VERSION }}-linux-x86_64.sh
      - name: Upload Market installer
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: build/Release/Asterion-Market-${{ env.PRODUCT_VERSION }}-linux-x86_64.sh
      - name: Install Playwright system dependencies and Chromium
        run: |
          pnpm exec playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            pnpm exec playwright install chromium
          fi
      # Overlap the two real-clock minute-stream tests (~0% CPU, 3-5 min wall)
      # with the rest of ctest, and pin the single-CPU repeat gate to one core
      # while @trading E2E, native Electron checks and recovery gate use the rest.
      - name: Run C++, Lab, single-CPU repeat, E2E, desktop and recovery suites
        run: |
          ctest --preset conan-release --output-on-failure -j 2 \
            -R '^(strategy_stream_process|cross_session_portfolio_process)$' \
            > build/ctest-realtime.log 2>&1 &
          pid_stream=$!

          rc_ctest=0
          ctest --preset conan-release --output-on-failure \
            -E '^(strategy_stream_process|cross_session_portfolio_process)$' || rc_ctest=$?

          rc_repeat=0
          rc_trading=0
          if [ "$rc_ctest" -eq 0 ]; then
            mapfile -t cpus < <(python -c 'import os; print("\n".join(map(str, sorted(os.sched_getaffinity(0)))))')
            cpu0="${cpus[0]}"
            other_cpus=$(IFS=,; echo "${cpus[*]:1}")
            taskset -c "$cpu0" ctest --preset conan-release --output-on-failure -j 1 \
              --repeat until-fail:5 -R '^(market_live_process|market_process|warehouse_concurrency)$' \
              > build/ctest-repeat-1cpu.log 2>&1 &
            pid_repeat=$!

            run_other=()
            if [ -n "$other_cpus" ]; then
              run_other=(taskset -c "$other_cpus")
            fi
            "${run_other[@]}" pnpm run test:e2e --grep @trading \
              && (
                ulimit -c 0
                "${run_other[@]}" xvfb-run -a pnpm test:desktop
              ) \
              && "${run_other[@]}" python tests/support/recovery_gate.py --build build/Release \
              || rc_trading=$?

            wait "$pid_repeat" || rc_repeat=$?
            echo "::group::Repeat Market and Warehouse process tests on one CPU (exit $rc_repeat)"
            cat build/ctest-repeat-1cpu.log
            echo "::endgroup::"
          else
            kill "$pid_stream" 2>/dev/null || true
          fi

          rc_stream=0
          wait "$pid_stream" || rc_stream=$?
          echo "::group::Real-clock Trading stream tests (exit $rc_stream)"
          cat build/ctest-realtime.log
          echo "::endgroup::"

          test "$rc_ctest" -eq 0 && test "$rc_repeat" -eq 0 && test "$rc_trading" -eq 0 && test "$rc_stream" -eq 0
      - name: Upload Terminal installer
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: build/desktop-test/*.deb

  sanitizers:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan / Linux
            os: ubuntu-24.04
            sanitizer: address,undefined
          - name: TSan / macOS
            os: macos-latest
            sanitizer: thread
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - *runner-image
      - *ccache
      - *conan-cache
      - *conan-restore
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: conan install . -s "&:build_type=Debug" -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing
      - *conan-save
      - run: cmake --preset conan-debug -DASTERION_SANITIZERS=${{ matrix.sanitizer }}
      - run: cmake --build --preset conan-debug
      # Python loads an uninstrumented interpreter; Lab is covered by the desktop jobs.
      - run: ctest --preset conan-debug --output-on-failure -E '^lab_(strategy|catalog|dominant|service)$'
        env:
          ASTERION_TIMING_SCALE: "20"
          # Uninstrumented protobuf poisons its own arena memory and annotates
          # its repeated fields through inlined header code; ignore manual
          # poisoning and container annotations, keep heap checks.
          ASAN_OPTIONS: ${{ contains(matrix.sanitizer, 'address') && 'allow_user_poisoning=0:detect_container_overflow=0' || '' }}
