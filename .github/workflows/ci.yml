name: Core services and Terminal
on: [push, pull_request]
# The packaged desktop supports macOS 13.0; build every macOS job for it so
# APIs from newer systems fail here, not in the release build.
env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"
jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install clang-format==23.1.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: C/C++, Protobuf and frontend formatting
        run: pnpm format:check
      - name: Generated protocol types are current
        run: pnpm generate:protocol && test -z "$(git status --porcelain apps/clients/terminal/src/generated)"
      - name: TypeScript types
        run: pnpm exec tsc --noEmit -p apps/clients/terminal/tsconfig.json
      - name: TypeScript lint
        run: pnpm lint
      - name: TypeScript unit and component tests
        run: pnpm test:unit
  core:
    strategy:
      fail-fast: false
      matrix:
        # Linux matches the image the host releases are built on. GCC 11 on 22.04
        # leaks initializer-list elements when a later element throws.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      # Dependencies build optimized; only the project is a debug build.
      - run: conan install . -s "&:build_type=Debug" -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing
      - run: cmake --preset conan-debug
      # -k 0 reports every failing translation unit in one run, not only the first.
      - run: cmake --build --preset conan-debug -- -k 0
      - run: python scripts/desktop/python_runtime.py
      - run: ctest --preset conan-debug --output-on-failure
  linux-hosts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install conan==2.32.0 ninja
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: conan install . -s build_type=Release -s compiler.cppstd=20 -o with_tests=False -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing
      - run: cmake --preset conan-release
      # The trading and recording hosts' own releases, one self-extracting
      # script each.
      - run: cmake --build build/Release --target asterion_trading_setup
      - name: Verify the trading service
        run: |
          ./build/Release/asterion_trading --version
          ldd build/Release/asterion_trading
      - uses: actions/upload-artifact@v4
        with:
          name: trading-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: build/Release/asterion-trading-setup.sh
      - run: cmake --build build/Release --target asterion_recorder_setup
      - name: Verify the recorder
        run: |
          ./build/Release/asterion_recorder --version
          ldd build/Release/asterion_recorder
      - uses: actions/upload-artifact@v4
        with:
          name: recorder-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: build/Release/asterion-recorder-setup.sh

  terminal:
    needs: [style, core, core-sanitizers, linux-hosts]
    runs-on: macos-latest
    env:
      ASTERION_CPP_BUILD: ${{ github.workspace }}/build/Debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Build and link native desktop
        run: python scripts/desktop/desktop.py check --prepare-python
      - run: ctest --preset conan-debug --output-on-failure
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Exercise native Electron host
        run: pnpm test:desktop
      - name: Build isolated acceptance DMG
        run: python scripts/desktop/desktop.py package-test
      - run: ctest --preset conan-release --output-on-failure
      - name: Validate complete recovery gate
        run: python tests/support/recovery_gate.py --build build/Release
      - name: Exercise installed macOS desktop
        timeout-minutes: 8
        run: python tests/desktop/electron_installer.py build/desktop-test/*.dmg
      - name: Upload installed desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-desktop-macos
          if-no-files-found: warn
          path: build/installed-desktop/
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-test-macos
          if-no-files-found: error
          path: build/desktop-test/*.dmg

  # The whole browser suite runs on the macOS job. Only the @trading tests run
  # here, because the trading service runs on Linux only and they skip elsewhere.
  terminal-linux:
    needs: [style, core, core-sanitizers, linux-hosts]
    runs-on: ubuntu-24.04
    env:
      ASTERION_CPP_BUILD: ${{ github.workspace }}/build/Debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Prepare a display and the Electron sandbox
        # Ubuntu 24.04 restricts the unprivileged user namespaces that the
        # Chromium sandbox uses; the Terminal never runs with --no-sandbox.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and link native desktop
        run: python scripts/desktop/desktop.py check --prepare-python
      - run: ctest --preset conan-debug --output-on-failure
      - run: pnpm exec playwright install --with-deps chromium
      - name: Trading browser tests
        run: pnpm run test:e2e --grep @trading
      - name: Exercise native Electron host
        run: xvfb-run -a pnpm test:desktop
      - name: Build isolated acceptance package
        run: python scripts/desktop/desktop.py package-test
      - run: ctest --preset conan-release --output-on-failure
      - name: Exercise unpacked Linux desktop
        timeout-minutes: 8
        run: xvfb-run -a python tests/desktop/electron_installer.py build/desktop-test/*.tar.gz
      - name: Upload unpacked desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-desktop-linux
          if-no-files-found: warn
          path: build/installed-desktop/
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-test-linux
          if-no-files-found: error
          path: build/desktop-test/*.tar.gz

  core-sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sanitizer: address,undefined
          - os: macos-latest
            sanitizer: thread
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: conan install . -s "&:build_type=Debug" -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing
      - run: cmake --preset conan-debug -DASTERION_SANITIZERS=${{ matrix.sanitizer }}
      - run: cmake --build --preset conan-debug
      # The full-budget and large-dataset tests measure capacity, not thread
      # safety; instrumented, they exceed the services' own request timeouts and
      # starve the rest of the run. The uninstrumented jobs run them.
      - run: python scripts/desktop/python_runtime.py
      - run: ctest --preset conan-debug --output-on-failure -E "^(Backtest\.FullBarBudgetRunsThroughFinalSettlement|TerminalApi\.LargeNamedDatasetsBacktest|TaskProcess\.MaximumFactorInputCompletesAndRestartedResultReadKeepsControlsAvailable)$"
        env:
          ASTERION_TIMING_SCALE: "20"
          # Uninstrumented protobuf poisons its own arena memory and annotates
          # its repeated fields through inlined header code; ignore manual
          # poisoning and container annotations, keep heap checks.
          ASAN_OPTIONS: ${{ contains(matrix.sanitizer, 'address') && 'allow_user_poisoning=0:detect_container_overflow=0' || '' }}
