name: Core services and Terminal
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# The packaged desktop supports macOS 13.0; build every macOS job for it so
# APIs from newer systems fail here, not in the release build.
env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"
jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install clang-format==23.1.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: C/C++, Protobuf and frontend formatting
        run: pnpm format:check
      - name: Generated protocol types are current
        run: pnpm generate:protocol && test -z "$(git status --porcelain apps/clients/terminal/src/generated)"
      - name: TypeScript types
        run: pnpm exec tsc --noEmit -p apps/clients/terminal/tsconfig.json
      - name: TypeScript lint
        run: pnpm lint
      - name: TypeScript unit and component tests
        run: pnpm test:unit
  core:
    strategy:
      fail-fast: false
      matrix:
        # Linux matches the image the host releases are built on. GCC 11 on 22.04
        # leaks initializer-list elements when a later element throws.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - &conan-cache
        name: Cache Conan packages
        id: conan-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conan-packages.tgz
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ github.job }}-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/**', 'scripts/prepare_ctp.py', 'scripts/desktop/desktop.py', '.github/workflows/ci.yml') }}
      - &conan-restore
        name: Restore Conan packages
        if: steps.conan-cache.outputs.cache-hit == 'true'
        run: conan cache restore "${{ runner.temp }}/conan-packages.tgz"
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      # Dependencies build optimized; only the project is a debug build.
      - run: conan install . -s "&:build_type=Debug" -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing
      - &conan-save
        name: Prepare Conan cache
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: conan cache save '*:*' --no-source -cc core:compresslevel=1 --file "${{ runner.temp }}/conan-packages.tgz"
      - run: cmake --preset conan-debug
      # -k 0 reports every failing translation unit in one run, not only the first.
      - run: cmake --build --preset conan-debug -- -k 0
      - run: python scripts/desktop/python_runtime.py
      - run: ctest --preset conan-debug --output-on-failure
        env:
          ASTERION_TEST_RUNTIME_MANIFEST: ${{ github.workspace }}/build/electron-resources/runtime
      - name: Repeat Market process tests on one CPU
        if: runner.os == 'Linux'
        run: |
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" ctest --preset conan-debug --output-on-failure -j 1 --repeat until-fail:5 -R 'CtpPublication.CatalogRevision|CtpEvents.ProcessExposes|^market_recording_process$|^market_process$'
      - name: Market release without a Python runtime
        if: runner.os == 'Linux'
        run: |
          cmake --build build/Debug --target asterion_market_setup
          build/electron-resources/python/bin/python3 tests/market/package_test.py build/Debug/asterion-market-setup.sh
  linux-hosts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - *conan-cache
      - *conan-restore
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: conan install . -s build_type=Release -s compiler.cppstd=20 -o with_tests=False -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing
      - *conan-save
      - run: cmake --preset conan-release
      # The trading and Market hosts' own releases, one self-extracting
      # script each.
      - run: cmake --build build/Release --target asterion_trading_setup
      - name: Verify the trading service
        run: |
          ./build/Release/asterion_trading --version
          ldd build/Release/asterion_trading
      - name: Offline Trading runtime and strategy limits
        run: python tests/trading/package_test.py build/Release/asterion-trading-setup.sh
      - uses: actions/upload-artifact@v6
        with:
          name: trading-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: build/Release/asterion-trading-setup.sh
      - run: cmake --build build/Release --target asterion_market_setup
      - name: Verify Market
        run: |
          ./build/Release/asterion_market --version
          ldd build/Release/asterion_market
      - uses: actions/upload-artifact@v6
        with:
          name: market-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: build/Release/asterion-market-setup.sh

  terminal:
    runs-on: macos-latest
    env:
      ASTERION_CPP_BUILD: ${{ github.workspace }}/build/Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - *conan-cache
      - *conan-restore
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      # Core covers Debug; desktop tests and packaging share the Release build.
      - name: Build acceptance installer and native desktop
        run: python scripts/desktop/desktop.py package-test --prepare-python
      - *conan-save
      - run: ctest --preset conan-release --output-on-failure
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Exercise native Electron host
        run: pnpm test:desktop
      - name: Exercise packaged macOS desktop
        timeout-minutes: 8
        run: python tests/desktop/electron_package.py build/desktop-test/*.dmg
      - name: Upload Terminal installer
        uses: actions/upload-artifact@v6
        with:
          name: terminal-macos-arm64
          if-no-files-found: error
          path: build/desktop-test/*.dmg

  # The whole browser suite runs on the macOS job. Only the @trading tests run
  # here, because the trading service runs on Linux only and they skip elsewhere.
  terminal-linux:
    runs-on: ubuntu-24.04
    env:
      ASTERION_CPP_BUILD: ${{ github.workspace }}/build/Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - *conan-cache
      - *conan-restore
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Prepare a display and the Electron sandbox
        # Ubuntu 24.04 restricts the unprivileged user namespaces that the
        # Chromium sandbox uses; the Terminal never runs with --no-sandbox.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Core covers Debug; desktop tests and packaging share the Release build.
      - name: Build acceptance installer and native desktop
        run: python scripts/desktop/desktop.py package-test --prepare-python
      - *conan-save
      - run: ctest --preset conan-release --output-on-failure
      - run: pnpm exec playwright install --with-deps chromium
      - name: Trading browser tests
        run: pnpm run test:e2e --grep @trading
      - name: Exercise native Electron host
        run: xvfb-run -a pnpm test:desktop
      - name: Validate complete recovery gate
        run: python tests/support/recovery_gate.py --build build/Release
      - name: Exercise packaged Linux desktop
        timeout-minutes: 8
        run: xvfb-run -a python tests/desktop/electron_package.py build/desktop-test/*.deb
      - name: Upload Terminal installer
        uses: actions/upload-artifact@v6
        with:
          name: terminal-linux-x86_64
          if-no-files-found: error
          path: build/desktop-test/*.deb

  core-sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sanitizer: address,undefined
          - os: macos-latest
            sanitizer: thread
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install conan==2.32.0 ninja uv==0.12.9
      - *conan-cache
      - *conan-restore
      - run: conan profile detect
      - run: python scripts/prepare_ctp.py
      - run: conan install . -s "&:build_type=Debug" -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing
      - *conan-save
      - run: cmake --preset conan-debug -DASTERION_SANITIZERS=${{ matrix.sanitizer }}
      - run: cmake --build --preset conan-debug
      # Python loads an uninstrumented interpreter; Lab and runtime installation
      # are covered by the ordinary core and desktop jobs.
      - run: ctest --preset conan-debug --output-on-failure -E '^(lab_(strategy|sessions|dominant|service)$|PythonRuntime[.])'
        env:
          ASTERION_TIMING_SCALE: "20"
          # Uninstrumented protobuf poisons its own arena memory and annotates
          # its repeated fields through inlined header code; ignore manual
          # poisoning and container annotations, keep heap checks.
          ASAN_OPTIONS: ${{ contains(matrix.sanitizer, 'address') && 'allow_user_poisoning=0:detect_container_overflow=0' || '' }}
