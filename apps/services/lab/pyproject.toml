# The bundled Python runtime of the lab service: these locked packages.
[dependency-groups]
# These numerical releases still ship wheels for macOS 13 (Apple Silicon).
runtime = ["quantstats==0.0.86", "protobuf==5.29.3", "duckdb==1.4.1", "certifi==2026.7.22", "numpy==2.3.5", "scipy==1.17.1", "polars[rtcompat]==2.0.0"]

[tool.uv]
environments = ["python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'", "python_version == '3.12' and sys_platform == 'darwin' and platform_machine == 'arm64'"]
