# The bundled Python runtime: the lab service and the analytics helper share these locked packages.
[project]
name = "asterion-lab"
version = "0.1.0"
requires-python = "==3.12.*"
# These numerical releases still ship wheels for macOS 13 (Apple Silicon).
dependencies = ["quantstats==0.0.86", "protobuf==5.29.3", "duckdb==1.4.1", "akshare==1.19.1", "certifi==2026.7.22", "numpy==2.3.5", "scipy==1.17.1", "polars[rtcompat]==2.0.0", "skfolio==1.9.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
