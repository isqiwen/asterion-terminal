# Trading's independently shipped strategy runtime. Packages cannot add dependencies.
[project]
name = "asterion-trading-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["numpy==2.3.5", "protobuf==5.29.3"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
