[package]
name = "asterion-terminal"
version = "0.1.0"
edition = "2021"
default-run = "asterion-terminal"
[package.metadata.asterion]
layer = "L5"
kind = "entry"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
asterion-desktop-bridge = { path = "../../../presentation/desktop-bridge" }
asterion-product-terminal = { path = "../../../products/terminal" }
asterion-foundation = { path = "../../../foundation" }
asterion-kernel = { path = "../../../kernel" }
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
