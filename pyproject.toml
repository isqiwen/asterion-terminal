[project]
name = "asterion-terminal"
version = "0.1.0"
description = "Asterion futures research and trading terminal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
    "pyarrow>=18,<24",
    "cryptography>=44,<47",
]
[project.scripts]
asterion = "asterion.runtime.cli:main"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1"]
packaging = [
    "pyinstaller>=6.22.3",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/asterion"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
