[project]
name = "asterion-terminal"
version = "0.1.0"
description = "Asterion futures research and trading terminal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
    "pyarrow>=18,<24",
    "openctp-ctp==6.7.7.1",
]
[project.scripts]
asterion = "asterion.runtime.cli:main"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1"]
packaging = [
    "setuptools>=80",
    "setuptools-rust>=1.12,<2",
]
[build-system]
requires = ["setuptools>=80", "setuptools-rust>=1.12,<2"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = { "" = "src", asterion_bindings = "bindings/python/asterion_bindings" }
[tool.setuptools.packages.find]
where = ["src", "bindings/python"]
include = ["asterion", "asterion.*", "asterion_plugin_sdk", "asterion_plugin_sdk.*", "asterion_bindings"]
namespaces = true
[tool.setuptools.package-data]
asterion_bindings = ["*.pyi", "py.typed"]
[[tool.setuptools-rust.ext-modules]]
target = "asterion_bindings._native"
path = "bindings/python/Cargo.toml"
binding = "PyO3"
debug = false
py-limited-api = "cp312"
args = ["--locked"]
# The Rust HTTP entry is installed into the environment's scripts directory.
[[tool.setuptools-rust.bins]]
target = "asterion-server"
path = "services/server/Cargo.toml"
debug = false
args = ["--locked"]
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.cfg" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "kernel/**/*.rs" },
    { file = "kernel/**/Cargo.toml" },
    { file = "adapters/**/*.rs" },
    { file = "adapters/**/Cargo.toml" },
    { file = "bindings/python/**/*.rs" },
    { file = "bindings/python/Cargo.toml" },
    { file = "services/**/*.rs" },
    { file = "services/**/Cargo.toml" },
    { file = "services/server/forwarded_routes.json" },
    { file = "services/server/authorization.json" },
    { file = "services/server/openapi.json" },
]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.pyright]
include = ["src", "bindings/python/asterion_bindings"]
extraPaths = ["src", "bindings/python"]
typeCheckingMode = "basic"
