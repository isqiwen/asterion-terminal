<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-label="UI-DAT-PRC-01 加工规则与质量检查目标布局"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:16px;fill:#c5ccd6}.strong{fill:#eef4fb;font-weight:600}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}</style><rect width="1280" height="850" fill="#06080b" /><text x="24" y="30" class="accent">UI-DAT-PRC-01 · 产品界面设计</text><text x="24" y="66" class="title">加工规则与质量检查</text><text x="24" y="842" class="muted">字段值均为虚构示例；空值、阻断与控件类型用于说明交互，完整规则见同编号界面规格。</text><rect x="24" y="88" width="92" height="710" rx="2" fill="#0b0e13" stroke="#2a3543" /><rect x="30" y="107" width="80" height="36" rx="2" fill="#0b171f" stroke="#246373" /><text x="54" y="132" class="accent">数据</text><text x="54" y="176" class="">情报</text><text x="54" y="220" class="">分析</text><text x="54" y="264" class="">策略</text><text x="54" y="308" class="">回测</text><text x="54" y="352" class="">评估</text><text x="54" y="396" class="">实盘</text><text x="37" y="743" class="muted">系统管理</text><text x="138" y="111" class="muted">数据 → 加工与质量 → 加工规则与质量检查</text><rect x="138" y="133" width="1118" height="53" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154.0" y="155" class="">接入与采集</text><text x="526.6666666666667" y="155" class="accent">加工与质量</text><path d="M526.6666666666667 160 H606.6666666666667" stroke="#38d6f2" stroke-width="2" /><text x="899.3333333333334" y="155" class="">管理与服务</text><text x="154" y="179" class="muted">虚构示例 · 固定输入 S1 · 加工草稿 · 样本预览</text><rect x="138" y="799" width="1118" height="24" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="150" y="816" class="muted">任务  ·  通知  ·  连接状态</text><text x="835" y="816" class="muted" style="font-size:13px">状态以实际结果显示；点击返回所属对象</text><g id="business-detail"><rect x="138" y="204" width="230" height="340" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154" y="234" class="strong" style="font-size:16px">输入与步骤顺序</text><path d="M138 249 H368" stroke="#1a212b" /><text x="154" y="274" class="muted" style="font-size:13px">固定输入（选择器）</text><text x="154" y="298" class="" style="font-size:14px">S1 · 示例 1 分钟数据</text><text x="154" y="358" class="" style="font-size:14px">1  标准化单位</text><text x="154" y="390" class="" style="font-size:14px">2  按事件键去重</text><text x="154" y="422" class="" style="font-size:14px">3  聚合 5 分钟</text><text x="154" y="454" class="" style="font-size:14px">↑ ↓ 调整步骤顺序</text><rect x="384" y="204" width="570" height="340" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="400" y="234" class="strong" style="font-size:16px">加工规则（可编辑）</text><path d="M384 249 H954" stroke="#1a212b" /><text x="400" y="270" class="muted" style="font-size:13px">用途与必要条件（枚举）</text><rect x="400" y="279" width="538" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="412" y="301" class="" style="font-size:14px">严格历史研究  ▾    完整交易时段：必需</text><text x="400" y="334" class="muted" style="font-size:13px">聚合周期 / 短桶（枚举）</text><rect x="400" y="343" width="538" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="412" y="365" class="" style="font-size:14px">5 分钟  ▾    短桶不输出  ▾</text><text x="400" y="398" class="muted" style="font-size:13px">日历 / 时区 / 时间标记（需确认）</text><rect x="400" y="407" width="538" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="412" y="429" class="" style="font-size:14px">日历 C1  ▾    Asia/Shanghai    结束时刻</text><text x="400" y="478" class="muted" style="font-size:13px">不跨午休拼桶；未完成桶不发布为完成数据</text><text x="400" y="508" class="muted" style="font-size:13px">输入或规则修改后，已有预览失效</text><rect x="970" y="204" width="286" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="986" y="234" class="strong" style="font-size:16px">质量与原值定位</text><path d="M970 249 H1256" stroke="#1a212b" /><text x="986" y="278" class="muted" style="font-size:13px">样本检查结果</text><text x="986" y="302" class="" style="font-size:14px">重复 1 条；冲突 0 条</text><text x="986" y="350" class="muted" style="font-size:13px">覆盖 / 必需条件</text><text x="986" y="374" class="" style="font-size:14px">仅预览样本；全量尚未检查</text><text x="986" y="422" class="muted" style="font-size:13px">原件定位</text><text x="986" y="446" class="" style="font-size:14px">重复记录 → 来源行 6</text><text x="986" y="494" class="muted" style="font-size:13px">缺日历时</text><text x="986" y="518" class="" style="font-size:14px">阻断时间对齐，不猜交易日</text><text x="986" y="578" class="muted" style="font-size:13px">原始数据始终保留</text><text x="986" y="610" class="muted" style="font-size:13px">结果发布须检查完整范围</text><rect x="138" y="560" width="816" height="154" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154" y="590" class="strong" style="font-size:16px">预览对照（虚构样本 · 只读）</text><path d="M138 605 H954" stroke="#1a212b" /><text x="154" y="624" class="" style="font-size:14px">输入 6 条 → 去重保留 5 条 + 重复 1 条</text><text x="154" y="652" class="" style="font-size:14px">5 条完整分钟 → 1 条五分钟；聚合与去重分别核对计数</text><text x="154" y="680" class="" style="font-size:14px">输出：未发布 · 本样本通过不代表全量质量通过</text><rect x="154" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="166" y="766" class="accent" style="font-size:14px">预览加工</text><rect x="288" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="300" y="766" class="accent" style="font-size:14px">加工并检查</text><rect x="422" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="434" y="766" class="accent" style="font-size:14px">保存定义</text></g></svg>
