<text x="28" y="73" class="title">实验批次与运行记录</text>
<text x="28" y="953" class="small">交互规格图 · 图中数值为说明规则的示例；字段与动作以页面需求为准。</text>
<rect x="24" y="100" width="92" height="817" rx="8" fill="#101820" stroke="#31414e"/>
<text x="50" y="152" class="body">数据</text>
<text x="50" y="208" class="body">情报</text>
<text x="50" y="264" class="body">分析</text>
<text x="50" y="320" class="body">策略</text>
<rect x="30" y="348" width="80" height="42" rx="4" fill="#153039" stroke="#377884"/>
<text x="50" y="376" class="accent">回测</text>
<text x="50" y="432" class="body">评估</text>
<text x="50" y="488" class="body">实盘</text>
<text x="34" y="879" class="small">系统管理</text>
<text x="142" y="125" class="muted">回测  /  实验管理  /  实验批次与运行记录</text>
<rect x="138" y="145" width="1278" height="60" rx="8" fill="#101820" stroke="#31414e"/>
<text x="158" y="170" class="accent">实验管理</text>
<text x="158" y="193" class="small">对象身份与来源固定显示 · 保存、检查、提交分别操作</text>
<rect x="138" y="222" width="180" height="558" rx="8" fill="#101820" stroke="#31414e"/>
<text x="156" y="254" class="head">页面导航</text>
<rect x="150" y="276" width="156" height="43" rx="4" fill="#153039" stroke="#377884"/>
<text x="162" y="303" class="accent">批次列表</text>
<text x="162" y="369" class="body">参数空间</text>
<text x="162" y="435" class="body">展开候选</text>
<text x="162" y="501" class="body">全部尝试</text>
<text x="162" y="567" class="body">失败与复核</text>
<rect x="334" y="222" width="742" height="558" rx="8" fill="#101820" stroke="#31414e"/>
<text x="353" y="254" class="head">有限批次 · 预算阻断示例</text>
<text x="354" y="286" class="muted">字段</text>
<text x="548" y="286" class="muted">值 / 选择</text>
<text x="828" y="286" class="muted">约束 / 解释</text>
<path d="M350 346 H1060" stroke="#24333f"/>
<text x="354" y="328" class="body">基础方案</text>
<text x="548" y="328" class="accent">方案 E / 固定身份</text>
<text x="828" y="328" class="small">条件和验证范围固定</text>
<path d="M350 395 H1060" stroke="#24333f"/>
<text x="354" y="377" class="body">窗口候选</text>
<text x="548" y="377" class="accent">10、20、30 bar</text>
<text x="828" y="377" class="small">有类型有限值</text>
<path d="M350 444 H1060" stroke="#24333f"/>
<text x="354" y="426" class="body">阈值候选</text>
<text x="548" y="426" class="accent">0.1、0.2</text>
<text x="828" y="426" class="small">合法范围内</text>
<path d="M350 493 H1060" stroke="#24333f"/>
<text x="354" y="475" class="body">成本情景</text>
<text x="548" y="475" class="accent">基准、压力</text>
<text x="828" y="475" class="small">逐情景条件固定</text>
<path d="M350 542 H1060" stroke="#24333f"/>
<text x="354" y="524" class="body">重复次数</text>
<text x="548" y="524" class="accent">1</text>
<text x="828" y="524" class="small">用途必须明确</text>
<path d="M350 591 H1060" stroke="#24333f"/>
<text x="354" y="573" class="body">预计运行数</text>
<text x="548" y="573" class="accent">3 × 2 × 2 = 12 次</text>
<text x="828" y="573" class="small">完整清单不截断</text>
<path d="M350 640 H1060" stroke="#24333f"/>
<text x="354" y="622" class="body">次数上限</text>
<text x="548" y="622" class="accent">8 次</text>
<text x="828" y="622" class="small">示例：预算不足4次</text>
<path d="M350 689 H1060" stroke="#24333f"/>
<text x="354" y="671" class="body">并发上限</text>
<text x="548" y="671" class="accent">1</text>
<text x="828" y="671" class="small">可选1～2</text>
<path d="M350 738 H1060" stroke="#24333f"/>
<text x="354" y="720" class="body">状态筛选</text>
<text x="548" y="720" class="accent">全部</text>
<text x="828" y="720" class="small">失败、取消、未开始均保留</text>
<rect x="1092" y="222" width="324" height="558" rx="8" fill="#101820" stroke="#31414e"/>
<text x="1110" y="254" class="head">运行后应能核对</text>
<text x="1112" y="306" class="body">每次尝试独立身份</text>
<path d="M1109 323 H1399" stroke="#24333f"/>
<text x="1112" y="362" class="body">固定参数 / 折次 / 场景</text>
<path d="M1109 379 H1399" stroke="#24333f"/>
<text x="1112" y="418" class="body">阶段与最后可靠时间</text>
<path d="M1109 435 H1399" stroke="#24333f"/>
<text x="1112" y="474" class="body">部分结果显示覆盖</text>
<path d="M1109 491 H1399" stroke="#24333f"/>
<text x="1112" y="530" class="body">取消需等待终态</text>
<path d="M1109 547 H1399" stroke="#24333f"/>
<text x="1112" y="586" class="body">重跑另建并关联原记录</text>
<path d="M1109 603 H1399" stroke="#24333f"/>
<text x="1112" y="718" class="small">只读事实与可编辑草稿分区</text>
<text x="1112" y="746" class="small">离开后按对象身份恢复上下文</text>
<rect x="138" y="797" width="1278" height="53" rx="8" fill="#29251b" stroke="#665b3c"/>
<text x="155" y="828" class="warn">超过次数预算  ·  预计12次 &gt; 上限8次，禁止提交</text>
<rect x="334" y="870" width="174" height="44" rx="5" fill="#153039" stroke="#377884"/>
<text x="352" y="899" class="accent">展开候选</text>
<rect x="522" y="870" width="174" height="44" rx="5" fill="#153039" stroke="#377884"/>
<text x="540" y="899" class="accent">保存草稿</text>
<rect x="710" y="870" width="174" height="44" rx="5" fill="#153039" stroke="#377884"/>
<text x="728" y="899" class="accent">查看记录</text>
<rect x="898" y="870" width="174" height="44" rx="5" fill="#17212a" stroke="#3c4854"/>
<text x="916" y="899" class="disabled">提交批次</text>
<text x="138" y="899" class="muted">任务与通知</text>
</svg>