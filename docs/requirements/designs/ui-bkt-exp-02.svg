<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-label="UI-BKT-EXP-02 实验批次与运行记录 交互规格">
<style>text{font-family:"Noto Sans SC","PingFang SC",sans-serif}.body{font-size:16px;fill:#d6e0e8}.muted{font-size:14px;fill:#a8b5c1}.small{font-size:13px;fill:#a8b5c1}.title{font-size:26px;font-weight:600;fill:#f2f7fb}.head{font-size:18px;font-weight:600;fill:#f2f7fb}.accent{font-size:16px;fill:#6ee0ec}.warn{font-size:16px;fill:#f7ce82}.disabled{font-size:16px;fill:#80909f}</style>
<rect x="0" y="0" width="1440" height="980" rx="0" fill="#081017" stroke="#081017"/>
