<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-label="情报关键异常状态设计"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#c5ccd6;font-size:16px}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}.warn{fill:#edb966}</style><rect width="1280" height="660" fill="#06080b"/><text x="24" y="32" class="accent">情报 · 目标状态设计 · 虚构案例</text><text x="24" y="74" class="title">证据核验 / 冲突待处理</text><rect x="24" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="44" y="150" class="title">1  候选核验</text><rect x="40" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="52" y="203" class="">来源 A：100；来源 B：120</text><text x="52" y="226" class="muted">同一对象与原请求上下文</text><text x="44" y="282" class="muted">当前反馈</text><text x="44" y="315" class="">同一实体、不同统计口径待核对</text><text x="44" y="397" class="muted">操作边界</text><text x="44" y="430" class="muted">原文与证据位置始终可打开</text><rect x="44" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="58" y="539" class="accent">查看证据</text><rect x="440" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="460" y="150" class="title">2  发布受阻</text><rect x="456" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="468" y="203" class="">口径未确认 · 不可发布</text><text x="468" y="226" class="muted">同一对象与原请求上下文</text><text x="460" y="282" class="muted">当前反馈</text><text x="460" y="315" class="warn">保留两个来源及原值</text><text x="460" y="397" class="muted">操作边界</text><text x="460" y="430" class="muted">不得由模型自行选一个事实</text><rect x="460" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="474" y="539" class="accent">补充核验依据</text><rect x="856" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="876" y="150" class="title">3  明确决定</text><rect x="872" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="884" y="203" class="">人工核验统计范围差异</text><text x="884" y="226" class="muted">同一对象与原请求上下文</text><text x="876" y="282" class="muted">当前反馈</text><text x="876" y="315" class="">记录原因和适用范围，再审发布</text><text x="876" y="397" class="muted">操作边界</text><text x="876" y="430" class="muted">发布形成新内容，原材料不改</text><rect x="876" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="890" y="539" class="accent">审阅发布</text><text x="24" y="620" class="muted">图示展示关键反馈和可用动作；详细字段、权限、失败及返回按各 UI 与 FR 规格验收。</text></svg>
