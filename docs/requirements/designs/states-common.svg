<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-label="公共交互关键异常状态设计"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#c5ccd6;font-size:16px}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}.warn{fill:#edb966}</style><rect width="1280" height="660" fill="#06080b"/><text x="24" y="32" class="accent">公共交互 · 目标状态设计 · 虚构案例 · 非实际截图</text><text x="24" y="74" class="title">偏好设置 / 保存失败</text><rect x="24" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="44" y="150" class="title">1  选择语言</text><rect x="40" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="52" y="203" class="">原生效：简体中文</text><text x="52" y="226" class="muted">同一对象与原请求上下文</text><text x="44" y="282" class="muted">当前反馈</text><text x="44" y="315" class="">用户选择 English，提交该项</text><text x="44" y="397" class="muted">操作边界</text><text x="44" y="430" class="muted">选择即保存，无额外保存按钮</text><rect x="44" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="58" y="539" class="accent">English  ▾</text><rect x="440" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="460" y="150" class="title">2  保存失败</text><rect x="456" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="468" y="203" class="">无法持久保存本次选择</text><text x="468" y="226" class="muted">同一对象与原请求上下文</text><text x="460" y="282" class="muted">当前反馈</text><text x="460" y="315" class="warn">原生效值与失败选择均可辨认</text><text x="460" y="397" class="muted">操作边界</text><text x="460" y="430" class="muted">不清空业务草稿、不假报成功</text><rect x="460" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="474" y="539" class="accent">重新选择 / 重试</text><rect x="856" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="876" y="150" class="title">3  保存确认</text><rect x="872" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="884" y="203" class="">收到实际保存确认后应用</text><text x="884" y="226" class="muted">同一对象与原请求上下文</text><text x="876" y="282" class="muted">当前反馈</text><text x="876" y="315" class="">当前生效：English</text><text x="876" y="397" class="muted">操作边界</text><text x="876" y="430" class="muted">其他设置和业务数值不改变</text><rect x="876" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="890" y="539" class="accent">返回工作区</text><text x="24" y="620" class="muted">图示展示关键反馈和可用动作；详细字段、权限、失败及返回按各 UI 与 FR 规格验收。</text></svg>