<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<title>UI-LIV-ACC-03 账户风险规则与生效管理</title>
<desc>开发前目标界面设计，字段提示代表业务类型；案例数值单独标识且不作为默认值。</desc>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="1440" height="1000" rx="0" fill="#06080b" stroke="#06080b"/>
<rect x="0" y="0" width="166" height="1000" rx="0" fill="#0b0e13" stroke="#2a3543"/>
<text x="23" y="39" fill="#38d6f2" font-size="20" font-weight="700">ASTERION</text>
<text x="23" y="65" fill="#7c8796" font-size="12" font-weight="400">交易研究工作台</text>
<text x="32" y="118" fill="#7c8796" font-size="17" font-weight="400">数据</text>
<text x="32" y="171" fill="#7c8796" font-size="17" font-weight="400">情报</text>
<text x="32" y="224" fill="#7c8796" font-size="17" font-weight="400">分析</text>
<text x="32" y="277" fill="#7c8796" font-size="17" font-weight="400">策略</text>
<text x="32" y="330" fill="#7c8796" font-size="17" font-weight="400">回测</text>
<rect x="13" y="409" width="140" height="42" rx="6" fill="#12354b" stroke="#25708b"/>
<text x="32" y="383" fill="#7c8796" font-size="17" font-weight="400">评估</text>
<text x="32" y="436" fill="#38d6f2" font-size="17" font-weight="400">实盘</text>
<text x="31" y="961" fill="#7c8796" font-size="16" font-weight="400">系统管理</text>
<text x="194" y="39" fill="#eef4fb" font-size="24" font-weight="700">账户风险规则与生效管理</text>
<text x="194" y="66" fill="#7c8796" font-size="13" font-weight="400">UI-LIV-ACC-03 · 目标界面设计</text>
<rect x="190" y="87" width="1226" height="57" rx="8" fill="#0f2533" stroke="#275269"/>
<text x="210" y="112" fill="#bae6fd" font-size="16" font-weight="600">账户 / 环境 / 当前有效政策 / 未生效草稿 / 执行边界</text>
<text x="210" y="134" fill="#7c8796" font-size="12" font-weight="400">账户、环境与来源时间持续可见；页面切换不产生交易动作</text>
<rect x="190" y="161" width="819" height="697" rx="8" fill="#0b0e13" stroke="#2a3543"/>
<text x="208" y="192" fill="#eef4fb" font-size="17" font-weight="600">政策字段与生效前比较</text>
<rect x="208" y="223" width="783" height="508" rx="4" fill="#0b1626" stroke="#2a3543"/>
<rect x="208" y="223" width="783" height="39" rx="4" fill="#192c42" stroke="#2a3543"/>
<text x="218" y="248" fill="#7c8796" font-size="13" font-weight="600">政策项目</text>
<text x="442" y="248" fill="#7c8796" font-size="13" font-weight="600">草稿输入与单位</text>
<text x="692" y="248" fill="#7c8796" font-size="13" font-weight="600">当前有效值 / 约束</text>
<text x="218" y="291" fill="#c5ccd6" font-size="13" font-weight="400">单笔数量 / 潜在敞口</text>
<text x="442" y="291" fill="#c5ccd6" font-size="13" font-weight="400">正整数手 / Decimal元</text>
<text x="692" y="291" fill="#c5ccd6" font-size="13" font-weight="400">必填；包括在途与未知</text>
<rect x="209" y="329" width="781" height="67" rx="0" fill="#101f32" stroke="#101f32"/>
<text x="218" y="358" fill="#c5ccd6" font-size="13" font-weight="400">资金 / 保证金 / 价格保护</text>
<text x="442" y="358" fill="#c5ccd6" font-size="13" font-weight="400">Decimal元、比例与基准</text>
<text x="692" y="358" fill="#c5ccd6" font-size="13" font-weight="400">无可交易默认</text>
<text x="218" y="425" fill="#c5ccd6" font-size="13" font-weight="400">损失 / 回撤 / 输入有效期</text>
<text x="442" y="425" fill="#c5ccd6" font-size="13" font-weight="400">基准、%、正整数秒</text>
<text x="692" y="425" fill="#c5ccd6" font-size="13" font-weight="400">基准与恢复条件必填</text>
<rect x="209" y="463" width="781" height="67" rx="0" fill="#101f32" stroke="#101f32"/>
<text x="218" y="492" fill="#c5ccd6" font-size="13" font-weight="400">报单滚动窗口 / 突发</text>
<text x="442" y="492" fill="#c5ccd6" font-size="13" font-weight="400">W秒、笔数、1秒笔数</text>
<text x="692" y="492" fill="#c5ccd6" font-size="13" font-weight="400">全账户入口共享计数</text>
<text x="218" y="559" fill="#c5ccd6" font-size="13" font-weight="400">撤单预算 / 适配器总额</text>
<text x="442" y="559" fill="#c5ccd6" font-size="13" font-weight="400">窗口、笔数、来源依据</text>
<text x="692" y="559" fill="#c5ccd6" font-size="13" font-weight="400">独立撤单额仍受总额约束</text>
<rect x="209" y="597" width="781" height="67" rx="0" fill="#101f32" stroke="#101f32"/>
<text x="218" y="626" fill="#c5ccd6" font-size="13" font-weight="400">连续拒绝暂停</text>
<text x="442" y="626" fill="#c5ccd6" font-size="13" font-weight="400">正整数笔、恢复条件</text>
<text x="692" y="626" fill="#c5ccd6" font-size="13" font-weight="400">柜台拒绝，接纳才清零</text>
<text x="218" y="693" fill="#c5ccd6" font-size="13" font-weight="400">自身订单交叉政策</text>
<text x="442" y="693" fill="#c5ccd6" font-size="13" font-weight="400">固定阻断新单</text>
<text x="692" y="693" fill="#c5ccd6" font-size="13" font-weight="400">不自动撤旧单或改价</text>
<rect x="1025" y="161" width="391" height="697" rx="8" fill="#0b0e13" stroke="#2a3543"/>
<text x="1043" y="192" fill="#eef4fb" font-size="17" font-weight="600">变更影响与生效</text>
<rect x="1043" y="222" width="355" height="86" rx="5" fill="#182435" stroke="#344155"/>
<text x="1056" y="247" fill="#edb966" font-size="14" font-weight="600">现持仓与在途</text>
<text x="1056" y="271" fill="#c5ccd6" font-size="13" font-weight="400">虚构案例：持仓2 + 在途2 = 4手</text>
<text x="1056" y="292" fill="#c5ccd6" font-size="13" font-weight="400">上限由5改为3，超出1手</text>
<rect x="1043" y="355" width="355" height="86" rx="5" fill="#182435" stroke="#344155"/>
<text x="1056" y="380" fill="#edb966" font-size="14" font-weight="600">下调后的行为</text>
<text x="1056" y="404" fill="#c5ccd6" font-size="13" font-weight="400">相关新增受限</text>
<text x="1056" y="425" fill="#c5ccd6" font-size="13" font-weight="400">不自动撤单、平仓或重放</text>
<rect x="1043" y="488" width="355" height="86" rx="5" fill="#182435" stroke="#344155"/>
<text x="1056" y="513" fill="#edb966" font-size="14" font-weight="600">生效请求未知</text>
<text x="1056" y="537" fill="#c5ccd6" font-size="13" font-weight="400">按原政策请求查询执行边界</text>
<text x="1056" y="558" fill="#c5ccd6" font-size="13" font-weight="400">保存草稿不代表已生效</text>
<rect x="1043" y="621" width="355" height="86" rx="5" fill="#182435" stroke="#344155"/>
<text x="1056" y="646" fill="#edb966" font-size="14" font-weight="600">规则恢复不自动运行</text>
<text x="1056" y="670" fill="#c5ccd6" font-size="13" font-weight="400">查看新旧内容与检查依据</text>
<text x="1056" y="691" fill="#c5ccd6" font-size="13" font-weight="400">转运行详情独立审查恢复</text>
<rect x="190" y="876" width="1226" height="99" rx="8" fill="#102538" stroke="#275269"/>
<text x="208" y="905" fill="#c5ccd6" font-size="16" font-weight="600">保存草稿、检查影响与确认生效分开</text>
<text x="208" y="935" fill="#7c8796" font-size="13" font-weight="400">离开可保存草稿、放弃或留页；账户切换不转移政策。</text>
<rect x="1290" y="920" width="106" height="39" rx="5" fill="#17283c" stroke="#40516a"/>
<text x="1303" y="945" fill="#e0f2fe" font-size="14" font-weight="400">确认生效</text>
<rect x="1172" y="920" width="106" height="39" rx="5" fill="#17283c" stroke="#40516a"/>
<text x="1185" y="945" fill="#e0f2fe" font-size="14" font-weight="400">检查影响</text>
<rect x="1054" y="920" width="106" height="39" rx="5" fill="#0e7490" stroke="#28829a"/>
<text x="1067" y="945" fill="#e0f2fe" font-size="14" font-weight="400">保存草稿</text>
</g>
</svg>
