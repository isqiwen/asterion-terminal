<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-label="UI-SYS-SET-01 首次准备目标界面">
<style>text{font-family:system-ui,sans-serif}.title{font-size:23px;fill:#EEF4FB;font-weight:600}.body{font-size:14px;fill:#C5CCD6}.small{font-size:12px;fill:#7C8796}.label{font-size:14px;fill:#EEF4FB}.accent{font-size:13px;fill:#38D6F2}.warning{font-size:13px;fill:#EDB966}</style>
<rect x="0" y="0" width="1280" height="850" rx="0" fill="#06080B" stroke="#06080B"/>
<text x="26" y="30" class="small">UI-SYS-SET-01 · 开发前界面设计 · 准备向导</text>
<text x="26" y="65" class="title">首次准备</text>
<rect x="12" y="86" width="108" height="712" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="142" y="109" class="small">系统管理 → 安装与配置 → 首次准备</text>
<text x="32" y="125" class="body">数据</text>
<text x="32" y="170" class="body">情报</text>
<text x="32" y="215" class="body">分析</text>
<text x="32" y="260" class="body">策略</text>
<text x="32" y="305" class="body">回测</text>
<text x="32" y="350" class="body">评估</text>
<text x="32" y="395" class="body">实盘</text>
<rect x="22" y="745" width="88" height="35" rx="3" fill="#11161D" stroke="#38D6F2"/>
<text x="31" y="768" class="accent">系统管理</text>
<text x="142" y="140" class="body">安装与配置     /     任务与节点     /     资料与诊断</text>
<rect x="140" y="165" width="290" height="610" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="156" y="194" class="accent">用户输入 · 控件</text>
<rect x="450" y="165" width="480" height="610" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="466" y="194" class="accent">只读信息 · 不可编辑</text>
<rect x="950" y="165" width="300" height="610" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="966" y="194" class="accent">按钮与前提</text>
<text x="156" y="224" class="label">工作资料目录 *</text>
<rect x="156" y="234" width="258" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="165" y="255" class="small">请选择本地目录</text>
<text x="156" y="291" class="label">使用意图</text>
<rect x="156" y="301" width="258" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="165" y="322" class="small">研究 / 交易，可稍后选择</text>
<text x="156" y="358" class="label">运行位置</text>
<rect x="156" y="368" width="258" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="165" y="389" class="small">本机</text>
<text x="468" y="231" class="label">设备与安装产物</text>
<text x="468" y="259" class="body">平台、架构、身份、核对结果</text>
<line x1="468" y1="276" x2="912" y2="276" stroke="#1A212B"/>
<text x="468" y="316" class="label">目录检查</text>
<text x="468" y="344" class="body">可写性、已有资料、可用空间</text>
<line x1="468" y1="361" x2="912" y2="361" stroke="#1A212B"/>
<text x="468" y="401" class="label">研究准备</text>
<text x="468" y="429" class="body">来源访问与数据条件</text>
<line x1="468" y1="446" x2="912" y2="446" stroke="#1A212B"/>
<text x="468" y="486" class="label">交易准备</text>
<text x="468" y="514" class="body">账户、风险、授权分别显示</text>
<line x1="468" y1="531" x2="912" y2="531" stroke="#1A212B"/>
<text x="468" y="606" class="small">缺失显示“—”与原因；状态附来源和时间。</text>
<rect x="966" y="217" width="268" height="34" rx="3" fill="#11161D" stroke="#38D6F2"/>
<text x="978" y="240" class="accent">重新检查</text>
<rect x="966" y="265" width="268" height="34" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="978" y="288" class="body">保存准备选择</text>
<rect x="966" y="313" width="268" height="34" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="978" y="336" class="body">补齐所选条件</text>
<rect x="966" y="361" width="268" height="34" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="978" y="384" class="body">进入数据工作区</text>
<text x="966" y="445" class="label">状态与行为约束</text>
<text x="966" y="479" class="warning">目录改变 → 原检查失效</text>
<text x="966" y="516" class="warning">缺交易授权 → 保留缺项</text>
<text x="966" y="553" class="warning">离开普通草稿 → 明确选择</text>
<text x="966" y="605" class="small">启用条件见对应UI按钮表。</text>
<text x="966" y="628" class="small">不满足条件时保留阻断原因。</text>
<text x="28" y="825" class="small">布局说明：输入框、只读信息和按钮分别呈现；完整字段、条件、取消及返回规则见对应UI规格。</text>
</svg>