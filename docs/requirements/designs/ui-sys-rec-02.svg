<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-label="UI-SYS-REC-02 事件与诊断目标界面">
<style>text{font-family:system-ui,sans-serif}.title{font-size:23px;fill:#EEF4FB;font-weight:600}.body{font-size:14px;fill:#C5CCD6}.small{font-size:12px;fill:#7C8796}.label{font-size:14px;fill:#EEF4FB}.accent{font-size:13px;fill:#38D6F2}.warning{font-size:13px;fill:#EDB966}</style>
<rect x="0" y="0" width="1280" height="850" rx="0" fill="#06080B" stroke="#06080B"/>
<text x="26" y="30" class="small">UI-SYS-REC-02 · 开发前界面设计 · 诊断抽屉</text>
<text x="26" y="65" class="title">事件与诊断</text>
<rect x="12" y="86" width="108" height="712" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="142" y="109" class="small">系统管理 → 资料与诊断 → 事件与诊断</text>
<text x="32" y="125" class="body">数据</text>
<text x="32" y="170" class="body">情报</text>
<text x="32" y="215" class="body">分析</text>
<text x="32" y="260" class="body">策略</text>
<text x="32" y="305" class="body">回测</text>
<text x="32" y="350" class="body">评估</text>
<text x="32" y="395" class="body">实盘</text>
<rect x="22" y="745" width="88" height="35" rx="3" fill="#11161D" stroke="#38D6F2"/>
<text x="31" y="768" class="accent">系统管理</text>
<rect x="140" y="125" width="1110" height="95" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="160" y="155" class="label">原业务工作区保持对象与返回位置</text>
<text x="160" y="185" class="small">展开或关闭抽屉只改变展示，不启动、取消或重试原业务。</text>
<rect x="140" y="245" width="290" height="530" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="156" y="274" class="accent">用户输入 · 控件</text>
<rect x="450" y="245" width="480" height="530" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="466" y="274" class="accent">只读信息 · 不可编辑</text>
<rect x="950" y="245" width="300" height="530" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="966" y="274" class="accent">按钮与前提</text>
<text x="156" y="304" class="label">来源 / 类别 / 级别</text>
<rect x="156" y="314" width="258" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="165" y="335" class="small">全部可读范围</text>
<text x="156" y="371" class="label">对象 / 请求 / 任务</text>
<rect x="156" y="381" width="258" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="165" y="402" class="small">调用上下文或明确身份</text>
<text x="156" y="438" class="label">时间范围 / 时区 *</text>
<rect x="156" y="448" width="258" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="165" y="469" class="small">最近一日</text>
<text x="156" y="505" class="label">关键字</text>
<rect x="156" y="515" width="258" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="165" y="536" class="small">0—200字符</text>
<text x="156" y="572" class="label">诊断留存 *</text>
<rect x="156" y="582" width="258" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="165" y="603" class="small">30天 / 1024MiB，先到为准</text>
<text x="468" y="311" class="label">事件列表</text>
<text x="468" y="339" class="body">来源、对象、动作、结果</text>
<line x1="468" y1="356" x2="912" y2="356" stroke="#1A212B"/>
<text x="468" y="396" class="label">时间与关联</text>
<text x="468" y="424" class="body">发生/接收时点、原请求身份</text>
<line x1="468" y1="441" x2="912" y2="441" stroke="#1A212B"/>
<text x="468" y="481" class="label">覆盖范围</text>
<text x="468" y="509" class="body">截断、过期与不可达分别说明</text>
<line x1="468" y1="526" x2="912" y2="526" stroke="#1A212B"/>
<text x="468" y="566" class="label">留存影响</text>
<text x="468" y="594" class="body">可清诊断与保护排除项</text>
<line x1="468" y1="611" x2="912" y2="611" stroke="#1A212B"/>
<text x="468" y="686" class="small">缺失显示“—”与原因；状态附来源和时间。</text>
<rect x="966" y="297" width="268" height="34" rx="3" fill="#11161D" stroke="#38D6F2"/>
<text x="978" y="320" class="accent">查询事件</text>
<rect x="966" y="345" width="268" height="34" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="978" y="368" class="body">查看关联业务</text>
<rect x="966" y="393" width="268" height="34" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="978" y="416" class="body">预览清理范围</text>
<rect x="966" y="441" width="268" height="34" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="978" y="464" class="body">导出诊断</text>
<text x="966" y="525" class="label">状态与行为约束</text>
<text x="966" y="559" class="warning">业务记录与诊断分开</text>
<text x="966" y="596" class="warning">清理不删账本或关键审计</text>
<text x="966" y="633" class="warning">待核实不自动重试业务</text>
<text x="966" y="685" class="small">启用条件见对应UI按钮表。</text>
<text x="966" y="708" class="small">不满足条件时保留阻断原因。</text>
<text x="28" y="825" class="small">布局说明：输入框、只读信息和按钮分别呈现；完整字段、条件、取消及返回规则见对应UI规格。</text>
</svg>