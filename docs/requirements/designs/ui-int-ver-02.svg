<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-label="UI-INT-VER-02 证据核验与发布目标布局"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:16px;fill:#c5ccd6}.strong{fill:#eef4fb;font-weight:600}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}</style><rect width="1280" height="850" fill="#06080b" /><text x="24" y="30" class="accent">UI-INT-VER-02 · 产品界面设计</text><text x="24" y="66" class="title">证据核验与发布</text><text x="24" y="842" class="muted">字段值均为虚构示例；空值、阻断与控件类型用于说明交互，完整规则见同编号界面规格。</text><rect x="24" y="88" width="92" height="710" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="54" y="132" class="">数据</text><rect x="30" y="151" width="80" height="36" rx="2" fill="#0b171f" stroke="#246373" /><text x="54" y="176" class="accent">情报</text><text x="54" y="220" class="">分析</text><text x="54" y="264" class="">策略</text><text x="54" y="308" class="">回测</text><text x="54" y="352" class="">评估</text><text x="54" y="396" class="">实盘</text><text x="37" y="743" class="muted">系统管理</text><text x="138" y="111" class="muted">情报 → 情报核验 → 证据核验与发布</text><rect x="138" y="133" width="1118" height="53" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154.0" y="155" class="">信息提取</text><text x="526.6666666666667" y="155" class="accent">情报核验</text><path d="M526.6666666666667 160 H590.6666666666667" stroke="#38d6f2" stroke-width="2" /><text x="899.3333333333334" y="155" class="">事件服务</text><text x="154" y="179" class="muted">虚构示例 · 事件 E1 · 两来源冲突 · 发布受阻</text><rect x="138" y="799" width="1118" height="24" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="150" y="816" class="muted">任务  ·  通知  ·  连接状态</text><text x="835" y="816" class="muted" style="font-size:13px">状态以实际结果显示；点击返回所属对象</text><g id="business-detail"><rect x="138" y="204" width="431" height="330" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154" y="234" class="strong" style="font-size:16px">原始出处与支持证据</text><path d="M138 249 H569" stroke="#1a212b" /><text x="154" y="278" class="muted" style="font-size:13px">来源 A（只读）</text><text x="154" y="302" class="" style="font-size:14px">计划减产 30,000 吨 · 原件 M1</text><text x="154" y="350" class="muted" style="font-size:13px">转载 B（只读）</text><text x="154" y="374" class="" style="font-size:14px">转载 A；不增加独立证据数</text><text x="154" y="422" class="muted" style="font-size:13px">发布状态</text><text x="154" y="446" class="" style="font-size:14px">候选待核验 · 未进入正式消费</text><text x="154" y="498" class="muted" style="font-size:13px">原件与转载关系均保留</text><rect x="585" y="204" width="431" height="330" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="601" y="234" class="strong" style="font-size:16px">冲突核对与意见</text><path d="M585 249 H1016" stroke="#1a212b" /><text x="601" y="278" class="muted" style="font-size:13px">来源 C（只读）</text><text x="601" y="302" class="" style="font-size:14px">20,000 吨；没有明确更正关系</text><text x="601" y="350" class="muted" style="font-size:13px">核验结论（枚举）</text><rect x="601" y="359" width="399" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="613" y="381" class="" style="font-size:14px">待补证  ▾</text><text x="601" y="414" class="muted" style="font-size:13px">理由 / 证据位置（必填）</text><rect x="601" y="423" width="399" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="613" y="445" class="" style="font-size:14px">数量冲突；需查原公告或更正说明</text><text x="601" y="494" class="muted" style="font-size:13px">不能取平均值 25,000 吨作为事实</text><rect x="1032" y="204" width="224" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="1048" y="234" class="strong" style="font-size:16px">发布检查（只读）</text><path d="M1032 249 H1256" stroke="#1a212b" /><text x="1048" y="278" class="" style="font-size:14px">实体：已确认</text><text x="1048" y="318" class="" style="font-size:14px">时间：有依据</text><text x="1048" y="358" class="" style="font-size:14px">关键数值：冲突</text><text x="1048" y="398" class="" style="font-size:14px">独立出处：2 个</text><text x="1048" y="438" class="" style="font-size:14px">发布条件：不通过</text><text x="1048" y="534" class="muted" style="font-size:13px">LLM 自由文本须人工核验</text><text x="1048" y="570" class="muted" style="font-size:13px">保存意见不等于发布</text><text x="1048" y="606" class="muted" style="font-size:13px">更正 / 撤回产生后继变化</text><rect x="138" y="550" width="878" height="164" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154" y="580" class="strong" style="font-size:16px">核验记录与影响（只读）</text><path d="M138 595 H1016" stroke="#1a212b" /><text x="154" y="618" class="" style="font-size:14px">保留 A 与 C 两条陈述，不覆盖原值或伪造一致</text><text x="154" y="646" class="" style="font-size:14px">意见保存后记录操作者与实际时间；补证后重新检查</text><text x="154" y="674" class="" style="font-size:14px">发布成功还须持久保存确认；失败保持已核验待发布</text><rect x="154" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="166" y="766" class="accent" style="font-size:14px">保存意见</text><rect x="288" y="743" width="120" height="34" rx="2" fill="#101318" stroke="#333a45" /><text x="300" y="766" class="muted" style="font-size:14px">审阅发布</text><rect x="422" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="434" y="766" class="accent" style="font-size:14px">查看原件</text><text x="574" y="765" class="muted" style="font-size:13px">关键数值冲突，不能发布</text></g></svg>
