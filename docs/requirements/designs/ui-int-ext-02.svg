<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-label="UI-INT-EXT-02 处理方案与质量评测目标布局"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:16px;fill:#c5ccd6}.strong{fill:#eef4fb;font-weight:600}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}</style><rect width="1280" height="850" fill="#06080b" /><text x="24" y="30" class="accent">UI-INT-EXT-02 · 产品界面设计</text><text x="24" y="66" class="title">处理方案与质量评测</text><text x="24" y="842" class="muted">字段值均为虚构示例；空值、阻断与控件类型用于说明交互，完整规则见同编号界面规格。</text><rect x="24" y="88" width="92" height="710" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="54" y="132" class="">数据</text><rect x="30" y="151" width="80" height="36" rx="2" fill="#0b171f" stroke="#246373" /><text x="54" y="176" class="accent">情报</text><text x="54" y="220" class="">分析</text><text x="54" y="264" class="">策略</text><text x="54" y="308" class="">回测</text><text x="54" y="352" class="">评估</text><text x="54" y="396" class="">实盘</text><text x="37" y="743" class="muted">系统管理</text><text x="138" y="111" class="muted">情报 → 信息提取 → 处理方案与质量评测</text><rect x="138" y="133" width="1118" height="53" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154.0" y="155" class="accent">信息提取</text><path d="M154.0 160 H218.0" stroke="#38d6f2" stroke-width="2" /><text x="526.6666666666667" y="155" class="">情报核验</text><text x="899.3333333333334" y="155" class="">事件服务</text><text x="154" y="179" class="muted">虚构示例 · 方案 P1 · 独立评测前检查 · 集合泄漏受阻</text><rect x="138" y="799" width="1118" height="24" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="150" y="816" class="muted">任务  ·  通知  ·  连接状态</text><text x="835" y="816" class="muted" style="font-size:13px">状态以实际结果显示；点击返回所属对象</text><g id="business-detail"><rect x="138" y="204" width="256" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154" y="234" class="strong" style="font-size:16px">方案与评测配置</text><path d="M138 249 H394" stroke="#1a212b" /><text x="154" y="270" class="muted" style="font-size:13px">固定方案（选择器）</text><rect x="154" y="279" width="224" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="166" y="301" class="" style="font-size:14px">P1 / 模型 M1  ▾</text><text x="154" y="334" class="muted" style="font-size:13px">提示与结构（固定身份）</text><rect x="154" y="343" width="224" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="166" y="365" class="" style="font-size:14px">提示 T1 / 结构 E1</text><text x="154" y="398" class="muted" style="font-size:13px">处理预算（十进制 · 元）</text><rect x="154" y="407" width="224" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="166" y="429" class="" style="font-size:14px">20.00 CNY</text><text x="154" y="462" class="muted" style="font-size:13px">样本集合（选择器）</text><rect x="154" y="471" width="224" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="166" y="493" class="" style="font-size:14px">开发 D1 / 评测 H1</text><text x="154" y="526" class="muted" style="font-size:13px">门槛配置（必填）</text><rect x="154" y="535" width="224" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="166" y="557" class="" style="font-size:14px">按来源 / 类型设置…</text><text x="154" y="620" class="muted" style="font-size:13px">变更方法生成新方案</text><text x="154" y="650" class="muted" style="font-size:13px">先固定规则，再运行评测</text><rect x="410" y="204" width="566" height="300" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="426" y="234" class="strong" style="font-size:16px">独立性检查（只读）</text><path d="M410 249 H976" stroke="#1a212b" /><text x="426" y="278" class="" style="font-size:14px">开发 D1：事件族 F1 / F2</text><text x="426" y="314" class="" style="font-size:14px">评测 H1：事件族 F2 / F3</text><text x="426" y="350" class="" style="font-size:14px">阻断：同一事件 F2 的原文与转载跨集合</text><text x="426" y="386" class="" style="font-size:14px">处理：重新分组并固定 H2 后再评测</text><text x="426" y="422" class="" style="font-size:14px">后续时间段：按真实时间顺序单独留出</text><text x="426" y="478" class="muted" style="font-size:13px">未运行：不生成准确率、召回率或质量通过结论</text><rect x="992" y="204" width="264" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="1008" y="234" class="strong" style="font-size:16px">标注与使用记录</text><path d="M992 249 H1256" stroke="#1a212b" /><text x="1008" y="278" class="muted" style="font-size:13px">标注争议</text><text x="1008" y="302" class="" style="font-size:14px">保留原意见与裁定理由</text><text x="1008" y="350" class="muted" style="font-size:13px">样本充分性</text><text x="1008" y="374" class="" style="font-size:14px">按类型 / 来源显示分母</text><text x="1008" y="422" class="muted" style="font-size:13px">调优使用记录</text><text x="1008" y="446" class="" style="font-size:14px">用于调优后不再独立</text><text x="1008" y="494" class="muted" style="font-size:13px">结果解释</text><text x="1008" y="518" class="" style="font-size:14px">关键字段全对单独报告</text><text x="1008" y="578" class="muted" style="font-size:13px">模型置信度不等于事实概率</text><text x="1008" y="610" class="muted" style="font-size:13px">成本与实际延迟同时记录</text><rect x="410" y="520" width="566" height="194" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="426" y="550" class="strong" style="font-size:16px">评测输出字段（尚未产生结果）</text><path d="M410 565 H976" stroke="#1a212b" /><text x="426" y="582" class="" style="font-size:14px">事件族数 / 样本数 / 精确率 / 召回率</text><text x="426" y="612" class="" style="font-size:14px">关键字段全对 / 证据支持 / 拒答 / 无依据输出</text><text x="426" y="642" class="" style="font-size:14px">标注争议 / 分层不足 / 模型成本 / 实际耗时</text><text x="426" y="672" class="" style="font-size:14px">样本不足仅报告观察结果，不判定通过</text><rect x="426" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="438" y="766" class="accent" style="font-size:14px">试运行</text><rect x="560" y="743" width="120" height="34" rx="2" fill="#101318" stroke="#333a45" /><text x="572" y="766" class="muted" style="font-size:14px">独立评测</text><text x="706" y="765" class="muted" style="font-size:13px">事件族重叠，需重新分组</text></g></svg>
