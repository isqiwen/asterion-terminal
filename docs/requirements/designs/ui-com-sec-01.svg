<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-label="UI-COM-SEC-01 凭据与访问用途目标界面">
<style>text{font-family:system-ui,sans-serif}.title{font-size:23px;fill:#EEF4FB;font-weight:600}.body{font-size:14px;fill:#C5CCD6}.small{font-size:12px;fill:#7C8796}.label{font-size:14px;fill:#EEF4FB}.accent{font-size:13px;fill:#38D6F2}.warning{font-size:13px;fill:#EDB966}</style>
<rect x="0" y="0" width="1280" height="850" rx="0" fill="#06080B" stroke="#06080B"/>
<text x="26" y="30" class="small">UI-COM-SEC-01 · 开发前界面设计 · 本地上下文对话框</text>
<text x="26" y="65" class="title">凭据与访问用途</text>
<text x="30" y="105" class="body">用途和返回位置由调用页面保留；不重复主窗口导航。</text>
<rect x="30" y="155" width="310" height="610" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="46" y="184" class="accent">用户输入 · 控件</text>
<rect x="360" y="155" width="540" height="610" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="376" y="184" class="accent">只读信息 · 不可编辑</text>
<rect x="920" y="155" width="330" height="610" rx="3" fill="#0B0E13" stroke="#2A3543"/>
<text x="936" y="184" class="accent">按钮与前提</text>
<text x="46" y="214" class="label">用途所需秘密 *</text>
<rect x="46" y="224" width="278" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="55" y="245" class="small">本地遮罩输入，初始为空</text>
<text x="46" y="281" class="label">使用已保存行情项</text>
<rect x="46" y="291" width="278" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="55" y="312" class="small">默认不选，仅同一用途</text>
<text x="46" y="348" class="label">保存行情密码/授权码</text>
<rect x="46" y="358" width="278" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="55" y="379" class="small">默认不勾选，仅允许类别</text>
<text x="46" y="415" class="label">临时显示输入</text>
<rect x="46" y="425" width="278" height="31" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="55" y="446" class="small">按住显示，松开遮罩</text>
<text x="378" y="221" class="label">调用上下文</text>
<text x="378" y="249" class="body">服务、账户/来源、用途、位置</text>
<line x1="378" y1="266" x2="882" y2="266" stroke="#1A212B"/>
<text x="378" y="306" class="label">安全存储</text>
<text x="378" y="334" class="body">Keychain / Secret Service</text>
<line x1="378" y1="351" x2="882" y2="351" stroke="#1A212B"/>
<text x="378" y="391" class="label">非秘密保存引用</text>
<text x="378" y="419" class="body">类别、用途、可用状态</text>
<line x1="378" y1="436" x2="882" y2="436" stroke="#1A212B"/>
<text x="378" y="476" class="label">用途验证结果</text>
<text x="378" y="504" class="body">结果、时间与访问限制</text>
<line x1="378" y1="521" x2="882" y2="521" stroke="#1A212B"/>
<text x="378" y="596" class="small">缺失显示“—”与原因；状态附来源和时间。</text>
<rect x="936" y="207" width="298" height="34" rx="3" fill="#11161D" stroke="#38D6F2"/>
<text x="948" y="230" class="accent">验证此用途</text>
<rect x="936" y="255" width="298" height="34" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="948" y="278" class="body">保存允许的行情项</text>
<rect x="936" y="303" width="298" height="34" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="948" y="326" class="body">移除本地保存项</text>
<rect x="936" y="351" width="298" height="34" rx="3" fill="#11161D" stroke="#2A3543"/>
<text x="948" y="374" class="body">取消并清空输入</text>
<text x="936" y="435" class="label">状态与行为约束</text>
<text x="936" y="469" class="warning">秘密不进入普通草稿</text>
<text x="936" y="506" class="warning">交易秘密不持久保存</text>
<text x="936" y="543" class="warning">行情验证不等于交易授权</text>
<text x="936" y="595" class="small">启用条件见对应UI按钮表。</text>
<text x="936" y="618" class="small">不满足条件时保留阻断原因。</text>
<text x="28" y="825" class="small">布局说明：输入框、只读信息和按钮分别呈现；完整字段、条件、取消及返回规则见对应UI规格。</text>
</svg>