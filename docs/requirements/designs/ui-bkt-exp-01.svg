<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-label="UI-BKT-EXP-01 回测方案与验证计划 交互规格">
<style>text{font-family:"Noto Sans SC","PingFang SC",sans-serif}.body{font-size:16px;fill:#d6e0e8}.muted{font-size:14px;fill:#a8b5c1}.small{font-size:13px;fill:#a8b5c1}.title{font-size:26px;font-weight:600;fill:#f2f7fb}.head{font-size:18px;font-weight:600;fill:#f2f7fb}.accent{font-size:16px;fill:#6ee0ec}.warn{font-size:16px;fill:#f7ce82}.disabled{font-size:16px;fill:#80909f}</style>
<rect x="0" y="0" width="1440" height="980" rx="0" fill="#081017" stroke="#081017"/>
<text x="28" y="34" class="accent">UI-BKT-EXP-01 · 开发前界面规格</text>
<text x="28" y="73" class="title">回测方案与验证计划</text>
<text x="28" y="953" class="small">交互规格图 · 图中数值为说明规则的示例；字段与动作以页面需求为准。</text>
<rect x="24" y="100" width="92" height="817" rx="8" fill="#101820" stroke="#31414e"/>
<text x="50" y="152" class="body">数据</text>
<text x="50" y="208" class="body">情报</text>
<text x="50" y="264" class="body">分析</text>
<text x="50" y="320" class="body">策略</text>
<rect x="30" y="348" width="80" height="42" rx="4" fill="#153039" stroke="#377884"/>
<text x="50" y="376" class="accent">回测</text>
<text x="50" y="432" class="body">评估</text>
<text x="50" y="488" class="body">实盘</text>
<text x="34" y="879" class="small">系统管理</text>
<text x="142" y="125" class="muted">回测  /  实验管理  /  回测方案与验证计划</text>
<rect x="138" y="145" width="1278" height="60" rx="8" fill="#101820" stroke="#31414e"/>
<text x="158" y="170" class="accent">实验管理</text>
<text x="158" y="193" class="small">对象身份与来源固定显示 · 保存、检查、提交分别操作</text>
<rect x="138" y="222" width="180" height="558" rx="8" fill="#101820" stroke="#31414e"/>
<text x="156" y="254" class="head">页面导航</text>
<rect x="150" y="276" width="156" height="43" rx="4" fill="#153039" stroke="#377884"/>
<text x="162" y="303" class="accent">1 输入与区间</text>
<text x="162" y="369" class="body">2 模拟条件</text>
<text x="162" y="435" class="body">3 验证计划</text>
<text x="162" y="501" class="body">4 提交审阅</text>
<rect x="334" y="222" width="742" height="558" rx="8" fill="#101820" stroke="#31414e"/>
<text x="353" y="254" class="head">模拟条件 · 显式配置</text>
<text x="354" y="286" class="muted">字段</text>
<text x="548" y="286" class="muted">值 / 选择</text>
<text x="828" y="286" class="muted">约束 / 解释</text>
<path d="M350 346 H1060" stroke="#24333f"/>
<text x="354" y="328" class="body">固定策略 / 数据</text>
<text x="548" y="328" class="accent">包 A / 快照 D（示例）</text>
<text x="828" y="328" class="small">固定身份</text>
<path d="M350 395 H1060" stroke="#24333f"/>
<text x="354" y="377" class="body">周期 / 初始仓位</text>
<text x="548" y="377" class="accent">1分钟 / 空仓</text>
<text x="828" y="377" class="small">与策略声明一致</text>
<path d="M350 444 H1060" stroke="#24333f"/>
<text x="354" y="426" class="body">初始资金</text>
<text x="548" y="426" class="accent">待填写 元</text>
<text x="828" y="426" class="small">正Decimal，币种人民币</text>
<path d="M350 493 H1060" stroke="#24333f"/>
<text x="354" y="475" class="body">成交估价</text>
<text x="548" y="475" class="accent">后续bar开盘</text>
<text x="828" y="475" class="small">回报在bar完成后可见</text>
<path d="M350 542 H1060" stroke="#24333f"/>
<text x="354" y="524" class="body">参与率 ρ</text>
<text x="548" y="524" class="accent">待填写 %</text>
<text x="828" y="524" class="small">0 &lt; ρ ≤ 100%</text>
<path d="M350 591 H1060" stroke="#24333f"/>
<text x="354" y="573" class="body">固定滑点</text>
<text x="548" y="573" class="accent">待填写 跳</text>
<text x="828" y="573" class="small">明确填0才为零</text>
<path d="M350 640 H1060" stroke="#24333f"/>
<text x="354" y="622" class="body">费用 / 保证金规则</text>
<text x="548" y="622" class="accent">待选择固定引用</text>
<text x="828" y="622" class="small">覆盖历史生效区间</text>
<path d="M350 689 H1060" stroke="#24333f"/>
<text x="354" y="671" class="body">必要风险上限</text>
<text x="548" y="671" class="accent">待填写</text>
<text x="828" y="671" class="small">数量、敞口、保证金</text>
<path d="M350 738 H1060" stroke="#24333f"/>
<text x="354" y="720" class="body">最终留出 / 隔离</text>
<text x="548" y="720" class="accent">待填写</text>
<text x="828" y="720" class="small">事前固定与标签边界</text>
<rect x="1092" y="222" width="324" height="558" rx="8" fill="#101820" stroke="#31414e"/>
<text x="1110" y="254" class="head">两bar时序</text>
<text x="1112" y="306" class="body">A结束 → 决策并接单</text>
<path d="M1109 323 H1399" stroke="#24333f"/>
<text x="1112" y="362" class="body">B开盘 → 价格归属</text>
<path d="M1109 379 H1399" stroke="#24333f"/>
<text x="1112" y="418" class="body">B期间 → 容量未知</text>
<path d="M1109 435 H1399" stroke="#24333f"/>
<text x="1112" y="474" class="body">B结束 → 核定容量</text>
<path d="M1109 491 H1399" stroke="#24333f"/>
<text x="1112" y="530" class="body">先回报成交和账户</text>
<path d="M1109 547 H1399" stroke="#24333f"/>
<text x="1112" y="586" class="body">再基于B进行决策</text>
<path d="M1109 603 H1399" stroke="#24333f"/>
<text x="1112" y="718" class="small">只读事实与可编辑草稿分区</text>
<text x="1112" y="746" class="small">离开后按对象身份恢复上下文</text>
<rect x="138" y="797" width="1278" height="53" rx="8" fill="#29251b" stroke="#665b3c"/>
<text x="155" y="828" class="warn">条件未齐  ·  费用、风险与容量缺项时禁止提交</text>
<rect x="334" y="870" width="174" height="44" rx="5" fill="#153039" stroke="#377884"/>
<text x="352" y="899" class="accent">保存草稿</text>
<rect x="522" y="870" width="174" height="44" rx="5" fill="#153039" stroke="#377884"/>
<text x="540" y="899" class="accent">预览时序</text>
<rect x="710" y="870" width="174" height="44" rx="5" fill="#153039" stroke="#377884"/>
<text x="728" y="899" class="accent">检查条件</text>
<rect x="898" y="870" width="174" height="44" rx="5" fill="#17212a" stroke="#3c4854"/>
<text x="916" y="899" class="disabled">确认回测</text>
<text x="138" y="899" class="muted">任务与通知</text>
</svg>