<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="实盘 / 账户 A / 原请求核对"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#c5ccd6;font-size:18px}.muted{fill:#7c8796;font-size:16px}.accent{fill:#38d6f2}.title{font-size:26px;font-weight:600}</style><rect width="1280" height="800" fill="#06080b" /><text x="28" y="39" class="accent">ASTERION  /  目标交互设计 · 虚构案例 · 未实现</text><text x="28" y="77" class="title">实盘 / 账户 A / 原请求核对</text><text x="28" y="107" class="muted">UI-LIV-EXE-03 · 目标故障状态示例</text><rect x="28" y="131" width="160" height="610" fill="#0b0e13" stroke="#2a3543" /><text x="48" y="706" class="muted">系统管理</text><rect x="210" y="131" width="1040" height="62" fill="#0b0e13" stroke="#2a3543" /><text x="232" y="169" class="accent">账户受限    ·    自动重发 0    ·    不宣称已经无风险</text><rect x="210" y="214" width="1040" height="72" fill="#0b0e13" stroke="#2a3543" /><text x="231" y="242" class="muted">请求 / 意图</text><text x="468" y="243" class="">请求 Q1    /    买开 1 手</text><text x="468" y="269" class="muted">可靠意图记录已保存；外部发送后的确认保存失败</text><rect x="210" y="300" width="1040" height="72" fill="#0b0e13" stroke="#2a3543" /><text x="231" y="328" class="muted">已知 / 未知</text><text x="468" y="329" class="">可能已受理    /    待核对</text><text x="468" y="355" class="muted">未知不是拒单，也不是无订单；保留潜在 1 手占用</text><rect x="210" y="386" width="1040" height="72" fill="#0b0e13" stroke="#2a3543" /><text x="231" y="414" class="muted">账户执行归属</text><text x="468" y="415" class="">节点 N1    /    不能确认已停止</text><text x="468" y="441" class="muted">节点 N2 只读观察；不能因 N1 失联直接接管</text><rect x="210" y="472" width="1040" height="72" fill="#0b0e13" stroke="#2a3543" /><text x="231" y="500" class="muted">当前限制</text><text x="468" y="501" class="">必要记录不可写    /    新交易命令受阻</text><text x="468" y="527" class="muted">撤单和平仓也不能走无记录旁路；可安全查询仍保留</text><rect x="210" y="558" width="1040" height="72" fill="#0b0e13" stroke="#2a3543" /><text x="231" y="586" class="muted">主要操作</text><text x="468" y="587" class="">[查询原请求]     [查看账户]     [查看恢复条件]</text><text x="468" y="613" class="muted">先恢复可靠记录并核对事实；没有默认重发按钮</text><text x="228" y="754" class="muted">外部处置发生后必须核对；解除通知、静音或重启不能解除业务限制。</text><text x="54" y="178" class="">数据</text><text x="54" y="223" class="">情报</text><text x="54" y="268" class="">分析</text><text x="54" y="313" class="">策略</text><text x="54" y="358" class="">回测</text><text x="54" y="403" class="">评估</text><text x="54" y="448" class="accent">实盘</text></svg>