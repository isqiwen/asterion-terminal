<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-label="主界面目标导航：七个业务模块、二级子模块和系统辅助入口"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:16px;fill:#c5ccd6}.strong{fill:#eef4fb;font-weight:600}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}</style><rect x="0" y="0" width="1280" height="850" rx="2" fill="#06080b" stroke="#06080b" /><text x="24" y="30" class="accent">ASTERION TERMINAL · 主界面目标设计 · 开发前规格</text><text x="24" y="66" class="title">业务模块 → 子模块 → 对象工作区</text><rect x="24" y="88" width="92" height="710" rx="2" fill="#0b0e13" stroke="#2a3543" /><rect x="30" y="107" width="80" height="36" rx="2" fill="#0b171f" stroke="#246373" /><text x="54" y="132" class="accent">数据</text><text x="54" y="176" class="">情报</text><text x="54" y="220" class="">分析</text><text x="54" y="264" class="">策略</text><text x="54" y="308" class="">回测</text><text x="54" y="352" class="">评估</text><text x="54" y="396" class="">实盘</text><text x="37" y="743" class="muted">系统管理</text><text x="138" y="111" class="muted">数据 → 接入与采集 → 历史取数计划</text><rect x="138" y="133" width="1118" height="53" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154.0" y="155" class="accent">接入与采集</text><path d="M154.0 160 H234.0" stroke="#38d6f2" stroke-width="2" /><text x="526.6666666666667" y="155" class="">加工与质量</text><text x="899.3333333333334" y="155" class="">管理与服务</text><text x="154" y="179" class="muted">历史取数计划 / 新建草稿 · 未提交 · 示例布局</text><rect x="138" y="799" width="1118" height="24" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="150" y="816" class="muted">任务  ·  通知  ·  连接状态</text><text x="835" y="816" class="muted" style="font-size:13px">状态以实际结果显示；点击返回所属对象</text><rect x="138" y="204" width="240" height="570" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="156" y="236" class="strong">接入任务</text><text x="164" y="287" class="">数据来源与连接</text><rect x="148" y="316" width="218" height="37" rx="2" fill="#0b171f" stroke="#246373" /><text x="164" y="341" class="accent">历史取数计划</text><text x="164" y="395" class="">实时采集与留存</text><text x="156" y="534" class="muted">列表 / 详情共享对象</text><text x="156" y="562" class="muted">选择后在右侧查看</text><rect x="396" y="204" width="560" height="570" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="416" y="236" class="strong">计划范围</text><text x="416" y="272" class="muted">范围 → 覆盖与消耗预览 → 确认</text><text x="416" y="319" class="">数据来源</text><rect x="416" y="333" width="516" height="36" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="430" y="358" class="muted">请选择或填写</text><text x="416" y="411" class="">真实合约范围</text><rect x="416" y="425" width="516" height="36" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="430" y="450" class="muted">请选择或填写</text><text x="416" y="503" class="">周期与时间区间</text><rect x="416" y="517" width="516" height="36" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="430" y="542" class="muted">请选择或填写</text><text x="416" y="637" class="muted">未补齐必要条件时，确认操作不可用。</text><rect x="416" y="690" width="132" height="38" rx="2" fill="#0b171f" stroke="#246373" /><text x="431" y="716" class="accent">预览取数范围</text><rect x="974" y="204" width="282" height="570" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="994" y="236" class="strong">检查与后续去向</text><text x="994" y="287" class="">能力、权限与已存覆盖</text><text x="994" y="347" class="">费用额度及缺口</text><text x="994" y="407" class="">提交后的任务身份</text><text x="994" y="467" class="muted">结果返回本计划</text><text x="994" y="527" class="muted">固定数据 → 分析</text><text x="994" y="587" class="muted">合约资料 → 管理与服务</text><text x="24" y="842" class="muted">导航与工作区设计：字段、默认值、业务前提及返回行为见对应UI规格。</text></svg>
