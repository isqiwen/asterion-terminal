<text x="1058" y="334" fill="#adbdcb" font-size="12" font-weight="400">高亮差异及受影响结论</text>
<text x="1058" y="354" fill="#c4a982" font-size="12" font-weight="400">不能直接给统一排名。</text>
<text x="1058" y="395" fill="#73d7cc" font-size="14" font-weight="600">失败或取消尝试</text>
<text x="1058" y="417" fill="#adbdcb" font-size="12" font-weight="400">保留任务身份、阶段与覆盖</text>
<text x="1058" y="437" fill="#c4a982" font-size="12" font-weight="400">不能当零收益或删除来改善胜率。</text>
<text x="1058" y="478" fill="#73d7cc" font-size="14" font-weight="600">留出参与选择</text>
