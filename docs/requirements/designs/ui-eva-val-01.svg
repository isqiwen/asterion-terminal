<text x="1058" y="520" fill="#c4a982" font-size="12" font-weight="400">原结果可读，但不得仍声称独立最终检验。</text>
<text x="1058" y="561" fill="#73d7cc" font-size="14" font-weight="600">零支持候选</text>
<text x="1058" y="583" fill="#adbdcb" font-size="12" font-weight="400">保存不支持或证据不足</text>
<text x="1058" y="603" fill="#c4a982" font-size="12" font-weight="400">不强制挑选最佳项。</text>
<text x="1058" y="644" fill="#73d7cc" font-size="14" font-weight="600">共享账户证据不足</text>
<text x="1058" y="666" fill="#adbdcb" font-size="12" font-weight="400">显示现金、保证金或交互约束缺口</text>
<text x="1058" y="686" fill="#c4a982" font-size="12" font-weight="400">不把独立净值叠加当组合模拟。</text>
