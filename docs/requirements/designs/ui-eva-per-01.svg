<text x="1058" y="312" fill="#73d7cc" font-size="14" font-weight="600">无成交</text>
<text x="1058" y="334" fill="#adbdcb" font-size="12" font-weight="400">显示零成交与权益事实</text>
<text x="1058" y="354" fill="#c4a982" font-size="12" font-weight="400">胜率和平均单笔收益不可计算，不能填100%。</text>
<text x="1058" y="395" fill="#73d7cc" font-size="14" font-weight="600">估值不足</text>
<text x="1058" y="417" fill="#adbdcb" font-size="12" font-weight="400">列出资金流时点所缺估值</text>
<text x="1058" y="437" fill="#c4a982" font-size="12" font-weight="400">禁用精确TWR，保留金额核对并提示补充边界估值。</text>
<text x="1058" y="478" fill="#73d7cc" font-size="14" font-weight="600">权益非正或常数收益</text>
<text x="1058" y="500" fill="#adbdcb" font-size="12" font-weight="400">保留金额指标及原因</text>
<text x="1058" y="520" fill="#c4a982" font-size="12" font-weight="400">无定义的年化、Sharpe或比例不得填0。</text>
<text x="1058" y="561" fill="#73d7cc" font-size="14" font-weight="600">部分覆盖或计算失败</text>
<text x="1058" y="583" fill="#adbdcb" font-size="12" font-weight="400">标明终态和实际截止，保留已核对事实</text>
<text x="1058" y="603" fill="#c4a982" font-size="12" font-weight="400">不外推完整区间绩效。</text>
<text x="1058" y="644" fill="#73d7cc" font-size="14" font-weight="600">归因不完整</text>
<text x="1058" y="666" fill="#adbdcb" font-size="12" font-weight="400">残差保留来源和金额</text>
<text x="1058" y="686" fill="#c4a982" font-size="12" font-weight="400">不按权重强行分摊后称实际贡献。</text>
