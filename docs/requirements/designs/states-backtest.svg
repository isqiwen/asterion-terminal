<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-label="回测关键异常状态设计"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#c5ccd6;font-size:16px}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}.warn{fill:#edb966}</style><rect width="1280" height="660" fill="#06080b"/><text x="24" y="32" class="accent">回测 · 目标状态设计 · 虚构案例 · 非实际截图</text><text x="24" y="74" class="title">交易模拟 / 成交约束</text><rect x="24" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="44" y="150" class="title">1  订单生效</text><rect x="40" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="52" y="203" class="">限价单从下一可观察边界生效</text><text x="52" y="226" class="muted">同一对象与原请求上下文</text><text x="44" y="282" class="muted">当前反馈</text><text x="44" y="315" class="">保留决策时可得输入</text><text x="44" y="397" class="muted">操作边界</text><text x="44" y="430" class="muted">不能用未来高低价提前成交</text><rect x="44" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="58" y="539" class="accent">查看事件依据</text><rect x="440" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="460" y="150" class="title">2  无法成交</text><rect x="456" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="468" y="203" class="">当前 K 线成交量为 0</text><text x="468" y="226" class="muted">同一对象与原请求上下文</text><text x="460" y="282" class="muted">当前反馈</text><text x="460" y="315" class="warn">可成交数量为 0；订单仍待处理</text><text x="460" y="397" class="muted">操作边界</text><text x="460" y="430" class="muted">不编造成交，不释放仍有效订单</text><rect x="460" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="474" y="539" class="accent">查看订单明细</text><rect x="856" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="876" y="150" class="title">3  后续事件</text><rect x="872" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="884" y="203" class="">下一有效事件按容量继续判断</text><text x="884" y="226" class="muted">同一对象与原请求上下文</text><text x="876" y="282" class="muted">当前反馈</text><text x="876" y="315" class="">部分成交、到期或撤单按事实记</text><text x="876" y="397" class="muted">操作边界</text><text x="876" y="430" class="muted">最终账本与费用逐笔可核对</text><rect x="876" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="890" y="539" class="accent">查看资金核对</text><text x="24" y="620" class="muted">图示展示关键反馈和可用动作；详细字段、权限、失败及返回按各 UI 与 FR 规格验收。</text></svg>