<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<title>UI-LIV-ACC-02 成交结算核对与差异处理</title>
<desc>开发前目标界面设计，字段提示代表业务类型；案例数值单独标识且不作为默认值。</desc>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="1440" height="1000" rx="0" fill="#06080b" stroke="#06080b"/>
<rect x="0" y="0" width="166" height="1000" rx="0" fill="#0b0e13" stroke="#2a3543"/>
<text x="23" y="39" fill="#38d6f2" font-size="20" font-weight="700">ASTERION</text>
<text x="23" y="65" fill="#7c8796" font-size="12" font-weight="400">交易研究工作台</text>
<text x="32" y="118" fill="#7c8796" font-size="17" font-weight="400">数据</text>
<text x="32" y="171" fill="#7c8796" font-size="17" font-weight="400">情报</text>
<text x="32" y="224" fill="#7c8796" font-size="17" font-weight="400">分析</text>
<text x="32" y="277" fill="#7c8796" font-size="17" font-weight="400">策略</text>
<text x="32" y="330" fill="#7c8796" font-size="17" font-weight="400">回测</text>
<rect x="13" y="409" width="140" height="42" rx="6" fill="#12354b" stroke="#25708b"/>
<text x="32" y="383" fill="#7c8796" font-size="17" font-weight="400">评估</text>
<text x="32" y="436" fill="#38d6f2" font-size="17" font-weight="400">实盘</text>
<text x="31" y="961" fill="#7c8796" font-size="16" font-weight="400">系统管理</text>
<text x="194" y="39" fill="#eef4fb" font-size="24" font-weight="700">成交结算核对与差异处理</text>
<text x="194" y="66" fill="#7c8796" font-size="13" font-weight="400">UI-LIV-ACC-02 · 目标界面设计</text>
<rect x="190" y="87" width="1226" height="57" rx="8" fill="#0f2533" stroke="#275269"/>
<text x="210" y="112" fill="#bae6fd" font-size="16" font-weight="600">账户 / 环境 / 来源交易日 / 本地范围与机构资料范围</text>
<text x="210" y="134" fill="#7c8796" font-size="12" font-weight="400">账户、环境与来源时间持续可见；页面切换不产生交易动作</text>
<rect x="190" y="161" width="1226" height="375" rx="8" fill="#0b0e13" stroke="#2a3543"/>
<text x="208" y="192" fill="#eef4fb" font-size="17" font-weight="600">本地记录与外部结算逐项比较</text>
<rect x="208" y="223" width="1190" height="267" rx="4" fill="#0b1626" stroke="#2a3543"/>
<rect x="208" y="223" width="1190" height="39" rx="4" fill="#192c42" stroke="#2a3543"/>
<text x="218" y="248" fill="#7c8796" font-size="13" font-weight="600">核对项</text>
<text x="406" y="248" fill="#7c8796" font-size="13" font-weight="600">本地口径</text>
<text x="616" y="248" fill="#7c8796" font-size="13" font-weight="600">外部资料</text>
<text x="826" y="248" fill="#7c8796" font-size="13" font-weight="600">差异</text>
<text x="988" y="248" fill="#7c8796" font-size="13" font-weight="600">依据与结论</text>
<text x="218" y="291" fill="#c5ccd6" font-size="13" font-weight="400">订单/成交身份</text>
<text x="406" y="291" fill="#c5ccd6" font-size="13" font-weight="400">稳定内部关联</text>
<text x="616" y="291" fill="#c5ccd6" font-size="13" font-weight="400">柜台订单/成交</text>
<text x="826" y="291" fill="#c5ccd6" font-size="13" font-weight="400">逐项匹配</text>
<text x="988" y="291" fill="#c5ccd6" font-size="13" font-weight="400">覆盖不足保留未决</text>
<rect x="209" y="319" width="1188" height="57" rx="0" fill="#101f32" stroke="#101f32"/>
<text x="218" y="348" fill="#c5ccd6" font-size="13" font-weight="400">费用（虚构案例）</text>
<text x="406" y="348" fill="#c5ccd6" font-size="13" font-weight="400">12元估算</text>
<text x="616" y="348" fill="#c5ccd6" font-size="13" font-weight="400">14元结算</text>
<text x="826" y="348" fill="#c5ccd6" font-size="13" font-weight="400">+2元</text>
<text x="988" y="348" fill="#c5ccd6" font-size="13" font-weight="400">来源资料及修订依据</text>
<text x="218" y="405" fill="#c5ccd6" font-size="13" font-weight="400">权益（同案例）</text>
<text x="406" y="405" fill="#c5ccd6" font-size="13" font-weight="400">100148元</text>
<text x="616" y="405" fill="#c5ccd6" font-size="13" font-weight="400">100146元</text>
<text x="826" y="405" fill="#c5ccd6" font-size="13" font-weight="400">−2元</text>
<text x="988" y="405" fill="#c5ccd6" font-size="13" font-weight="400">不能直接覆盖原估算</text>
<rect x="209" y="433" width="1188" height="57" rx="0" fill="#101f32" stroke="#101f32"/>
<text x="218" y="462" fill="#c5ccd6" font-size="13" font-weight="400">日内/结算/跨日</text>
<text x="406" y="462" fill="#c5ccd6" font-size="13" font-weight="400">分列时点口径</text>
<text x="616" y="462" fill="#c5ccd6" font-size="13" font-weight="400">业务日权威范围</text>
<text x="826" y="462" fill="#c5ccd6" font-size="13" font-weight="400">按基准比较</text>
<text x="988" y="462" fill="#c5ccd6" font-size="13" font-weight="400">无资料不能标为一致</text>
<rect x="190" y="552" width="745" height="306" rx="8" fill="#0b0e13" stroke="#2a3543"/>
<text x="208" y="583" fill="#eef4fb" font-size="17" font-weight="600">差异解释与追加调整</text>
<text x="208" y="615" fill="#c5ccd6" font-size="14" font-weight="400">差异类型</text>
<text x="445" y="615" fill="#38d6f2" font-size="12" font-weight="400">编辑 / 必填</text>
<rect x="208" y="625" width="337" height="35" rx="4" fill="#11161d" stroke="#2a3543"/>
<text x="218" y="649" fill="#7c8796" font-size="13" font-weight="400">请选择依据支持的类型</text>
<text x="208" y="678" fill="#7c8796" font-size="12" font-weight="400">缺记录 / 费率 / 结算 / 时点等</text>
<text x="572" y="615" fill="#c5ccd6" font-size="14" font-weight="400">处理说明</text>
<text x="817" y="615" fill="#38d6f2" font-size="12" font-weight="400">编辑 / 必填</text>
<rect x="572" y="625" width="345" height="35" rx="4" fill="#11161d" stroke="#2a3543"/>
<text x="582" y="649" fill="#7c8796" font-size="13" font-weight="400">空，保留未决原因</text>
<text x="572" y="678" fill="#7c8796" font-size="12" font-weight="400">非秘密文本与证据引用</text>
<text x="208" y="738" fill="#7c8796" font-size="14" font-weight="400">有权威依据才追加调整；保留原始事实、来源修订与更正关系</text>
<text x="208" y="780" fill="#7c8796" font-size="14" font-weight="400">取消编辑不修改账本；相同外部成交重复载入不会翻倍</text>
<rect x="951" y="552" width="465" height="306" rx="8" fill="#0b0e13" stroke="#2a3543"/>
<text x="969" y="583" fill="#eef4fb" font-size="17" font-weight="600">核对结论与范围</text>
<rect x="969" y="612" width="429" height="86" rx="5" fill="#182435" stroke="#344155"/>
<text x="982" y="637" fill="#edb966" font-size="14" font-weight="600">结论按证据生成</text>
<text x="982" y="661" fill="#c5ccd6" font-size="13" font-weight="400">未核对 / 有差异 / 部分核对 / 已核对</text>
<text x="982" y="682" fill="#c5ccd6" font-size="13" font-weight="400">不能用人工勾选把差异改成一致</text>
<text x="969" y="760" fill="#7c8796" font-size="13" font-weight="400">导出包含账户、交易日、覆盖、来源与未决项</text>
<rect x="190" y="876" width="1226" height="99" rx="8" fill="#102538" stroke="#275269"/>
<text x="208" y="905" fill="#c5ccd6" font-size="16" font-weight="600">比较、解释、调整和结论分别保存</text>
<text x="208" y="935" fill="#7c8796" font-size="13" font-weight="400">返回保留所选差异及范围；原始来源不因处理而删除。</text>
<rect x="1280" y="920" width="116" height="39" rx="5" fill="#17283c" stroke="#40516a"/>
<text x="1293" y="945" fill="#e0f2fe" font-size="14" font-weight="400">保存核对记录</text>
<rect x="1162" y="920" width="106" height="39" rx="5" fill="#17283c" stroke="#40516a"/>
<text x="1175" y="945" fill="#e0f2fe" font-size="14" font-weight="400">开始核对</text>
<rect x="1044" y="920" width="106" height="39" rx="5" fill="#0e7490" stroke="#28829a"/>
<text x="1057" y="945" fill="#e0f2fe" font-size="14" font-weight="400">读取资料</text>
</g>
</svg>
