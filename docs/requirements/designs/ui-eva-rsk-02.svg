<text x="1058" y="312" fill="#73d7cc" font-size="14" font-weight="600">静态方法</text>
<text x="1058" y="334" fill="#adbdcb" font-size="12" font-weight="400">展示权益、保证金和缺口</text>
<text x="1058" y="354" fill="#c4a982" font-size="12" font-weight="400">延迟/容量结果不可用，不声称退出成交。</text>
<text x="1058" y="395" fill="#73d7cc" font-size="14" font-weight="600">动态进行或部分完成</text>
<text x="1058" y="417" fill="#adbdcb" font-size="12" font-weight="400">显示阶段、实际覆盖与剩余持仓</text>
<text x="1058" y="437" fill="#c4a982" font-size="12" font-weight="400">取消未完成不是压力通过。</text>
<text x="1058" y="478" fill="#73d7cc" font-size="14" font-weight="600">输入不可用</text>
<text x="1058" y="500" fill="#adbdcb" font-size="12" font-weight="400">指出合约、时点或规则缺项</text>
<text x="1058" y="520" fill="#c4a982" font-size="12" font-weight="400">受影响方法禁用，不套用其他合约规则。</text>
<text x="1058" y="561" fill="#73d7cc" font-size="14" font-weight="600">情景资金缺口</text>
<text x="1058" y="583" fill="#adbdcb" font-size="12" font-weight="400">分别展示权益、占用与不足金额</text>
<text x="1058" y="603" fill="#c4a982" font-size="12" font-weight="400">不假设资金自动补入或可即时平仓。</text>
<text x="1058" y="644" fill="#73d7cc" font-size="14" font-weight="600">动态成交受限</text>
<text x="1058" y="666" fill="#adbdcb" font-size="12" font-weight="400">展示未成交、拒绝、延后和残余仓位</text>
<text x="1058" y="686" fill="#c4a982" font-size="12" font-weight="400">不能按理想平仓价消除剩余风险。</text>
