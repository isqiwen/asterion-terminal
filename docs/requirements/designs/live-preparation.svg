<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="实盘 / 账户 A / 运行准备"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#c5ccd6;font-size:18px}.muted{fill:#7c8796;font-size:16px}.accent{fill:#38d6f2}.title{font-size:26px;font-weight:600}</style><rect width="1280" height="800" fill="#06080b" /><text x="28" y="39" class="accent">ASTERION  /  目标交互设计 · 示例数据</text><text x="28" y="77" class="title">实盘 / 账户 A / 运行准备</text><text x="28" y="107" class="muted">UI-LIV-RUN-04 · 实盘 → 准备与运行 → 实盘准备、授权与策略运行</text><rect x="28" y="131" width="160" height="610" fill="#0b0e13" stroke="#2a3543" /><text x="48" y="706" class="muted">系统管理</text><rect x="210" y="131" width="1040" height="62" fill="#0b0e13" stroke="#2a3543" /><text x="232" y="169" class="accent">状态：待输入    ·    真实委托 0    ·    柜台仿真委托 0</text><rect x="210" y="214" width="1040" height="72" fill="#0b0e13" stroke="#2a3543" /><text x="231" y="242" class="muted">模式 / 订单去向</text><text x="468" y="243" class="">本地实时模拟  ▾    /    仅内部模拟</text><text x="468" y="269" class="muted">醒目标识独立模拟身份；模式切换重新检查，不复用真实授权</text><rect x="210" y="300" width="1040" height="72" fill="#0b0e13" stroke="#2a3543" /><text x="231" y="328" class="muted">固定策略 / 证据</text><text x="468" y="329" class="">策略包 S1    /    完整策略评估 E1</text><text x="468" y="355" class="muted">修改逻辑回策略派生；因子有效性不能替代完整策略验证</text><rect x="210" y="386" width="1040" height="72" fill="#0b0e13" stroke="#2a3543" /><text x="231" y="414" class="muted">账户起点 / 规则</text><text x="468" y="415" class="">模拟资金 100000 元    /    空仓</text><text x="468" y="441" class="muted">初始资金与撮合、费用、风险须明确，实际交易资金不会变化</text><rect x="210" y="472" width="1040" height="72" fill="#0b0e13" stroke="#2a3543" /><text x="231" y="500" class="muted">行情 / 能力检查</text><text x="468" y="501" class="">来源 S  ·  权限有效  ·  等待首个有效事件</text><text x="468" y="527" class="muted">无真实行情不得生成样例报价；检查通过不等于已经运行</text><rect x="210" y="558" width="1040" height="72" fill="#0b0e13" stroke="#2a3543" /><text x="231" y="586" class="muted">主要操作</text><text x="468" y="587" class="">[检查准备]     [启动模拟：缺输入，禁用]</text><text x="468" y="613" class="muted">等待必需输入后独立启动；停止新增与撤单、平仓分别操作</text><text x="228" y="754" class="muted">只展示交互设计，不连接账户或外部服务。关闭窗口与停止实例是不同动作。</text><text x="54" y="178" class="">数据</text><text x="54" y="223" class="">情报</text><text x="54" y="268" class="">分析</text><text x="54" y="313" class="">策略</text><text x="54" y="358" class="">回测</text><text x="54" y="403" class="">评估</text><text x="54" y="448" class="accent">实盘</text></svg>
