<text x="548" y="671" class="accent">次数 / 秒待填写</text>
<text x="828" y="671" class="small">预览候选总数</text>
<path d="M350 738 H1060" stroke="#24333f"/>
<text x="354" y="720" class="body">预测映射</text>
<text x="548" y="720" class="accent">阈值 / 排名待选</text>
<text x="828" y="720" class="small">须定义无效与到期行为</text>
<rect x="1092" y="222" width="324" height="558" rx="8" fill="#101820" stroke="#31414e"/>
<text x="1110" y="254" class="head">时间边界检查</text>
<text x="1112" y="306" class="body">模型可用时间</text>
<path d="M1109 323 H1399" stroke="#24333f"/>
<text x="1112" y="362" class="body">由完整训练结果确定</text>
<path d="M1109 379 H1399" stroke="#24333f"/>
<text x="1112" y="418" class="body">晚成熟标签不入训练</text>
<path d="M1109 435 H1399" stroke="#24333f"/>
<text x="1112" y="474" class="body">各折独立拟合预处理</text>
<path d="M1109 491 H1399" stroke="#24333f"/>
<text x="1112" y="530" class="body">取消保留候选状态</text>
<path d="M1109 547 H1399" stroke="#24333f"/>
<text x="1112" y="586" class="body">产物固定后只读</text>
<path d="M1109 603 H1399" stroke="#24333f"/>
<text x="1112" y="718" class="small">只读事实与可编辑草稿分区</text>
<text x="1112" y="746" class="small">离开后按对象身份恢复上下文</text>
<rect x="138" y="797" width="1278" height="53" rx="8" fill="#29251b" stroke="#665b3c"/>
<text x="155" y="828" class="warn">缺少训练条件  ·  先填写时间划分和预算，再提交训练</text>
<rect x="334" y="870" width="174" height="44" rx="5" fill="#153039" stroke="#377884"/>
<text x="352" y="899" class="accent">保存方案</text>
<rect x="522" y="870" width="174" height="44" rx="5" fill="#153039" stroke="#377884"/>
<text x="540" y="899" class="accent">检查划分</text>
<rect x="710" y="870" width="174" height="44" rx="5" fill="#17212a" stroke="#3c4854"/>
<text x="728" y="899" class="disabled">预览训练</text>
<rect x="898" y="870" width="174" height="44" rx="5" fill="#17212a" stroke="#3c4854"/>
<text x="916" y="899" class="disabled">提交训练</text>
<text x="138" y="899" class="muted">任务与通知</text>
