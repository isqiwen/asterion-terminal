<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-label="评估关键异常状态设计"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#c5ccd6;font-size:16px}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}.warn{fill:#edb966}</style><rect width="1280" height="660" fill="#06080b"/><text x="24" y="32" class="accent">评估 · 目标状态设计 · 虚构案例 · 非实际截图</text><text x="24" y="74" class="title">绩效结果 / 不可计算</text><rect x="24" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="44" y="150" class="title">1  选择口径</text><rect x="40" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="52" y="203" class="">固定事实、期间和方法</text><text x="52" y="226" class="muted">同一对象与原请求上下文</text><text x="44" y="282" class="muted">当前反馈</text><text x="44" y="315" class="">结果引用实际模式与现金流</text><text x="44" y="397" class="muted">操作边界</text><text x="44" y="430" class="muted">基准未选，不计算超额收益</text><rect x="44" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="58" y="539" class="accent">检查计算条件</text><rect x="440" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="460" y="150" class="title">2  缺少定义</text><rect x="456" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="468" y="203" class="">波动率分母为 0</text><text x="468" y="226" class="muted">同一对象与原请求上下文</text><text x="460" y="282" class="muted">当前反馈</text><text x="460" y="315" class="warn">Sharpe：— · 不可计算</text><text x="460" y="397" class="muted">操作边界</text><text x="460" y="430" class="muted">保留权益事实；不显示 0 或无穷</text><rect x="460" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="474" y="539" class="accent">查看指标说明</text><rect x="856" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="876" y="150" class="title">3  报告限制</text><rect x="872" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="884" y="203" class="">报告列出不可计算指标及原因</text><text x="884" y="226" class="muted">同一对象与原请求上下文</text><text x="876" y="282" class="muted">当前反馈</text><text x="876" y="315" class="">结论不得宣称该指标已通过</text><text x="876" y="397" class="muted">操作边界</text><text x="876" y="430" class="muted">补齐条件后生成独立新评价</text><rect x="876" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="890" y="539" class="accent">保存带限制报告</text><text x="24" y="620" class="muted">图示展示关键反馈和可用动作；详细字段、权限、失败及返回按各 UI 与 FR 规格验收。</text></svg>