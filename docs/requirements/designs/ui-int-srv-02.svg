<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-label="UI-INT-SRV-02 情报查询与订阅目标布局"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:16px;fill:#c5ccd6}.strong{fill:#eef4fb;font-weight:600}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}</style><rect width="1280" height="850" fill="#06080b" /><text x="24" y="30" class="accent">UI-INT-SRV-02 · 产品界面设计</text><text x="24" y="66" class="title">情报查询与订阅</text><text x="24" y="842" class="muted">字段值均为虚构示例；空值、阻断与控件类型用于说明交互，完整规则见同编号界面规格。</text><rect x="24" y="88" width="92" height="710" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="54" y="132" class="">数据</text><rect x="30" y="151" width="80" height="36" rx="2" fill="#0b171f" stroke="#246373" /><text x="54" y="176" class="accent">情报</text><text x="54" y="220" class="">分析</text><text x="54" y="264" class="">策略</text><text x="54" y="308" class="">回测</text><text x="54" y="352" class="">评估</text><text x="54" y="396" class="">实盘</text><text x="37" y="743" class="muted">系统管理</text><text x="138" y="111" class="muted">情报 → 事件服务 → 情报查询与订阅</text><rect x="138" y="133" width="1118" height="53" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154.0" y="155" class="">信息提取</text><text x="526.6666666666667" y="155" class="">情报核验</text><text x="899.3333333333334" y="155" class="accent">事件服务</text><path d="M899.3333333333334 160 H963.3333333333334" stroke="#38d6f2" stroke-width="2" /><text x="154" y="179" class="muted">虚构示例 · 订阅草稿 · 查询解释待确认 · 未启用</text><rect x="138" y="799" width="1118" height="24" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="150" y="816" class="muted">任务  ·  通知  ·  连接状态</text><text x="835" y="816" class="muted" style="font-size:13px">状态以实际结果显示；点击返回所属对象</text><g id="business-detail"><rect x="138" y="204" width="226" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154" y="234" class="strong" style="font-size:16px">查询与订阅步骤</text><path d="M138 249 H364" stroke="#1a212b" /><text x="154" y="278" class="" style="font-size:14px">1  输入查询</text><text x="154" y="322" class="" style="font-size:14px">2  确认解释  ←</text><text x="154" y="366" class="" style="font-size:14px">3  核对订阅条件</text><text x="154" y="410" class="" style="font-size:14px">4  查看交付记录</text><text x="154" y="506" class="muted" style="font-size:13px">消费者（选择器）</text><text x="154" y="530" class="" style="font-size:14px">研究观察 / 策略甲</text><text x="154" y="600" class="muted" style="font-size:13px">订阅不能授予交易权限</text><rect x="380" y="204" width="572" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="396" y="234" class="strong" style="font-size:16px">条件与订阅（可编辑）</text><path d="M380 249 H952" stroke="#1a212b" /><text x="396" y="270" class="muted" style="font-size:13px">自然语言查询（可选文本）</text><rect x="396" y="279" width="540" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="408" y="301" class="" style="font-size:14px">查询示例企业 A 的供给变化</text><text x="396" y="334" class="muted" style="font-size:13px">解释后的条件（确认后执行）</text><rect x="396" y="343" width="540" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="408" y="365" class="" style="font-size:14px">主体 = 企业 A；类型 = 供给；状态 = 已发布</text><text x="396" y="398" class="muted" style="font-size:13px">模式 / 用途（枚举 · 必填）</text><rect x="396" y="407" width="540" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="408" y="429" class="" style="font-size:14px">当前事件  ▾    研究观察  ▾</text><text x="396" y="462" class="muted" style="font-size:13px">订阅名称 / 变化类型</text><rect x="396" y="471" width="540" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="408" y="493" class="" style="font-size:14px">供给跟踪    ☑ 发布  ☑ 更正  ☑ 撤回</text><text x="396" y="526" class="muted" style="font-size:13px">交付起点 / 历史补取</text><rect x="396" y="535" width="540" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="408" y="557" class="" style="font-size:14px">启用后新变化  ▾    不自动补全部历史</text><text x="396" y="590" class="muted" style="font-size:13px">消费者与提醒方式</text><rect x="396" y="599" width="540" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="408" y="621" class="" style="font-size:14px">研究观察  ▾    应用内提醒</text><text x="396" y="674" class="muted" style="font-size:13px">条件变更须重新预览；暂停只停止后续提醒</text><rect x="968" y="204" width="288" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="984" y="234" class="strong" style="font-size:16px">解释与交付状态</text><path d="M968 249 H1256" stroke="#1a212b" /><text x="984" y="278" class="muted" style="font-size:13px">查询解释</text><text x="984" y="302" class="" style="font-size:14px">待用户确认，不先执行查询</text><text x="984" y="350" class="muted" style="font-size:13px">订阅状态</text><text x="984" y="374" class="" style="font-size:14px">未启用 · 无交付游标</text><text x="984" y="422" class="muted" style="font-size:13px">重复 / 更正识别</text><text x="984" y="446" class="" style="font-size:14px">按发布变化身份去重</text><text x="984" y="494" class="muted" style="font-size:13px">中断恢复</text><text x="984" y="518" class="" style="font-size:14px">显示缺口，显式范围补取</text><text x="984" y="584" class="muted" style="font-size:13px">自然语言不执行策略或工具</text><text x="984" y="616" class="muted" style="font-size:13px">无证据回答明确说明不足</text><rect x="396" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="408" y="766" class="accent" style="font-size:14px">预览条件</text><rect x="530" y="743" width="120" height="34" rx="2" fill="#101318" stroke="#333a45" /><text x="542" y="766" class="muted" style="font-size:14px">确认订阅</text><rect x="664" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="676" y="766" class="accent" style="font-size:14px">保存草稿</text><text x="810" y="765" class="muted" style="font-size:13px">解释尚未确认</text></g></svg>
