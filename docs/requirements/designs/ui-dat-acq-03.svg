<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-label="UI-DAT-ACQ-03 实时采集与留存目标布局"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:16px;fill:#c5ccd6}.strong{fill:#eef4fb;font-weight:600}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}</style><rect width="1280" height="850" fill="#06080b" /><text x="24" y="30" class="accent">UI-DAT-ACQ-03 · 产品界面设计</text><text x="24" y="66" class="title">实时采集与留存</text><text x="24" y="842" class="muted">字段值均为虚构示例；空值、阻断与控件类型用于说明交互，完整规则见同编号界面规格。</text><rect x="24" y="88" width="92" height="710" rx="2" fill="#0b0e13" stroke="#2a3543" /><rect x="30" y="107" width="80" height="36" rx="2" fill="#0b171f" stroke="#246373" /><text x="54" y="132" class="accent">数据</text><text x="54" y="176" class="">情报</text><text x="54" y="220" class="">分析</text><text x="54" y="264" class="">策略</text><text x="54" y="308" class="">回测</text><text x="54" y="352" class="">评估</text><text x="54" y="396" class="">实盘</text><text x="37" y="743" class="muted">系统管理</text><text x="138" y="111" class="muted">数据 → 接入与采集 → 实时采集与留存</text><rect x="138" y="133" width="1118" height="53" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154.0" y="155" class="accent">接入与采集</text><path d="M154.0 160 H234.0" stroke="#38d6f2" stroke-width="2" /><text x="526.6666666666667" y="155" class="">加工与质量</text><text x="899.3333333333334" y="155" class="">管理与服务</text><text x="154" y="179" class="muted">虚构示例 · 计划 A · 行情连接恢复 · 缺口待核对</text><rect x="138" y="799" width="1118" height="24" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="150" y="816" class="muted">任务  ·  通知  ·  连接状态</text><text x="835" y="816" class="muted" style="font-size:13px">状态以实际结果显示；点击返回所属对象</text><g id="business-detail"><rect x="138" y="204" width="250" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154" y="234" class="strong" style="font-size:16px">采集计划与消费者</text><path d="M138 249 H388" stroke="#1a212b" /><text x="154" y="278" class="" style="font-size:14px">● 计划 A  ·  已启用</text><text x="154" y="312" class="" style="font-size:14px">○ 计划 B  ·  草稿</text><text x="154" y="384" class="muted" style="font-size:13px">依赖消费者</text><text x="154" y="408" class="" style="font-size:14px">行情页 / 策略甲</text><text x="154" y="466" class="muted" style="font-size:13px">停止整个计划</text><text x="154" y="490" class="" style="font-size:14px">需预览全部消费者影响</text><text x="154" y="566" class="muted" style="font-size:13px">关闭行情页仅释放该页需求</text><rect x="404" y="204" width="564" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="420" y="234" class="strong" style="font-size:16px">计划参数与观测</text><path d="M404 249 H968" stroke="#1a212b" /><text x="420" y="270" class="muted" style="font-size:13px">来源与合约（选择器）</text><rect x="420" y="279" width="532" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="432" y="301" class="" style="font-size:14px">来源 A  ▾    示例月合约 A  ☑</text><text x="420" y="334" class="muted" style="font-size:13px">数据类别 / 消费语义</text><rect x="420" y="343" width="532" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="432" y="365" class="" style="font-size:14px">最新报价  ▾    最新有效值  ▾</text><text x="420" y="398" class="muted" style="font-size:13px">有效时段 / 最大允许延迟</text><rect x="420" y="407" width="532" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="432" y="429" class="" style="font-size:14px">按已确认交易时段  ▾    5 秒（示例值）</text><text x="420" y="462" class="muted" style="font-size:13px">可选行情归档（开关 · 默认关闭）</text><rect x="420" y="471" width="532" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="432" y="493" class="" style="font-size:14px">○ 关闭    ● 开启  ·  上限 10 GiB（示例值）</text><text x="420" y="550" class="muted" style="font-size:13px">观测记录（只读）</text><text x="420" y="574" class="" style="font-size:14px">事件 T 09:34:00 / 接收 T 09:34:00.120</text><text x="420" y="620" class="muted" style="font-size:13px">保存位置 / 保留规则</text><text x="420" y="644" class="" style="font-size:14px">示例节点 · 到上限停止归档，不自动删除</text><rect x="984" y="204" width="272" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="1000" y="234" class="strong" style="font-size:16px">状态分开显示</text><path d="M984 249 H1256" stroke="#1a212b" /><text x="1000" y="278" class="muted" style="font-size:13px">接收 / 分发</text><text x="1000" y="302" class="" style="font-size:14px">已恢复 / 正常</text><text x="1000" y="350" class="muted" style="font-size:13px">未核对缺口</text><text x="1000" y="374" class="" style="font-size:14px">T 09:31 → 09:34</text><text x="1000" y="422" class="muted" style="font-size:13px">可选归档</text><text x="1000" y="446" class="" style="font-size:14px">已停止 · 达到归档上限</text><text x="1000" y="494" class="muted" style="font-size:13px">必需决策证据</text><text x="1000" y="518" class="" style="font-size:14px">独立保存正常</text><text x="1000" y="566" class="muted" style="font-size:13px">归档开关不关闭必需留证</text><text x="1000" y="604" class="muted" style="font-size:13px">若必需留证失败，交接执行方</text><text x="1000" y="630" class="muted" style="font-size:13px">限制依赖它的新增风险</text><rect x="420" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="432" y="766" class="accent" style="font-size:14px">预览影响</text><rect x="554" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="566" y="766" class="accent" style="font-size:14px">调整归档</text><rect x="688" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="700" y="766" class="accent" style="font-size:14px">补采缺口</text><rect x="822" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="834" y="766" class="accent" style="font-size:14px">停止计划</text></g></svg>
