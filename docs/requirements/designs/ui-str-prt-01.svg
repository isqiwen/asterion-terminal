<text x="548" y="720" class="accent">+16 手 / 16000 元</text>
<text x="828" y="720" class="small">向零取整</text>
<rect x="1092" y="222" width="324" height="558" rx="8" fill="#101820" stroke="#31414e"/>
<text x="1110" y="254" class="head">目标与执行分开</text>
<text x="1112" y="306" class="body">k = 20% / 25% = 0.8</text>
<path d="M1109 323 H1399" stroke="#24333f"/>
<text x="1112" y="362" class="body">T = E × b × d × k</text>
<path d="M1109 379 H1399" stroke="#24333f"/>
<text x="1112" y="418" class="body">q = trunc(T / (p × m))</text>
<path d="M1109 435 H1399" stroke="#24333f"/>
<text x="1112" y="474" class="body">实际与在途需可信</text>
<path d="M1109 491 H1399" stroke="#24333f"/>
<text x="1112" y="530" class="body">未知在途 → 不算差额</text>
<path d="M1109 547 H1399" stroke="#24333f"/>
<text x="1112" y="586" class="body">压力超限 → 保留并拒绝</text>
<path d="M1109 603 H1399" stroke="#24333f"/>
<text x="1112" y="718" class="small">只读事实与可编辑草稿分区</text>
