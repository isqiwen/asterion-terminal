" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="1000" y="234" class="strong" style="font-size:16px">出处与换算</text><path d="M984 249 H1256" stroke="#1a212b" /><text x="1000" y="278" class="muted" style="font-size:13px">来源 / 内容身份</text><text x="1000" y="302" class="" style="font-size:14px">示例公开规则 R1</text><text x="1000" y="350" class="muted" style="font-size:13px">有效区间</text><text x="1000" y="374" class="" style="font-size:14px">本例查询日适用</text><text x="1000" y="422" class="muted" style="font-size:13px">价格差 / 手数（试算）</text><rect x="1000" y="431" width="240" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="1012" y="453" class="" style="font-size:14px">1.00 元 × 2 手</text><text x="1000" y="510" class="muted" style="font-size:13px">合约金额变动（示例）</text><text x="1000" y="534" class="" style="font-size:14px">20.00 元，不含费用</text><text x="1000" y="594" class="muted" style="font-size:13px">冲突资料并列，不默认取第一条</text><rect x="420" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="432" y="766" class="accent" style="font-size:14px">查询资料</text><rect x="554" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="566" y="766" class="accent" style="font-size:14px">前往采集</text><rect x="688" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="700" y="766" class="accent" style="font-size:14px">带入研究</text></g></svg>
