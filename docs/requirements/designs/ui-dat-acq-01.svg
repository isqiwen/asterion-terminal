<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-label="UI-DAT-ACQ-01 数据来源与连接目标布局"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:16px;fill:#c5ccd6}.strong{fill:#eef4fb;font-weight:600}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}</style><rect x="0" y="0" width="1280" height="850" rx="2" fill="#06080b" stroke="#06080b" /><text x="24" y="30" class="accent">UI-DAT-ACQ-01 · 目标布局草案 · 非实际截图</text><text x="24" y="66" class="title">数据来源与连接</text><text x="24" y="842" class="muted">布局与字段示意；不连接服务，不代表已实现或已通过运行验收。</text><rect x="24" y="88" width="92" height="710" rx="2" fill="#0b0e13" stroke="#2a3543" /><rect x="30" y="107" width="80" height="36" rx="2" fill="#0b171f" stroke="#246373" /><text x="54" y="132" class="accent">数据</text><text x="54" y="176" class="">情报</text><text x="54" y="220" class="">分析</text><text x="54" y="264" class="">策略</text><text x="54" y="308" class="">回测</text><text x="54" y="352" class="">评估</text><text x="54" y="396" class="">实盘</text><text x="37" y="743" class="muted">系统管理</text><text x="138" y="111" class="muted">数据 → 接入与采集 → 数据来源与连接</text><rect x="138" y="133" width="1118" height="53" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="154.0" y="155" class="accent">接入与采集</text><path d="M154.0 160 H234.0" stroke="#38d6f2" stroke-width="2" /><text x="526.6666666666667" y="155" class="">加工与质量</text><text x="899.3333333333334" y="155" class="">管理与服务</text><text x="154" y="179" class="muted">来源与访问用途</text><rect x="138" y="799" width="1118" height="24" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="150" y="816" class="muted">任务  ·  通知  ·  连接状态</text><text x="835" y="816" class="muted" style="font-size:13px">状态以实际结果显示；点击返回所属对象</text><g transform="translate(138 204) scale(1.18) translate(-44 -174)"><rect x="44" y="174" width="200" height="410" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="60" y="204" class="strong">分类