 x="420" y="535" width="532" height="32" rx="2" fill="#0a0d12" stroke="#2a3543" /><text x="432" y="557" class="" style="font-size:14px">由适配能力提供 · 已选示例环境</text><text x="420" y="608" class="muted" style="font-size:13px">配置修改后，访问检查结果标为需重新核对</text><text x="420" y="644" class="muted" style="font-size:13px">保存配置不会启动采集或购买授权</text><rect x="984" y="204" width="272" height="510" rx="2" fill="#0b0e13" stroke="#2a3543" /><text x="1000" y="234" class="strong" style="font-size:16px">能力检查（只读）</text><path d="M984 249 H1256" stroke="#1a212b" /><text x="1000" y="278" class="muted" style="font-size:13px">连接 / 权限</text><text x="1000" y="302" class="" style="font-size:14px">已连接 / 实时无权限</text><text x="1000" y="350" class="muted" style="font-size:13px">已确认支持</text><text x="1000" y="374" class="" style="font-size:14px">历史 1 分钟、日线</text><text x="1000" y="422" class="muted" style="font-size:13px">不支持 / 未知</text><text x="1000" y="446" class="" style="font-size:14px">五档盘口：不支持</text><text x="1000" y="494" class="muted" style="font-size:13px">费用与限制</text><text x="1000" y="518" class="" style="font-size:14px">检查前明确范围及费用</text><text x="1000" y="566" class="muted" style="font-size:13px">受影响任务</text><text x="1000" y="590" class="" style="font-size:14px">历史计划 A；重新预览</text><rect x="420" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="432" y="766" class="accent" style="font-size:14px">保存来源</text><rect x="554" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="566" y="766" class="accent" style="font-size:14px">检查访问</text><rect x="688" y="743" width="120" height="34" rx="2" fill="#0b171f" stroke="#246373" /><text x="700" y="766" class="accent" style="font-size:14px">新建取数</text></g></svg>
