<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-label="实盘关键异常状态设计"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#c5ccd6;font-size:16px}.muted{fill:#7c8796;font-size:14px}.accent{fill:#38d6f2}.title{fill:#eef4fb;font-size:24px;font-weight:600}.warn{fill:#edb966}</style><rect width="1280" height="660" fill="#06080b"/><text x="24" y="32" class="accent">实盘 · 目标状态设计 · 虚构案例 · 非实际截图</text><text x="24" y="74" class="title">订单核对 / 外部结果未知</text><rect x="24" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="44" y="150" class="title">1  原意图</text><rect x="40" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="52" y="203" class="">本地记录存在，外部响应丢失</text><text x="52" y="226" class="muted">同一对象与原请求上下文</text><text x="44" y="282" class="muted">当前反馈</text><text x="44" y="315" class="">账户、环境、请求身份醒目显示</text><text x="44" y="397" class="muted">操作边界</text><text x="44" y="430" class="muted">状态：待核对；保留风险占用</text><rect x="44" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="58" y="539" class="accent">查询原请求</text><rect x="440" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="460" y="150" class="title">2  继续未知</text><rect x="456" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="468" y="203" class="">查询尚未覆盖该请求</text><text x="468" y="226" class="muted">同一对象与原请求上下文</text><text x="460" y="282" class="muted">当前反馈</text><text x="460" y="315" class="warn">不重发，不标未成交，不释放占用</text><text x="460" y="397" class="muted">操作边界</text><text x="460" y="430" class="muted">安全查询及适用撤单仍可使用</text><rect x="460" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="474" y="539" class="accent">查看查询覆盖</text><rect x="856" y="112" width="400" height="470" fill="#0b0e13" stroke="#2a3543" rx="2"/><text x="876" y="150" class="title">3  取得证据</text><rect x="872" y="174" width="368" height="66" fill="#11161d" stroke="#2a3543" rx="2"/><text x="884" y="203" class="">关联到实际订单及部分成交</text><text x="884" y="226" class="muted">同一对象与原请求上下文</text><text x="876" y="282" class="muted">当前反馈</text><text x="876" y="315" class="">按外部事实更新剩余数量</text><text x="876" y="397" class="muted">操作边界</text><text x="876" y="430" class="muted">恢复新增须单独检查和确认</text><rect x="876" y="512" width="350" height="42" fill="#0b171f" stroke="#246373" rx="2"/><text x="890" y="539" class="accent">审阅核对结果</text><text x="24" y="620" class="muted">图示展示关键反馈和可用动作；详细字段、权限、失败及返回按各 UI 与 FR 规格验收。</text></svg>