<text x="828" y="475" class="small">不继承相似包结论</text>
<path d="M350 542 H1060" stroke="#24333f"/>
<text x="354" y="524" class="body">目标用途</text>
<text x="548" y="524" class="accent">实盘准备</text>
<text x="828" y="524" class="small">切换用途重查</text>
<path d="M350 591 H1060" stroke="#24333f"/>
