<rect x="522" y="870" width="174" height="44" rx="5" fill="#153039" stroke="#377884"/>
<text x="540" y="899" class="accent">检查差异</text>
<rect x="710" y="870" width="174" height="44" rx="5" fill="#153039" stroke="#377884"/>
<text x="728" y="899" class="accent">查看证据</text>
<rect x="898" y="870" width="174" height="44" rx="5" fill="#17212a" stroke="#3c4854"/>
<text x="916" y="899" class="disabled">交接准备</text>
<text x="138" y="899" class="muted">任务与通知</text>
