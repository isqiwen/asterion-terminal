<text x="548" y="671" class="accent">待审阅</text>
<text x="828" y="671" class="small">决定与原因必填</text>
<path d="M350 738 H1060" stroke="#24333f"/>
<text x="354" y="720" class="body">限制与假设</text>
<text x="548" y="720" class="accent">待填写</text>
<text x="828" y="720" class="small">成本、时序、流动性</text>
<rect x="1092" y="222" width="324" height="558" rx="8" fill="#101820" stroke="#31414e"/>
<text x="1110" y="254" class="head">准备清单</text>
<text x="1112" y="306" class="body">内容完整性：待检查</text>
<path d="M1109 323 H1399" stroke="#24333f"/>
