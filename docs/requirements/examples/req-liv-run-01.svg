<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" role="img" aria-labelledby="REQ-LIV-RUN-01-figure-title REQ-LIV-RUN-01-figure-desc"><title id="REQ-LIV-RUN-01-figure-title">账户授权与允许操作的对照</title><desc id="REQ-LIV-RUN-01-figure-desc">虚构案例；授权与逐笔风险检查分别成立。只有明确授权的目标账户可以进入交易校验。</desc><rect width="1200" height="696" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-LIV-RUN-01  /  实盘交易 / 实盘准备与运行管理</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">账户授权与允许操作的对照</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例；授权与逐笔风险检查分别成立</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">步骤</text><text x="340" y="223" font-size="19" fill="#FFFFFF" font-weight="600">目标账户</text><text x="616" y="223" font-size="19" fill="#FFFFFF" font-weight="600">交易授权</text><text x="892" y="223" font-size="19" fill="#FFFFFF" font-weight="600">结果</text><rect x="48" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">行情已连接</text><rect x="324" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="271" font-size="19" fill="#172B45" font-weight="400">实盘 A</text><rect x="600" y="241" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="271" font-size="19" fill="#172B45" font-weight="400">未完成</text><rect x="876" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="271" font-size="19" fill="#172B45" font-weight="400">拒绝委托</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">独立交易授权</text><rect x="324" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="335" font-size="19" fill="#172B45" font-weight="400">实盘 A</text><rect x="600" y="305" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="335" font-size="19" fill="#172B45" font-weight="400">已完成</text><rect x="876" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="335" font-size="19" fill="#172B45" font-weight="400">进入逐笔校验</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">切换账户</text><rect x="324" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="399" font-size="19" fill="#172B45" font-weight="400">账户 B</text><rect x="600" y="369" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="399" font-size="19" fill="#172B45" font-weight="400">未完成</text><rect x="876" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="399" font-size="19" fill="#172B45" font-weight="400">拒绝委托</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="451" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="478" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="507" font-size="18" fill="#172B45" font-weight="400">行情凭据不能自动复用于交易登录</text><rect x="608" y="451" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="478" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="507" font-size="18" fill="#172B45" font-weight="400">账户 A 的授权不转移给账户 B</text><rect x="48" y="548" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="577" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="608" font-size="21" fill="#FFFFFF" font-weight="600">只有明确授权的目标账户可以进入交易校验。</text><text x="48" y="662" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>