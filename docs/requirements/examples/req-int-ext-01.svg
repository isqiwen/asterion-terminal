<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="REQ-INT-EXT-01-figure-title REQ-INT-EXT-01-figure-desc"><title id="REQ-INT-EXT-01-figure-title">计划减产不能变成已发生减产</title><desc id="REQ-INT-EXT-01-figure-desc">虚构案例｜公告第2页第3段。结构化结果保留计划、估计与未知，不扩大原文含义。</desc><rect width="1200" height="760" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-INT-EXT-01  /  情报 / 信息提取</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">计划减产不能变成已发生减产</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例｜公告第2页第3段</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">字段</text><text x="432" y="223" font-size="19" fill="#FFFFFF" font-weight="600">原文</text><text x="800" y="223" font-size="19" fill="#FFFFFF" font-weight="600">候选结果</text><rect x="48" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">时间</text><rect x="416" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="271" font-size="19" fill="#172B45" font-weight="400">下月</text><rect x="784" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="271" font-size="19" fill="#172B45" font-weight="400">案例年5月；具体日未知</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">数量</text><rect x="416" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="335" font-size="19" fill="#172B45" font-weight="400">约三万吨<