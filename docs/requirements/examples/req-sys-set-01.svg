<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" role="img" aria-labelledby="REQ-SYS-SET-01-figure-title REQ-SYS-SET-01-figure-desc"><title id="REQ-SYS-SET-01-figure-title">首次准备后的可用范围</title><desc id="REQ-SYS-SET-01-figure-desc">虚构案例：一台支持的 Mac，无远程资源。使用者清楚知道现在能做什么以及缺什么。</desc><rect width="1200" height="696" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-SYS-SET-01  /  系统管理 / 安装与配置</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">首次准备后的可用范围</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例：一台支持的 Mac，无远程资源</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">工作</text><text x="432" y="223" font-size="19" fill="#FFFFFF" font-weight="600">准备结果</text><text x="800" y="223" font-size="19" fill="#FFFFFF" font-weight="600">下一步</text><rect x="48" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">本地研究</text><rect x="416" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="271" font-size="19" fill="#172B45" font-weight="400">条件齐备</text><rect x="784" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="271" font-size="19" fill="#172B45" font-weight="400">可以开始</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">实盘交易</text><rect x="416" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="335" font-size="19" fill="#172B45" font-weight="400">账户与授权缺失</text><rect x="784" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="335" font-size="19" fill="#172B45" font-weight="400">补齐条件</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">远程资源</text><rect x="416" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="399" font-size="19" fill="#172B45" font-weight="400">未配置</text><rect x="784" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="399" font-size="19" fill="#172B45" font-weight="400">按需准备</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="451" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="478" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="507" font-size="18" fill="#172B45" font-weight="400">安装成功与交易可用分别判断。</text><rect x="608" y="451" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="478" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="507" font-size="18" fill="#172B45" font-weight="400">远程资源不构成本地研究的前置条件。</text><rect x="48" y="548" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="577" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="608" font-size="21" fill="#FFFFFF" font-weight="600">使用者清楚知道现在能做什么以及缺什么。</text><text x="48" y="662" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>