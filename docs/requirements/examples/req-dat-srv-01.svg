<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-labelledby="REQ-DAT-SRV-01-figure-title REQ-DAT-SRV-01-figure-desc"><title id="REQ-DAT-SRV-01-figure-title">示例合约 A 的单位换算</title><desc id="REQ-DAT-SRV-01-figure-desc">虚构案例｜案例日 T｜不含费用。用户可辨识合约，并核对手数与价格的金额含义。</desc><rect width="1200" height="824" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-DAT-SRV-01  /  数据 / 数据管理与服务</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">示例合约 A 的单位换算</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例｜案例日 T｜不含费用</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">项目</text><text x="432" y="223" font-size="19" fill="#FFFFFF" font-weight="600">数值</text><text x="800" y="223" font-size="19" fill="#FFFFFF" font-weight="600">含义</text><rect x="48" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">合约乘数</text><rect x="416" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="271" font-size="19" fill="#172B45" font-weight="400">10 单位／手</text><rect x="784" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="271" font-size="19" fill="#172B45" font-weight="400">价格换算基础</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">最小价格变动</text><rect x="416" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="335" font-size="19" fill="#172B45" font-weight="400">0.5 元／单位</text><rect x="784" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="335" font-size="19" fill="#172B45" font-weight="400">每次一跳</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">每手每跳</text><rect x="416" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="399" font-size="19" fill="#172B45" font-weight="400">5 元</text><rect x="784" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="399" font-size="19" fill="#172B45" font-weight="400">0.5×10</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">价格变化</text><rect x="416" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="463" font-size="19" fill="#172B45" font-weight="400">+1 元／单位</text><rect x="784" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="463" font-size="19" fill="#172B45" font-weight="400">上涨 2 跳</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="527" font-size="19" fill="#29486F" font-weight="600">2 手多头毛变动</text><rect x="416" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="527" font-size="19" fill="#172B45" font-weight="400">+20 元</text><rect x="784" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="527" font-size="19" fill="#172B45" font-weight="400">1×10×2</text><line x1="48" y1="561" x2="1152" y2="561" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="635" font-size="18" fill="#172B45" font-weight="400">规则绑定指定合约和案例日 T</text><rect x="608" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="635" font-size="18" fill="#172B45" font-weight="400">20 元仅为毛变动，尚未扣费用</text><rect x="48" y="676" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="705" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="736" font-size="21" fill="#FFFFFF" font-weight="600">用户可辨识合约，并核对手数与价格的金额含义。</text><text x="48" y="790" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>