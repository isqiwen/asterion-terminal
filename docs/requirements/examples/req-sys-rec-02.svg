<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="787" viewBox="0 0 1200 787" role="img" aria-labelledby="REQ-SYS-REC-02-figure-title REQ-SYS-REC-02-figure-desc"><title id="REQ-SYS-REC-02-figure-title">一次状态待核实事件</title><desc id="REQ-SYS-REC-02-figure-desc">虚构案例：操作甲提交后连接中断。错误说明支持安全行动，记录支持事后核对。</desc><rect width="1200" height="787" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-SYS-REC-02  /  系统管理 / 资料维护、诊断与导出</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">一次状态待核实事件</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例：操作甲提交后连接中断</text><text x="48" y="189" font-size="16" fill="#60738B" font-weight="600">时刻  /  已知事实  /  允许结论</text><line x1="69" y1="231" x2="69" y2="303" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="231" r="17" fill="#285CB8"/><text x="64" y="237" font-size="17" fill="#FFFFFF" font-weight="600">1</text><rect x="106" y="209" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="239" font-size="18" fill="#29486F" font-weight="600">T 09:31:00</text><text x="325" y="239" font-size="18" fill="#172B45" font-weight="400">已知事实：操作甲已发出　｜　允许结论：等待结果</text><line x1="69" y1="313" x2="69" y2="385" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="313" r="17" fill="#285CB8"/><text x="64" y="319" font-size="17" fill="#FFFFFF" font-weight="600">2</text><rect x="106" y="291" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="321" font-size="18" fill="#29486F" font-weight="600">T 09:31:02</text><text x="325" y="321" font-size="18" fill="#172B45" font-weight="400">已知事实：连接中断　｜　允许结论：结果待核实</text><line x1="69" y1="395" x2="69" y2="467" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="395" r="17" fill="#285CB8"/><text x="64" y="401" font-size="17" fill="#FFFFFF" font-weight="600">3</text><rect x="106" y="373" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="403" font-size="18" fill="#29486F" font-weight="600">联系恢复</text><text x="325" y="403" font-size="18" fill="#172B45" font-weight="400">已知事实：查询原操作　｜　允许结论：按查询结果更新</text><circle cx="69" cy="477" r="17" fill="#285CB8"/><text x="64" y="483" font-size="17" fill="#FFFFFF" font-weight="600">4</text><rect x="106" y="455" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="485" font-size="18" fill="#29486F" font-weight="600">诊断导出</text><text x="325" y="485" font-size="18" fill="#172B45" font-weight="400">已知事实：保存必要上下文　｜　允许结论：不含秘密</text><rect x="48" y="542" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="569" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="598" font-size="18" fill="#172B45" font-weight="400">没有确认不等于业务失败。</text><rect x="608" y="542" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="569" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="598" font-size="18" fill="#172B45" font-weight="400">核实既有请求，不自动重复提交。</text><rect x="48" y="639" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="668" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="699" font-size="21" fill="#FFFFFF" font-weight="600">错误说明支持安全行动，记录支持事后核对。</text><text x="48" y="753" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>