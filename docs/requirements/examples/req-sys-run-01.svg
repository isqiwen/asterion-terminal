<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="787" viewBox="0 0 1200 787" role="img" aria-labelledby="REQ-SYS-RUN-01-figure-title REQ-SYS-RUN-01-figure-desc"><title id="REQ-SYS-RUN-01-figure-title">取消后的研究结果范围</title><desc id="REQ-SYS-RUN-01-figure-desc">虚构案例：十个数据日的任务处理到第四日。保留有价值的工作痕迹，同时明确研究未完成。</desc><rect width="1200" height="787" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-SYS-RUN-01  /  系统管理 / 任务调度与运行节点</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">取消后的研究结果范围</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例：十个数据日的任务处理到第四日</text><text x="48" y="189" font-size="16" fill="#60738B" font-weight="600">时点  /  任务状态  /  结果含义</text><line x1="69" y1="231" x2="69" y2="303" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="231" r="17" fill="#285CB8"/><text x="64" y="237" font-size="17" fill="#FFFFFF" font-weight="600">1</text><rect x="106" y="209" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="239" font-size="18" fill="#29486F" font-weight="600">提交时</text><text x="325" y="239" font-size="18" fill="#172B45" font-weight="400">任务状态：运行　｜　结果含义：计划 T 至 T+9</text><line x1="69" y1="313" x2="69" y2="385" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="313" r="17" fill="#285CB8"/><text x="64" y="319" font-size="17" fill="#FFFFFF" font-weight="600">2</text><rect x="106" y="291" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="321" font-size="18" fill="#29486F" font-weight="600">处理四日后</text><text x="325" y="321" font-size="18" fill="#172B45" font-weight="400">任务状态：运行　｜　结果含义：已有 T 至 T+3</text><line x1="69" y1="395" x2="69" y2="467" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="395" r="17" fill="#285CB8"/><text x="64" y="401" font-size="17" fill="#FFFFFF" font-weight="600">3</text><rect x="106" y="373" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="403" font-size="18" fill="#29486F" font-weight="600">请求取消</text><text x="325" y="403" font-size="18" fill="#172B45" font-weight="400">任务状态：取消处理中　｜　结果含义：尚未确认停止</text><circle cx="69" cy="477" r="17" fill="#285CB8"/><text x="64" y="483" font-size="17" fill="#FFFFFF" font-weight="600">4</text><rect x="106" y="455" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="485" font-size="18" fill="#29486F" font-weight="600">停止确认</text><text x="325" y="485" font-size="18" fill="#172B45" font-weight="400">任务状态：取消　｜　结果含义：仅四日阶段产物</text><rect x="48" y="542" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="569" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="598" font-size="18" fill="#172B45" font-weight="400">取消请求与停止确认是两个时点。</text><rect x="608" y="542" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="569" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="598" font-size="18" fill="#172B45" font-weight="400">阶段产物不得标作十日完整结论。</text><rect x="48" y="639" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="668" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="699" font-size="21" fill="#FFFFFF" font-weight="600">保留有价值的工作痕迹，同时明确研究未完成。</text><text x="48" y="753" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>