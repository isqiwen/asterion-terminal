"none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">T2</text><rect x="324" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="335" font-size="19" fill="#172B45" font-weight="400">缺失</text><rect x="600" y="305" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="335" font-size="19" fill="#172B45" font-weight="400">101</text><rect x="876" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="335" font-size="19" fill="#172B45" font-weight="400">新增观测</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">T3</text><rect x="324" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="399" font-size="19" fill="#172B45" font-weight="400">102</text><rect x="600" y="369" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="399" font-size="19" fill="#172B45" font-weight="400">103</text><rect x="876" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="399" font-size="19" fill="#172B45" font-weight="400">来源修订</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="451" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="478" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="507" font-size="18" fill="#172B45" font-weight="400">原实验继续引用 S1</text><rect x="608" y="451" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="478" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="507" font-size="18" fill="#172B45" font-weight="400">采用 S2 必须显式创建新实验</text><rect x="48" y="548" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="577" font-size=