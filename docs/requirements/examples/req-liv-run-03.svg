<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" role="img" aria-labelledby="REQ-LIV-RUN-03-figure-title REQ-LIV-RUN-03-figure-desc"><title id="REQ-LIV-RUN-03-figure-title">从模拟结果到限定实盘授权</title><desc id="REQ-LIV-RUN-03-figure-desc">虚构案例；10 信号 = 7 模拟委托 + 2 风控拒绝 + 1 数据拒绝。实盘权限明确授予，并仅覆盖已经审查的策略内容与范围。</desc><rect width="1200" height="696" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-LIV-RUN-03  /  实盘交易 / 实盘准备与运行管理</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">从模拟结果到限定实盘授权</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例；10 信号 = 7 模拟委托 + 2 风控拒绝 + 1 数据拒绝</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">阶段</text><text x="340" y="223" font-size="19" fill="#FFFFFF" font-weight="600">方案约束</text><text x="616" y="223" font-size="19" fill="#FFFFFF" font-weight="600">授权范围</text><text x="892" y="223" font-size="19" fill="#FFFFFF" font-weight="600">预期结果</text><rect x="48" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">模拟验证</text><rect x="324" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="271" font-size="19" fill="#172B45" font-weight="400">每次最多 1 手</text><rect x="600" y="241" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="271" font-size="19" fill="#172B45" font-weight="400">仅模拟</text><rect x="876" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="271" font-size="19" fill="#172B45" font-weight="400">真实委托 0</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">确认实盘授权</text><rect x="324" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="335" font-size="19" fill="#172B45" font-weight="400">每次最多 1 手</text><rect x="600" y="305" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="335" font-size="19" fill="#172B45" font-weight="400">账户 A / 合约 A</text><rect x="876" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="335" font-size="19" fill="#172B45" font-weight="400">允许进入运行准备</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">参数改为 2 手</text><rect x="324" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="399" font-size="19" fill="#172B45" font-weight="400">每次开仓 2 手</text><rect x="600" y="369" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="399" font-size="19" fill="#172B45" font-weight="400">仍为原 1 手方案</text><rect x="876" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="399" font-size="19" fill="#172B45" font-weight="400">拒绝直接启用</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="451" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="478" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="507" font-size="18" fill="#172B45" font-weight="400">7 个模拟委托不等于 7 笔真实成交</text><rect x="608" y="451" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="478" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="507" font-size="18" fill="#172B45" font-weight="400">收益为正本身不是实盘启用标准</text><rect x="48" y="548" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="577" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="608" font-size="21" fill="#FFFFFF" font-weight="600">实盘权限明确授予，并仅覆盖已经审查的策略内容与范围。</text><text x="48" y="662" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>