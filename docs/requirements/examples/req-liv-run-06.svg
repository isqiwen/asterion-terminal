<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="787" viewBox="0 0 1200 787" role="img" aria-labelledby="REQ-LIV-RUN-06-figure-title REQ-LIV-RUN-06-figure-desc"><title id="REQ-LIV-RUN-06-figure-title">风险回落不等于自动恢复</title><desc id="REQ-LIV-RUN-06-figure-desc">虚构案例；固定基准 100000 元，2% 预警、3% 暂停。风险暂停可解释、跨入口生效，并按明确条件恢复。</desc><rect width="1200" height="787" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-LIV-RUN-06  /  实盘交易 / 实盘准备与运行管理</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">风险回落不等于自动恢复</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例；固定基准 100000 元，2% 预警、3% 暂停</text><text x="48" y="189" font-size="16" fill="#60738B" font-weight="600">阶段  /  账户权益  /  期初权益损失  /  新风险状态</text><line x1="69" y1="231" x2="69" y2="303" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="231" r="17" fill="#285CB8"/><text x="64" y="237" font-size="17" fill="#FFFFFF" font-weight="600">1</text><rect x="106" y="209" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="239" font-size="18" fill="#29486F" font-weight="600">期初</text><text x="325" y="239" font-size="18" fill="#172B45" font-weight="400">账户权益：100000 元　｜　期初权益损失：0%　｜　新风险状态：允许校验</text><line x1="69" y1="313" x2="69" y2="385" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="313" r="17" fill="#285CB8"/><text x="64" y="319" font-size="17" fill="#FFFFFF" font-weight="600">2</text><rect x="106" y="291" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="321" font-size="18" fill="#29486F" font-weight="600">达到预警</text><text x="325" y="321" font-size="18" fill="#172B45" font-weight="400">账户权益：98000 元　｜　期初权益损失：2%　｜　新风险状态：预警</text><line x1="69" y1="395" x2="69" y2="467" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="395" r="17" fill="#285CB8"/><text x="64" y="401" font-size="17" fill="#FFFFFF" font-weight="600">3</text><rect x="106" y="373" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="403" font-size="18" fill="#29486F" font-weight="600">达到暂停</text><text x="325" y="403" font-size="18" fill="#172B45" font-weight="400">账户权益：97000 元　｜　期初权益损失：3%　｜　新风险状态：拒绝新增</text><circle cx="69" cy="477" r="17" fill="#285CB8"/><text x="64" y="483" font-size="17" fill="#FFFFFF" font-weight="600">4</text><rect x="106" y="455" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="485" font-size="18" fill="#29486F" font-weight="600">回落未确认</text><text x="325" y="485" font-size="18" fill="#172B45" font-weight="400">账户权益：97500 元　｜　期初权益损失：2.5%　｜　新风险状态：继续暂停</text><rect x="48" y="542" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="569" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="598" font-size="18" fill="#172B45" font-weight="400">示例阈值不是实际账户参数建议</text><rect x="608" y="542" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="569" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="598" font-size="18" fill="#172B45" font-weight="400">暂停不自动撤单，也不代表持仓归零</text><rect x="48" y="639" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="668" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="699" font-size="21" fill="#FFFFFF" font-weight="600">风险暂停可解释、跨入口生效，并按明确条件恢复。</text><text x="48" y="753" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>