<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-labelledby="REQ-LIV-ACC-02-figure-title REQ-LIV-ACC-02-figure-desc"><title id="REQ-LIV-ACC-02-figure-title">费用差异如何影响权益</title><desc id="REQ-LIV-ACC-02-figure-desc">虚构案例；乘数 10，无其他收支。两元费用差异被准确定位，并保留核对与处理依据。</desc><rect width="1200" height="824" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-LIV-ACC-02  /  实盘交易 / 账户管理与交易核对</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">费用差异如何影响权益</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例；乘数 10，无其他收支</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">核对项目</text><text x="340" y="223" font-size="19" fill="#FFFFFF" font-weight="600">过程估算</text><text x="616" y="223" font-size="19" fill="#FFFFFF" font-weight="600">结算资料</text><text x="892" y="223" font-size="19" fill="#FFFFFF" font-weight="600">差异</text><rect x="48" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">已实现盈亏</text><rect x="324" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="271" font-size="19" fill="#172B45" font-weight="400">100 元</text><rect x="600" y="241" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="271" font-size="19" fill="#172B45" font-weight="400">100 元</text><rect x="876" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="271" font-size="19" fill="#172B45" font-weight="400">0 元</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">剩余持仓估值</text><rect x="324" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="335" font-size="19" fill="#172B45" font-weight="400">60 元</text><rect x="600" y="305" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="335" font-size="19" fill="#172B45" font-weight="400">60 元</text><rect x="876" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="335" font-size="19" fill="#172B45" font-weight="400">0 元</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">总费用</text><rect x="324" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="399" font-size="19" fill="#172B45" font-weight="400">12 元</text><rect x="600" y="369" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="399" font-size="19" fill="#172B45" font-weight="400">14 元</text><rect x="876" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="399" font-size="19" fill="#172B45" font-weight="400">+2 元</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">账户权益</text><rect x="324" y="433" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="463" font-size="19" fill="#172B45" font-weight="400">100148 元</text><rect x="600" y="433" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="463" font-size="19" fill="#172B45" font-weight="400">100146 元</text><rect x="876" y="433" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="463" font-size="19" fill="#172B45" font-weight="400">−2 元</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="497" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="527" font-size="19" fill="#29486F" font-weight="600">核对结论</text><rect x="324" y="497" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="527" font-size="19" fill="#172B45" font-weight="400">保留原估算</text><rect x="600" y="497" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="527" font-size="19" fill="#172B45" font-weight="400">保留来源依据</text><rect x="876" y="497" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="527" font-size="19" fill="#172B45" font-weight="400">等待差异确认</text><line x1="48" y1="561" x2="1152" y2="561" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="635" font-size="18" fill="#172B45" font-weight="400">2 手开仓 + 1 手平仓，共计 3 成交手</text><rect x="608" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="635" font-size="18" fill="#172B45" font-weight="400">不得通过静默改写把差异抹平</text><rect x="48" y="676" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="705" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="736" font-size="21" fill="#FFFFFF" font-weight="600">两元费用差异被准确定位，并保留核对与处理依据。</text><text x="48" y="790" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>