<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-labelledby="REQ-LIV-ACC-01-figure-title REQ-LIV-ACC-01-figure-desc"><title id="REQ-LIV-ACC-01-figure-title">同一账户的资金组成</title><desc id="REQ-LIV-ACC-01-figure-desc">虚构案例；费用为零，占用金额固定，仅为计算假设。账户权益、占用与可用资金具有明确且可核对的含义。</desc><rect width="1200" height="824" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-LIV-ACC-01  /  实盘交易 / 账户管理与交易核对</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">同一账户的资金组成</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例；费用为零，占用金额固定，仅为计算假设</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">项目</text><text x="432" y="223" font-size="19" fill="#FFFFFF" font-weight="600">计算或来源</text><text x="800" y="223" font-size="19" fill="#FFFFFF" font-weight="600">结果</text><rect x="48" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">浮动盈亏</text><rect x="416" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="271" font-size="19" fill="#172B45" font-weight="400">20 × 10 × 3</text><rect x="784" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="271" font-size="19" fill="#172B45" font-weight="400">600 元</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">权益</text><rect x="416" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="335" font-size="19" fill="#172B45" font-weight="400">100000 + 600</text><rect x="784" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="335" font-size="19" fill="#172B45" font-weight="400">100600 元</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">保证金占用</text><rect x="416" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="399" font-size="19" fill="#172B45" font-weight="400">案例固定值</text><rect x="784" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="399" font-size="19" fill="#172B45" font-weight="400">18000 元</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">委托冻结</text><rect x="416" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="463" font-size="19" fill="#172B45" font-weight="400">案例固定值</text><rect x="784" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="463" font-size="19" fill="#172B45" font-weight="400">2000 元</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="527" font-size="19" fill="#29486F" font-weight="600">可用资金</text><rect x="416" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="527" font-size="19" fill="#172B45" font-weight="400">100600 − 20000</text><rect x="784" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="527" font-size="19" fill="#172B45" font-weight="400">80600 元</text><line x1="48" y1="561" x2="1152" y2="561" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="635" font-size="18" fill="#172B45" font-weight="400">浮动盈亏不是已实现收益</text><rect x="608" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="635" font-size="18" fill="#172B45" font-weight="400">本案例公式不代表全部账户的结算规则</text><rect x="48" y="676" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="705" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="736" font-size="21" fill="#FFFFFF" font-weight="600">账户权益、占用与可用资金具有明确且可核对的含义。</text><text x="48" y="790" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>