<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="705" viewBox="0 0 1200 705" role="img" aria-labelledby="REQ-LIV-RUN-02-figure-title REQ-LIV-RUN-02-figure-desc"><title id="REQ-LIV-RUN-02-figure-title">报价时效变化案例</title><desc id="REQ-LIV-RUN-02-figure-desc">虚构案例；演示阈值为 2 秒。使用者能区分当前有效报价与保留的过期参考值。</desc><rect width="1200" height="705" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-LIV-RUN-02  /  实盘交易 / 实盘准备与运行管理</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">报价时效变化案例</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例；演示阈值为 2 秒</text><text x="48" y="189" font-size="16" fill="#60738B" font-weight="600">观察时刻  /  来源时刻  /  价格  /  数据年龄  /  状态</text><line x1="69" y1="231" x2="69" y2="303" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="231" r="17" fill="#285CB8"/><text x="64" y="237" font-size="17" fill="#FFFFFF" font-weight="600">1</text><rect x="106" y="209" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="239" font-size="18" fill="#29486F" font-weight="600">09:00:01</text><text x="325" y="239" font-size="18" fill="#172B45" font-weight="400">来源时刻：09:00:00　｜　价格：3500　｜　数据年龄：1 秒　｜　状态：有效</text><line x1="69" y1="313" x2="69" y2="385" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="313" r="17" fill="#285CB8"/><text x="64" y="319" font-size="17" fill="#FFFFFF" font-weight="600">2</text><rect x="106" y="291" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="321" font-size="18" fill="#29486F" font-weight="600">09:00:03</text><text x="325" y="321" font-size="18" fill="#172B45" font-weight="400">来源时刻：09:00:00　｜　价格：3500　｜　数据年龄：3 秒　｜　状态：过期参考</text><circle cx="69" cy="395" r="17" fill="#285CB8"/><text x="64" y="401" font-size="17" fill="#FFFFFF" font-weight="600">3</text><rect x="106" y="373" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="403" font-size="18" fill="#29486F" font-weight="600">09:00:04</text><text x="325" y="403" font-size="18" fill="#172B45" font-weight="400">来源时刻：09:00:03.8　｜　价格：3501　｜　数据年龄：0.2 秒　｜　状态：有效</text><rect x="48" y="460" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="487" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="516" font-size="18" fill="#172B45" font-weight="400">同一个数值不会因持续显示而保持有效</text><rect x="608" y="460" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="487" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="516" font-size="18" fill="#172B45" font-weight="400">2 秒是案例假设，正式阈值待确认</text><rect x="48" y="557" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="586" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="617" font-size="21" fill="#FFFFFF" font-weight="600">使用者能区分当前有效报价与保留的过期参考值。</text><text x="48" y="671" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>