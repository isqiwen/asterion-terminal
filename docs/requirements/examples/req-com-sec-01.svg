<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="REQ-COM-SEC-01-figure-title REQ-COM-SEC-01-figure-desc"><title id="REQ-COM-SEC-01-figure-title">行情与交易权限分别判断</title><desc id="REQ-COM-SEC-01-figure-desc">虚构案例：仅保存连接甲的行情密码。便利性与权限边界可以同时明确。</desc><rect width="1200" height="760" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-COM-SEC-01  /  通用规范 / 凭据与访问安全</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">行情与交易权限分别判断</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例：仅保存连接甲的行情密码</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">对象</text><text x="432" y="223" font-size="19" fill="#FFFFFF" font-weight="600">状态</text><text x="800" y="223" font-size="19" fill="#FFFFFF" font-weight="600">允许结果</text><rect x="48" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">行情凭据</text><rect x="416" y="241" width="368" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="432" y="271" font-size="19" fill="#172B45" font-weight="400">用户同意安全保存</text><rect x="784" y="241" width="368" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="800" y="271" font-size="19" fill="#172B45" font-weight="400">用于行情登录</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">行情验证</text><rect x="416" y="305" width="368" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="432" y="335" font-size="19" fill="#172B45" font-weight="400">成功</text><rect x="784" y="305" width="368" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="800" y="335" font-size="19" fill="#172B45" font-weight="400">读取授权范围行情</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">交易登录与授权</text><rect x="416" y="369" width="368" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="432" y="399" font-size="19" fill="#172B45" font-weight="400">尚未完成</text><rect x="784" y="369" width="368" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="800" y="399" font-size="19" fill="#172B45" font-weight="400">不能提交交易</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">诊断导出</text><rect x="416" y="433" width="368" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="432" y="463" font-size="19" fill="#172B45" font-weight="400">去除秘密</text><rect x="784" y="433" width="368" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="800" y="463" font-size="19" fill="#172B45" font-weight="400">保留错误类别</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="515" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="571" font-size="18" fill="#172B45" font-weight="400">已保存行情密码不产生交易授权。</text><rect x="608" y="515" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="571" font-size="18" fill="#172B45" font-weight="400">安全存储失败时不得保存到普通文件。</text><rect x="48" y="612" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="641" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="672" font-size="21" fill="#FFFFFF" font-weight="600">便利性与权限边界可以同时明确。</text><text x="48" y="726" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>