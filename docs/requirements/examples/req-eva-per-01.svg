<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="REQ-EVA-PER-01-figure-title REQ-EVA-PER-01-figure-desc"><title id="REQ-EVA-PER-01-figure-title">合约贡献与账户变动核对</title><desc id="REQ-EVA-PER-01-figure-desc">虚构案例｜初始权益 1000 元｜无资金出入。每项贡献都能对到账户结果，并区分已实现与未平仓部分。</desc><rect width="1200" height="760" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-EVA-PER-01  /  评估 / 绩效度量与归因</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">合约贡献与账户变动核对</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例｜初始权益 1000 元｜无资金出入</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">归属</text><text x="340" y="223" font-size="19" fill="#FFFFFF" font-weight="600">毛变动</text><text x="616" y="223" font-size="19" fill="#FFFFFF" font-weight="600">费用</text><text x="892" y="223" font-size="19" fill="#FFFFFF" font-weight="600">净贡献</text><rect x="48" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">A：已平仓</text><rect x="324" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="340" y="271" font-size="19" fill="#172B45" font-weight="400">+30 元</text><rect x="600" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="616" y="271" font-size="19" fill="#172B45" font-weight="400">4 元</text><rect x="876" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="892" y="271" font-size="19" fill="#172B45" font-weight="400">+26 元</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">B：未平仓估值</text><rect x="324" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="340" y="335" font-size="19" fill="#172B45" font-weight="400">+10 元</text><rect x="600" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="616" y="335" font-size="19" fill="#172B45" font-weight="400">2 元</text><rect x="876" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="892" y="335" font-size="19" fill="#172B45" font-weight="400">+8 元</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">合计</text><rect x="324" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="340" y="399" font-size="19" fill="#172B45" font-weight="400">+40 元</text><rect x="600" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="616" y="399" font-size="19" fill="#172B45" font-weight="400">6 元</text><rect x="876" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="892" y="399" font-size="19" fill="#172B45" font-weight="400">+34 元</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">期末权益</text><rect x="324" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="340" y="463" font-size="19" fill="#172B45" font-weight="400">1000＋34</text><rect x="600" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="616" y="463" font-size="19" fill="#172B45" font-weight="400">已含上述费用</text><rect x="876" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="892" y="463" font-size="19" fill="#172B45" font-weight="400">1034 元</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="515" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="571" font-size="18" fill="#172B45" font-weight="400">B 的 8 元包含未平仓估值影响</text><rect x="608" y="515" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="571" font-size="18" fill="#172B45" font-weight="400">26＋8＝34，与账户净变动相符</text><rect x="48" y="612" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="641" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="672" font-size="21" fill="#FFFFFF" font-weight="600">每项贡献都能对到账户结果，并区分已实现与未平仓部分。</text><text x="48" y="726" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>