<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="632" viewBox="0 0 1200 632" role="img" aria-labelledby="REQ-ANA-EDA-01-figure-title REQ-ANA-EDA-01-figure-desc"><title id="REQ-ANA-EDA-01-figure-title">研究计划：效果与样本共同判断</title><desc id="REQ-ANA-EDA-01-figure-desc">虚构案例；命中率＞50%且有效样本≥100。事后修改标准不改变原计划；探索观察与独立验证分开。</desc><rect width="1200" height="632" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-ANA-EDA-01  /  分析 / 数据探索与统计分析</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">研究计划：效果与样本共同判断</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例；命中率＞50%且有效样本≥100</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">对象</text><text x="340" y="223" font-size="19" fill="#FFFFFF" font-weight="600">命中率</text><text x="616" y="223" font-size="19" fill="#FFFFFF" font-weight="600">有效样本</text><text x="892" y="223" font-size="19" fill="#FFFFFF" font-weight="600">判断</text><rect x="48" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">甲</text><rect x="324" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="271" font-size="19" fill="#172B45" font-weight="400">60%</text><rect x="600" y="241" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="271" font-size="19" fill="#172B45" font-weight="400">100</text><rect x="876" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="271" font-size="19" fill="#172B45" font-weight="400">满足案例标准</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">乙</text><rect x="324" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="335" font-size="19" fill="#172B45" font-weight="400">70%</text><rect x="600" y="305" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="335" font-size="19" fill="#172B45" font-weight="400">10</text><rect x="876" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="335" font-size="19" fill="#172B45" font-weight="400">证据不足</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="387" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="414" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="443" font-size="18" fill="#172B45" font-weight="400">示例数值仅用于验收计算，不是市场观察结果</text><rect x="608" y="387" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="414" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="443" font-size="18" fill="#172B45" font-weight="400">结论只适用于声明的数据、样本和方法</text><rect x="48" y="484" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="513" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="544" font-size="21" fill="#FFFFFF" font-weight="600">事后修改标准不改变原计划；探索观察与独立验证分开。</text><text x="48" y="598" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>