<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="952" viewBox="0 0 1200 952" role="img" aria-labelledby="REQ-BKT-EXP-03-figure-title REQ-BKT-EXP-03-figure-desc"><title id="REQ-BKT-EXP-03-figure-title">批次完整性与稳健性摘录</title><desc id="REQ-BKT-EXP-03-figure-desc">虚构案例；12次计划，摘录8次完成中的4条结果。候选依据参数邻域、成本和完整性共同评审。</desc><rect width="1200" height="952" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-BKT-EXP-03  /  回测 / 回测设计与实验管理</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">批次完整性与稳健性摘录</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例；12次计划，摘录8次完成中的4条结果</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">对象</text><text x="340" y="223" font-size="19" fill="#FFFFFF" font-weight="600">条件</text><text x="616" y="223" font-size="19" fill="#FFFFFF" font-weight="600">结果</text><text x="892" y="223" font-size="19" fill="#FFFFFF" font-weight="600">说明</text><rect x="48" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">完整运行</text><rect x="324" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="271" font-size="19" fill="#172B45" font-weight="400">8 次</text><rect x="600" y="241" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="271" font-size="19" fill="#172B45" font-weight="400">可审阅</text><rect x="876" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="271" font-size="19" fill="#172B45" font-weight="400">范围需说明</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">失败运行</text><rect x="324" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="335" font-size="19" fill="#172B45" font-weight="400">2 次</text><rect x="600" y="305" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="335" font-size="19" fill="#172B45" font-weight="400">无有效收益</text><rect x="876" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="335" font-size="19" fill="#172B45" font-weight="400">输出不合约束</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">未开始</text><rect x="324" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="399" font-size="19" fill="#172B45" font-weight="400">2 次</text><rect x="600" y="369" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="399" font-size="19" fill="#172B45" font-weight="400">无结果</text><rect x="876" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="399" font-size="19" fill="#172B45" font-weight="400">取消后未调度</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">中心参数</text><rect x="324" y="433" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="463" font-size="19" fill="#172B45" font-weight="400">窗口3 / 阈值2</text><rect x="600" y="433" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="463" font-size="19" fill="#172B45" font-weight="400">+26 元</text><rect x="876" y="433" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="463" font-size="19" fill="#172B45" font-weight="400">基准费用4元</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="497" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="527" font-size="19" fill="#29486F" font-weight="600">较短邻域</text><rect x="324" y="497" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="527" font-size="19" fill="#172B45" font-weight="400">窗口2 / 阈值2</text><rect x="600" y="497" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="527" font-size="19" fill="#172B45" font-weight="400">+24 元</text><rect x="876" y="497" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="527" font-size="19" fill="#172B45" font-weight="400">同口径比较</text><line x1="48" y1="561" x2="1152" y2="561" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="561" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="591" font-size="19" fill="#29486F" font-weight="600">较长邻域</text><rect x="324" y="561" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="591" font-size="19" fill="#172B45" font-weight="400">窗口4 / 阈值2</text><rect x="600" y="561" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="591" font-size="19" fill="#172B45" font-weight="400">+25 元</text><rect x="876" y="561" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="591" font-size="19" fill="#172B45" font-weight="400">同口径比较</text><line x1="48" y1="625" x2="1152" y2="625" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="625" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="655" font-size="19" fill="#29486F" font-weight="600">中心成本扰动</text><rect x="324" y="625" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="655" font-size="19" fill="#172B45" font-weight="400">费用1.5倍</text><rect x="600" y="625" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="655" font-size="19" fill="#172B45" font-weight="400">+24 元</text><rect x="876" y="625" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="655" font-size="19" fill="#172B45" font-weight="400">费用6元</text><line x1="48" y1="689" x2="1152" y2="689" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="707" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="734" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="763" font-size="18" fill="#172B45" font-weight="400">8 + 2 + 2 = 12，整个空间尚不完整</text><rect x="608" y="707" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="734" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="763" font-size="18" fill="#172B45" font-weight="400">成本增加2元，中心净盈亏减少2元</text><rect x="48" y="804" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="833" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="864" font-size="21" fill="#FFFFFF" font-weight="600">候选依据参数邻域、成本和完整性共同评审。</text><text x="48" y="918" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>