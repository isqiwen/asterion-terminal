<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="REQ-ANA-FTR-02-figure-title REQ-ANA-FTR-02-figure-desc"><title id="REQ-ANA-FTR-02-figure-title">样本时间检查：按标签结束时点隔离</title><desc id="REQ-ANA-FTR-02-figure-desc">两交易日目标；验证起点D4。标签能用于事后研究；不能把跨边界标签用于训练。</desc><rect width="1200" height="760" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-ANA-FTR-02  /  分析 / 特征与因子构建</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">样本时间检查：按标签结束时点隔离</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">两交易日目标；验证起点D4</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">样本日</text><text x="340" y="223" font-size="19" fill="#FFFFFF" font-weight="600">标签结束</text><text x="616" y="223" font-size="19" fill="#FFFFFF" font-weight="600">标签收益</text><text x="892" y="223" font-size="19" fill="#FFFFFF" font-weight="600">训练资格</text><rect x="48" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">D1</text><rect x="324" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="271" font-size="19" fill="#172B45" font-weight="400">D3</text><rect x="600" y="241" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="271" font-size="19" fill="#172B45" font-weight="400">1%</text><rect x="876" y="241" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="271" font-size="19" fill="#172B45" font-weight="400">纳入</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">D2</text><rect x="324" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="335" font-size="19" fill="#172B45" font-weight="400">D4</text><rect x="600" y="305" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="335" font-size="19" fill="#172B45" font-weight="400">0.980392%</text><rect x="876" y="305" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="335" font-size="19" fill="#172B45" font-weight="400">跨边界排除</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">D3</text><rect x="324" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="399" font-size="19" fill="#172B45" font-weight="400">D5</text><rect x="600" y="369" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="399" font-size="19" fill="#172B45" font-weight="400">2.970297%</text><rect x="876" y="369" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="399" font-size="19" fill="#172B45" font-weight="400">跨边界排除</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">D4 / D5</text><rect x="324" y="433" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="340" y="463" font-size="19" fill="#172B45" font-weight="400">未知</text><rect x="600" y="433" width="276" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="616" y="463" font-size="19" fill="#172B45" font-weight="400">缺失</text><rect x="876" y="433" width="276" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="892" y="463" font-size="19" fill="#172B45" font-weight="400">不纳入评价</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="515" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="571" font-size="18" fill="#172B45" font-weight="400">示例数值仅用于验收计算，不是市场观察结果</text><rect x="608" y="515" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="571" font-size="18" fill="#172B45" font-weight="400">结论只适用于声明的数据、样本和方法</text><rect x="48" y="612" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="641" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="672" font-size="21" fill="#FFFFFF" font-weight="600">标签能用于事后研究；不能把跨边界标签用于训练。</text><text x="48" y="726" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>