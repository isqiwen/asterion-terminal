<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="REQ-EVA-VAL-01-figure-title REQ-EVA-VAL-01-figure-desc"><title id="REQ-EVA-VAL-01-figure-title">训练选择与验证结论分开</title><desc id="REQ-EVA-VAL-01-figure-desc">虚构案例｜相同数据与成本｜按训练净收益选择。用户能看到候选如何选出，以及验证证据是否仍独立。</desc><rect width="1200" height="1050" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-EVA-VAL-01  /  评估 / 稳健性验证与综合评价</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">训练选择与验证结论分开</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例｜相同数据与成本｜按训练净收益选择</text><rect x="48" y="179" width="1104" height="330" rx="12" fill="#F6F8FC" stroke="none"/><text x="72" y="208" font-size="18" fill="#536782" font-weight="600">数值结果（%）</text><line x1="140" y1="449" x2="1080" y2="449" stroke="#D9E2EF" stroke-width="2"/><text x="64" y="455" font-size="15" fill="#536782" font-weight="400">-5</text><line x1="140" y1="372.33333333333337" x2="1080" y2="372.33333333333337" stroke="#8299B7" stroke-width="2"/><text x="64" y="378.33333333333337" font-size="15" fill="#536782" font-weight="400">0</text><line x1="140" y1="295.6666666666667" x2="1080" y2="295.6666666666667" stroke="#D9E2EF" stroke-width="2"/><text x="64" y="301.6666666666667" font-size="15" fill="#536782" font-weight="400">5</text><line x1="140" y1="219" x2="1080" y2="219" stroke="#D9E2EF" stroke-width="2"/><text x="64" y="225" font-size="15" fill="#536782" font-weight="400">10</text><text x="354" y="478" font-size="15" fill="#536782" font-weight="400">实验甲</text><text x="824" y="478" font-size="15" fill="#536782" font-weight="400">实验乙</text><rect x="310" y="249.66666666666666" width="60" height="122.66666666666671" rx="3" fill="#285CB8" stroke="none"/><text x="328" y="239.66666666666666" f