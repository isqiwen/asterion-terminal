" stroke="none"/><text x="68" y="931" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="962" font-size="21" fill="#FFFFFF" font-weight="600">用户能看到候选如何选出，以及验证证据是否仍独立。</text><text x="48" y="1016" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>