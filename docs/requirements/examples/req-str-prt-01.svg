<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="979" viewBox="0 0 1200 979" role="img" aria-labelledby="REQ-STR-PRT-01-figure-title REQ-STR-PRT-01-figure-desc"><title id="REQ-STR-PRT-01-figure-title">目标组合的名义敞口与保证金</title><desc id="REQ-STR-PRT-01-figure-desc">虚构案例｜权益基准100000元｜以下为目标测算而非成交。目标、保证金和账户资金分开；压力超限时不执行新增风险。</desc><rect width="1200" height="979" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-STR-PRT-01  /  策略 / 组合与仓位管理</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">目标组合的名义敞口与保证金</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例｜权益基准100000元｜以下为目标测算而非成交</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">项目</text><text x="340" y="223" font-size="19" fill="#FFFFFF" font-weight="600">A目标</text><text x="616" y="223" font-size="19" fill="#FFFFFF" font-weight="600">B目标</text><text x="892" y="223" font-size="19" fill="#FFFFFF" font-weight="600">合计或解释</text><rect x="48" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">名义权重</text><rect x="324" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="340" y="271" font-size="19" fill="#172B45" font-weight="400">+40%</text><rect x="600" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="616" y="271" font-size="19" fill="#172B45" font-weight="400">-20%</text><rect x="876" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="892" y="271" font-size="19" fill="#172B45" font-weight="400">总绝对60%</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">目标手数</text><rect x="324" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="340" y="335" font-size="19" fill="#172B45" font-weight="400">+4手</text><rect x="600" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="616" y="335" font-size="19" fill="#172B45" font-weight="400">-2手</text><rect x="876" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="892" y="335" font-size="19" fill="#172B45" font-weight="400">多空分开</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">名义敞口</text><rect x="324" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="340" y="399" font-size="19" fill="#172B45" font-weight="400">+40000元</text><rect x="600" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="616" y="399" font-size="19" fill="#172B45" font-weight="400">-20000元</text><rect x="876" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="892" y="399" font-size="19" fill="#172B45" font-weight="400">净+20000元</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">保证金</text><rect x="324" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="340" y="463" font-size="19" fill="#172B45" font-weight="400">4000元</text><rect x="600" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="616" y="463" font-size="19" fill="#172B45" font-weight="400">3000元</text><rect x="876" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="892" y="463" font-size="19" fill="#172B45" font-weight="400">7000元</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="497" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="527" font-size="19" fill="#29486F" font-weight="600">调仓差额</text><rect x="324" y="497" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="340" y="527" font-size="19" fill="#172B45" font-weight="400">新增多3手</text><rect x="600" y="497" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="616" y="527" font-size="19" fill="#172B45" font-weight="400">新增空1手</text><rect x="876" y="497" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="892" y="527" font-size="19" fill="#172B45" font-weight="400">共4手</text><line x1="48" y1="561" x2="1152" y2="561" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="561" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="591" font-size="19" fill="#29486F" font-weight="600">全成后权益</text><rect x="324" y="561" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="340" y="591" font-size="19" fill="#172B45" font-weight="400">—</text><rect x="600" y="561" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="616" y="591" font-size="19" fill="#172B45" font-weight="400">—</text><rect x="876" y="561" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="892" y="591" font-size="19" fill="#172B45" font-weight="400">99992元</text><line x1="48" y1="625" x2="1152" y2="625" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="625" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="655" font-size="19" fill="#29486F" font-weight="600">全成后可用</text><rect x="324" y="625" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="340" y="655" font-size="19" fill="#172B45" font-weight="400">—</text><rect x="600" y="625" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="616" y="655" font-size="19" fill="#172B45" font-weight="400">—</text><rect x="876" y="625" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="892" y="655" font-size="19" fill="#172B45" font-weight="400">92992元</text><line x1="48" y1="689" x2="1152" y2="689" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="707" width="357.3333333333333" height="102" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="734" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="763" font-size="18" fill="#172B45" font-weight="400">名义敞口不是保证金或现金支出</text><rect x="421.3333333333333" y="707" width="357.3333333333333" height="102" rx="10" fill="#EEF3FA" stroke="none"/><text x="437.3333333333333" y="734" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="437.3333333333333" y="763" font-size="18" fill="#172B45" font-weight="400">全成费用8元；不是实际成交结果</text><rect x="794.6666666666666" y="707" width="357.3333333333333" height="102" rx="10" fill="#EEF3FA" stroke="none"/><text x="810.6666666666666" y="734" font-size="15" fill="#4F6790" font-weight="600">解读 3</text><text x="810.6666666666666" y="763" font-size="18" fill="#172B45" font-weight="400">20%保证金压力需12000元，超上限2000</text><text x="810.6666666666666" y="790" font-size="18" fill="#172B45" font-weight="400">元</text><rect x="48" y="831" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="860" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="891" font-size="21" fill="#FFFFFF" font-weight="600">目标、保证金和账户资金分开；压力超限时不执行新增风险。</text><text x="48" y="945" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>