<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="REQ-STR-LOG-01-figure-title REQ-STR-LOG-01-figure-desc"><title id="REQ-STR-LOG-01-figure-title">固定样例下的方向信号</title><desc id="REQ-STR-LOG-01-figure-desc">虚构案例；当日收盘后计算，前两日预热不足。使用者可逐步解释输出，并定位未来信息或边界错误。</desc><rect width="1200" height="760" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-STR-LOG-01  /  策略 / 策略逻辑构建</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">固定样例下的方向信号</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例；当日收盘后计算，前两日预热不足</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">案例日</text><text x="284.8" y="223" font-size="19" fill="#FFFFFF" font-weight="600">收盘</text><text x="505.6" y="223" font-size="19" fill="#FFFFFF" font-weight="600">此前两日均值</text><text x="726.4000000000001" y="223" font-size="19" fill="#FFFFFF" font-weight="600">差值</text><text x="947.2" y="223" font-size="19" fill="#FFFFFF" font-weight="600">预期输出</text><rect x="48" y="241" width="220.8" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">T</text><rect x="268.8" y="241" width="220.8" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="284.8" y="271" font-size="19" fill="#172B45" font-weight="400">100</text><rect x="489.6" y="241" width="220.8" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="505.6" y="271" font-size="19" fill="#172B45" font-weight="400">不足</text><rect x="710.4000000000001" y="241" width="220.8" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="726.4000000000001" y="271" font-size="19" fill="#172B45" font-weight="400">不计算</text><rect x="931.2" y="241" width="220.8" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="947.2" y="271" font-size="19" fill="#172B45" font-weight="400">预热不足</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">T+1</text><rect x="268.8" y="305" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="284.8" y="335" font-size="19" fill="#172B45" font-weight="400">102</text><rect x="489.6" y="305" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="505.6" y="335" font-size="19" fill="#172B45" font-weight="400">不足</text><rect x="710.4000000000001" y="305" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="726.4000000000001" y="335" font-size="19" fill="#172B45" font-weight="400">不计算</text><rect x="931.2" y="305" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="947.2" y="335" font-size="19" fill="#172B45" font-weight="400">预热不足</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="220.8" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">T+2</text><rect x="268.8" y="369" width="220.8" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="284.8" y="399" font-size="19" fill="#172B45" font-weight="400">104</text><rect x="489.6" y="369" width="220.8" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="505.6" y="399" font-size="19" fill="#172B45" font-weight="400">101</text><rect x="710.4000000000001" y="369" width="220.8" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="726.4000000000001" y="399" font-size="19" fill="#172B45" font-weight="400">+3</text><rect x="931.2" y="369" width="220.8" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="947.2" y="399" font-size="19" fill="#172B45" font-weight="400">+1</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">T+3</text><rect x="268.8" y="433" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="284.8" y="463" font-size="19" fill="#172B45" font-weight="400">101</text><rect x="489.6" y="433" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="505.6" y="463" font-size="19" fill="#172B45" font-weight="400">103</text><rect x="710.4000000000001" y="433" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="726.4000000000001" y="463" font-size="19" fill="#172B45" font-weight="400">−2</text><rect x="931.2" y="433" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="947.2" y="463" font-size="19" fill="#172B45" font-weight="400">−1</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="515" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="571" font-size="18" fill="#172B45" font-weight="400">T+2 不能读取 T+3 的信息</text><rect x="608" y="515" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="571" font-size="18" fill="#172B45" font-weight="400">试算只核对逻辑，不生成真实委托</text><rect x="48" y="612" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="641" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="672" font-size="21" fill="#FFFFFF" font-weight="600">使用者可逐步解释输出，并定位未来信息或边界错误。</text><text x="48" y="726" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>