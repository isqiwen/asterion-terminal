" fill="#172B45" font-weight="400">-2%</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="220.8" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">D</text><rect x="268.8" y="433" width="220.8" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="284.8" y="463" font-size="19" fill="#172B45" font-weight="400">已观察</text><rect x="489.6" y="433" width="220.8" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="505.6" y="463" font-size="19" fill="#172B45" font-weight="400">缺失</text><rect x="710.4000000000001" y="433" width="220.8" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="726.4000000000001" y="463" font-size="19" fill="#172B45" font-weight="400">排除</text><rect x="931.2" y="433" width="220.8" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="947.2" y="463" font-size="19" fill="#172B45" font-weight="400">不评价</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="515" width="357.3333333333333" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="571" font-size="18" fill="#172B45" font-weight="400">甲乙相关系数0.5，不视为完全独立</text><rect x="421.3333333333333" y="515" width="357.3333333333333" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="437.3333333333333" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="437.3333333333333" y="571" font-size="18" fill="#172B45" font-weight="400">D按事前缺失规则排除；没有填零</text><rect x="794.6666666666666" y="515" width="357.3333333333333" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="810.6666666666666" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 3</text><text x="810.6666666666666" y="571" font-size="18" fill="#172B45" font-weight="400">3个有效样本，组间标签差4个百分点</text><rect x="48" y="612" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="641" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="672" font-size="21" fill="#FFFFFF" font-weight="600">权重在验证前冻结，信号与后续标签分别可复核。</text><text x="48" y="726" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>