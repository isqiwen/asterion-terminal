<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="869" viewBox="0 0 1200 869" role="img" aria-labelledby="REQ-LIV-EXE-02-figure-title REQ-LIV-EXE-02-figure-desc"><title id="REQ-LIV-EXE-02-figure-title">撤单与成交交错的数量变化</title><desc id="REQ-LIV-EXE-02-figure-desc">虚构案例；原始委托 5 手。成交与撤销各有明确数量，处理中状态不会被提前判为终态。</desc><rect width="1200" height="869" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-LIV-EXE-02  /  实盘交易 / 订单执行与成交管理</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">撤单与成交交错的数量变化</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例；原始委托 5 手</text><text x="48" y="189" font-size="16" fill="#60738B" font-weight="600">时刻  /  事件  /  累计成交  /  撤销确认  /  仍可能成交</text><line x1="69" y1="231" x2="69" y2="303" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="231" r="17" fill="#285CB8"/><text x="64" y="237" font-size="17" fill="#FFFFFF" font-weight="600">1</text><rect x="106" y="209" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="239" font-size="18" fill="#29486F" font-weight="600">09:00:00</text><text x="325" y="239" font-size="18" fill="#172B45" font-weight="400">事件：委托受理　｜　累计成交：0 手　｜　撤销确认：0 手　｜　仍可能成交：5 手</text><line x1="69" y1="313" x2="69" y2="385" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="313" r="17" fill="#285CB8"/><text x="64" y="319" font-size="17" fill="#FFFFFF" font-weight="600">2</text><rect x="106" y="291" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="321" font-size="18" fill="#29486F" font-weight="600">09:00:01</text><text x="325" y="321" font-size="18" fill="#172B45" font-weight="400">事件：成交 2 手　｜　累计成交：2 手　｜　撤销确认：0 手　｜　仍可能成交：3 手</text><line x1="69" y1="395" x2="69" y2="467" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="395" r="17" fill="#285CB8"/><text x="64" y="401" font-size="17" fill="#FFFFFF" font-weight="600">3</text><rect x="106" y="373" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="403" font-size="18" fill="#29486F" font-weight="600">09:00:02</text><text x="325" y="403" font-size="18" fill="#172B45" font-weight="400">事件：申请撤单　｜　累计成交：2 手　｜　撤销确认：未确认　｜　仍可能成交：3 手</text><line x1="69" y1="477" x2="69" y2="549" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="477" r="17" fill="#285CB8"/><text x="64" y="483" font-size="17" fill="#FFFFFF" font-weight="600">4</text><rect x="106" y="455" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="485" font-size="18" fill="#29486F" font-weight="600">09:00:03</text><text x="325" y="485" font-size="18" fill="#172B45" font-weight="400">事件：再成交 1 手　｜　累计成交：3 手　｜　撤销确认：未确认　｜　仍可能成交：2 手</text><circle cx="69" cy="559" r="17" fill="#285CB8"/><text x="64" y="565" font-size="17" fill="#FFFFFF" font-weight="600">5</text><rect x="106" y="537" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="567" font-size="18" fill="#29486F" font-weight="600">09:00:04</text><text x="325" y="567" font-size="18" fill="#172B45" font-weight="400">事件：剩余撤销　｜　累计成交：3 手　｜　撤销确认：2 手　｜　仍可能成交：0 手</text><rect x="48" y="624" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="651" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="680" font-size="18" fill="#172B45" font-weight="400">申请撤单不等于撤单已经生效</text><rect x="608" y="624" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="651" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="680" font-size="18" fill="#172B45" font-weight="400">最终 3 手成交 + 2 手撤销 = 5 手</text><rect x="48" y="721" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="750" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="781" font-size="21" fill="#FFFFFF" font-weight="600">成交与撤销各有明确数量，处理中状态不会被提前判为终态。</text><text x="48" y="835" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>