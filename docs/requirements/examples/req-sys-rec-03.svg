<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-labelledby="REQ-SYS-REC-03-figure-title REQ-SYS-REC-03-figure-desc"><title id="REQ-SYS-REC-03-figure-title">个人核对资料的导出边界</title><desc id="REQ-SYS-REC-03-figure-desc">虚构案例：仅导出 T 日三条成交，账户脱敏。资料足以复核，分享范围由使用者明确决定。</desc><rect width="1200" height="824" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-SYS-REC-03  /  系统管理 / 资料维护、诊断与导出</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">个人核对资料的导出边界</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例：仅导出 T 日三条成交，账户脱敏</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">内容</text><text x="432" y="223" font-size="19" fill="#FFFFFF" font-weight="600">处理结果</text><text x="800" y="223" font-size="19" fill="#FFFFFF" font-weight="600">文件中的说明</text><rect x="48" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">T 日成交</text><rect x="416" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="271" font-size="19" fill="#172B45" font-weight="400">3 条全部包含</text><rect x="784" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="271" font-size="19" fill="#172B45" font-weight="400">成交记录</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">未成交委托</text><rect x="416" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="335" font-size="19" fill="#172B45" font-weight="400">排除</text><rect x="784" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="335" font-size="19" fill="#172B45" font-weight="400">非本次范围</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">账户标识</text><rect x="416" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="399" font-size="19" fill="#172B45" font-weight="400">匿名显示</text><rect x="784" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="399" font-size="19" fill="#172B45" font-weight="400">账户已脱敏</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">时间与价格</text><rect x="416" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="463" font-size="19" fill="#172B45" font-weight="400">保留口径</text><rect x="784" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="463" font-size="19" fill="#172B45" font-weight="400">时区及单位</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="527" font-size="19" fill="#29486F" font-weight="600">密码与授权码</text><rect x="416" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="527" font-size="19" fill="#172B45" font-weight="400">始终排除</text><rect x="784" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="527" font-size="19" fill="#172B45" font-weight="400">不进入文件</text><line x1="48" y1="561" x2="1152" y2="561" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="635" font-size="18" fill="#172B45" font-weight="400">导出前后记录数量可以核对。</text><rect x="608" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="635" font-size="18" fill="#172B45" font-weight="400">导出文件不等于可恢复的完整备份。</text><rect x="48" y="676" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="705" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="736" font-size="21" fill="#FFFFFF" font-weight="600">资料足以复核，分享范围由使用者明确决定。</text><text x="48" y="790" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>