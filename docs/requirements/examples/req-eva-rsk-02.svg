<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-labelledby="REQ-EVA-RSK-02-figure-title REQ-EVA-RSK-02-figure-desc"><title id="REQ-EVA-RSK-02-figure-title">压力损失与资金缺口</title><desc id="REQ-EVA-RSK-02-figure-desc">虚构案例｜静态多头2手；乘数10；无其他冻结。同一压力条件同时解释权益损失和资金缺口。</desc><rect width="1200" height="824" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-EVA-RSK-02  /  评估 / 风险分析与压力测试</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">压力损失与资金缺口</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例｜静态多头2手；乘数10；无其他冻结</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">项目</text><text x="432" y="223" font-size="19" fill="#FFFFFF" font-weight="600">基准</text><text x="800" y="223" font-size="19" fill="#FFFFFF" font-weight="600">压力情景</text><rect x="48" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">价格 / 保证金率</text><rect x="416" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="271" font-size="19" fill="#172B45" font-weight="400">100 / 10%</text><rect x="784" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="271" font-size="19" fill="#172B45" font-weight="400">80 / 40%</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">权益</text><rect x="416" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="335" font-size="19" fill="#172B45" font-weight="400">1000</text><rect x="784" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="335" font-size="19" fill="#172B45" font-weight="400">600</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">保证金占用</text><rect x="416" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="399" font-size="19" fill="#172B45" font-weight="400">200</text><rect x="784" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="399" font-size="19" fill="#172B45" font-weight="400">640</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">可用资金</text><rect x="416" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="463" font-size="19" fill="#172B45" font-weight="400">800</text><rect x="784" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="463" font-size="19" fill="#172B45" font-weight="400">−40</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="527" font-size="19" fill="#29486F" font-weight="600">资金缺口</text><rect x="416" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="527" font-size="19" fill="#172B45" font-weight="400">0</text><rect x="784" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="527" font-size="19" fill="#172B45" font-weight="400">40</text><line x1="48" y1="561" x2="1152" y2="561" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="635" font-size="18" fill="#172B45" font-weight="400">价格变化损失400；保证金640是占用</text><rect x="608" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="635" font-size="18" fill="#172B45" font-weight="400">不模拟强平，也不自动补资</text><rect x="48" y="676" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="705" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="736" font-size="21" fill="#FFFFFF" font-weight="600">同一压力条件同时解释权益损失和资金缺口。</text><text x="48" y="790" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>