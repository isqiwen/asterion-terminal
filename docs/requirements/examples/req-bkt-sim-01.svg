<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="787" viewBox="0 0 1200 787" role="img" aria-labelledby="REQ-BKT-SIM-01-figure-title REQ-BKT-SIM-01-figure-desc"><title id="REQ-BKT-SIM-01-figure-title">收盘信息与下一事件</title><desc id="REQ-BKT-SIM-01-figure-desc">虚构案例｜分钟线案例；同刻顺序是显式假设。每个信号和成交都能定位到信息可得顺序。</desc><rect width="1200" height="787" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-BKT-SIM-01  /  回测 / 交易与账户模拟</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">收盘信息与下一事件</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例｜分钟线案例；同刻顺序是显式假设</text><text x="48" y="189" font-size="16" fill="#60738B" font-weight="600">阶段  /  已知内容  /  允许动作</text><line x1="69" y1="231" x2="69" y2="303" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="231" r="17" fill="#285CB8"/><text x="64" y="237" font-size="17" fill="#FFFFFF" font-weight="600">1</text><rect x="106" y="209" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="239" font-size="18" fill="#29486F" font-weight="600">线未结束</text><text x="325" y="239" font-size="18" fill="#172B45" font-weight="400">已知内容：此前已完成行情　｜　允许动作：不能读取最终收盘</text><line x1="69" y1="313" x2="69" y2="385" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="313" r="17" fill="#285CB8"/><text x="64" y="319" font-size="17" fill="#FFFFFF" font-weight="600">2</text><rect x="106" y="291" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="321" font-size="18" fill="#29486F" font-weight="600">09:01线发布</text><text x="325" y="321" font-size="18" fill="#172B45" font-weight="400">已知内容：本根收盘可得　｜　允许动作：计算信号</text><line x1="69" y1="395" x2="69" y2="467" stroke="#BCCFEA" stroke-width="2"/><circle cx="69" cy="395" r="17" fill="#285CB8"/><text x="64" y="401" font-size="17" fill="#FFFFFF" font-weight="600">3</text><rect x="106" y="373" width="1046" height="62" rx="9" fill="#F8FAFD" stroke="none"/><text x="124" y="403" font-size="18" fill="#29486F" font-weight="600">接纳订单</text><text x="325" y="403" font-size="18" fill="#172B45" font-weight="400">已知内容：目标与风险已检查　｜　允许动作：等待可成交事件</text><circle cx="69" cy="477" r="17" fill="#285CB8"/><text x="64" y="483" font-size="17" fill="#FFFFFF" font-weight="600">4</text><rect x="106" y="455" width="1046" height="62" rx="9" fill="#F1F5FA" stroke="none"/><text x="124" y="485" font-size="18" fill="#29486F" font-weight="600">下一开盘事件</text><text x="325" y="485" font-size="18" fill="#172B45" font-weight="400">已知内容：实际月份价格　｜　允许动作：按已声明规则撮合</text><rect x="48" y="542" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="569" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="598" font-size="18" fill="#172B45" font-weight="400">时间戳相同不等于信息同时可用</text><rect x="608" y="542" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="569" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="598" font-size="18" fill="#172B45" font-weight="400">不把K线回测冒充逐笔成交还原</text><rect x="48" y="639" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="668" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="699" font-size="21" fill="#FFFFFF" font-weight="600">每个信号和成交都能定位到信息可得顺序。</text><text x="48" y="753" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>