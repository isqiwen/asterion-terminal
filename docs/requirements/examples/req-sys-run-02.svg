<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" role="img" aria-labelledby="REQ-SYS-RUN-02-figure-title REQ-SYS-RUN-02-figure-desc"><title id="REQ-SYS-RUN-02-figure-title">三种操作的影响范围</title><desc id="REQ-SYS-RUN-02-figure-desc">虚构案例：本地任务甲与远程任务乙同时运行。用户能预判关闭操作的实际业务影响。</desc><rect width="1200" height="696" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-SYS-RUN-02  /  系统管理 / 任务调度与运行节点</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">三种操作的影响范围</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例：本地任务甲与远程任务乙同时运行</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">动作</text><text x="432" y="223" font-size="19" fill="#FFFFFF" font-weight="600">本地任务甲</text><text x="800" y="223" font-size="19" fill="#FFFFFF" font-weight="600">远程任务乙</text><rect x="48" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">关闭窗口</text><rect x="416" y="241" width="368" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="432" y="271" font-size="19" fill="#172B45" font-weight="400">继续运行</text><rect x="784" y="241" width="368" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="800" y="271" font-size="19" fill="#172B45" font-weight="400">继续运行</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">重新打开</text><rect x="416" y="305" width="368" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="432" y="335" font-size="19" fill="#172B45" font-weight="400">查询原任务</text><rect x="784" y="305" width="368" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="800" y="335" font-size="19" fill="#172B45" font-weight="400">查询原任务</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">停止本地运行</text><rect x="416" y="369" width="368" height="64" rx="0" fill="#EDF3FC" stroke="none"/><text x="432" y="399" font-size="19" fill="#172B45" font-weight="400">停止并记录状态</text><rect x="784" y="369" width="368" height="64" rx="0" fill="#FFF6E9" stroke="none"/><text x="800" y="399" font-size="19" fill="#172B45" font-weight="400">继续运行</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="451" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="478" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="507" font-size="18" fill="#172B45" font-weight="400">任务归属始终可识别。</text><rect x="608" y="451" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="478" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="507" font-size="18" fill="#172B45" font-weight="400">停止运行不等于市场订单已撤销。</text><rect x="48" y="548" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="577" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="608" font-size="21" fill="#FFFFFF" font-weight="600">用户能预判关闭操作的实际业务影响。</text><text x="48" y="662" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>