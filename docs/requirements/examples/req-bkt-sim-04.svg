<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="REQ-BKT-SIM-04-figure-title REQ-BKT-SIM-04-figure-desc"><title id="REQ-BKT-SIM-04-figure-title">逐日结算与最终权益</title><desc id="REQ-BKT-SIM-04-figure-desc">虚构案例｜初始10000元；乘数10；每边手续费2元。逐日流水与整笔交易净利核对一致。</desc><rect width="1200" height="760" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-BKT-SIM-04  /  回测 / 交易与账户模拟</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">逐日结算与最终权益</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例｜初始10000元；乘数10；每边手续费2元</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">阶段</text><text x="340" y="223" font-size="19" fill="#FFFFFF" font-weight="600">权益/变动</text><text x="616" y="223" font-size="19" fill="#FFFFFF" font-weight="600">保证金</text><text x="892" y="223" font-size="19" fill="#FFFFFF" font-weight="600">可用资金</text><rect x="48" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">初始空仓</text><rect x="324" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="340" y="271" font-size="19" fill="#172B45" font-weight="400">10000</text><rect x="600" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="616" y="271" font-size="19" fill="#172B45" font-weight="400">0</text><rect x="876" y="241" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="892" y="271" font-size="19" fill="#172B45" font-weight="400">10000</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">首日结算102</text><rect x="324" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="340" y="335" font-size="19" fill="#172B45" font-weight="400">10000＋20－2＝10018</text><rect x="600" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="616" y="335" font-size="19" fill="#172B45" font-weight="400">102</text><rect x="876" y="305" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="892" y="335" font-size="19" fill="#172B45" font-weight="400">9916</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">次日103平仓</text><rect x="324" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="340" y="399" font-size="19" fill="#172B45" font-weight="400">10018＋10－2＝10026</text><rect x="600" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="616" y="399" font-size="19" fill="#172B45" font-weight="400">0</text><rect x="876" y="369" width="276" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="892" y="399" font-size="19" fill="#172B45" font-weight="400">10026</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">整笔交易核对</text><rect x="324" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="340" y="463" font-size="19" fill="#172B45" font-weight="400">毛30－费4＝净26</text><rect x="600" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="616" y="463" font-size="19" fill="#172B45" font-weight="400">释放不算收入</text><rect x="876" y="433" width="276" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="892" y="463" font-size="19" fill="#172B45" font-weight="400">无资金出入</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="515" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="571" font-size="18" fill="#172B45" font-weight="400">20元已计入首日结算，次日只增加10元</text><rect x="608" y="515" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="542" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="571" font-size="18" fill="#172B45" font-weight="400">释放保证金不产生新的盈亏</text><rect x="48" y="612" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="641" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="672" font-size="21" fill="#FFFFFF" font-weight="600">逐日流水与整笔交易净利核对一致。</text><text x="48" y="726" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>