<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-labelledby="REQ-INT-SRV-01-figure-title REQ-INT-SRV-01-figure-desc"><title id="REQ-INT-SRV-01-figure-title">知道公告和得到可用情报不是同一时刻</title><desc id="REQ-INT-SRV-01-figure-desc">虚构案例｜按实际可用时间查询。回测不能把09:10才可用的情报提前到09:00使用。</desc><rect width="1200" height="824" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Heiti SC, sans-serif"><text x="48" y="43" font-size="17" fill="#536782" font-weight="600">REQ-INT-SRV-01  /  情报 / 事件服务</text><text x="858" y="43" font-size="17" fill="#745321" font-weight="400">业务算例 · 非界面截图</text><text x="48" y="91" font-size="30" fill="#162B47" font-weight="700">知道公告和得到可用情报不是同一时刻</text><text x="48" y="134" font-size="18" fill="#52657C" font-weight="400">虚构案例｜按实际可用时间查询</text><rect x="48" y="189" width="1104" height="52" rx="8" fill="#213B60" stroke="none"/><text x="64" y="223" font-size="19" fill="#FFFFFF" font-weight="600">时间</text><text x="432" y="223" font-size="19" fill="#FFFFFF" font-weight="600">发生的事</text><text x="800" y="223" font-size="19" fill="#FFFFFF" font-weight="600">结构化情报可用性</text><rect x="48" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="271" font-size="19" fill="#29486F" font-weight="600">09:00</text><rect x="416" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="271" font-size="19" fill="#172B45" font-weight="400">公告公开</text><rect x="784" y="241" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="271" font-size="19" fill="#172B45" font-weight="400">尚不可用</text><line x1="48" y1="305" x2="1152" y2="305" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="335" font-size="19" fill="#29486F" font-weight="600">09:02</text><rect x="416" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="335" font-size="19" fill="#172B45" font-weight="400">系统取得材料</text><rect x="784" y="305" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="335" font-size="19" fill="#172B45" font-weight="400">尚不可用</text><line x1="48" y1="369" x2="1152" y2="369" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="399" font-size="19" fill="#29486F" font-weight="600">09:05</text><rect x="416" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="399" font-size="19" fill="#172B45" font-weight="400">候选提取完成</text><rect x="784" y="369" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="399" font-size="19" fill="#172B45" font-weight="400">待核验</text><line x1="48" y1="433" x2="1152" y2="433" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="64" y="463" font-size="19" fill="#29486F" font-weight="600">09:10</text><rect x="416" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="432" y="463" font-size="19" fill="#172B45" font-weight="400">核验并发布成功</text><rect x="784" y="433" width="368" height="64" rx="0" fill="#F2F6FB" stroke="none"/><text x="800" y="463" font-size="19" fill="#172B45" font-weight="400">从此可用</text><line x1="48" y1="497" x2="1152" y2="497" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="64" y="527" font-size="19" fill="#29486F" font-weight="600">T+1</text><rect x="416" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="432" y="527" font-size="19" fill="#172B45" font-weight="400">收到更正</text><rect x="784" y="497" width="368" height="64" rx="0" fill="#FFFFFF" stroke="none"/><text x="800" y="527" font-size="19" fill="#172B45" font-weight="400">保留新的知悉时间</text><line x1="48" y1="561" x2="1152" y2="561" stroke="#D9E2EF" stroke-width="2"/><rect x="48" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="64" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 1</text><text x="64" y="635" font-size="18" fill="#172B45" font-weight="400">事件生效时间不是信息可用时间</text><rect x="608" y="579" width="544" height="75" rx="10" fill="#EEF3FA" stroke="none"/><text x="624" y="606" font-size="15" fill="#4F6790" font-weight="600">解读 2</text><text x="624" y="635" font-size="18" fill="#172B45" font-weight="400">历史重处理显式标记为事后研究</text><rect x="48" y="676" width="1104" height="75" rx="10" fill="#213B60" stroke="none"/><text x="68" y="705" font-size="15" fill="#C5D8F2" font-weight="600">应得到的结果</text><text x="68" y="736" font-size="21" fill="#FFFFFF" font-weight="600">回测不能把09:10才可用的情报提前到09:00使用。</text><text x="48" y="790" font-size="16" fill="#6A7C91" font-weight="400">图示用于解释需求与案例；不限定最终界面布局。数值仅适用于本案例给定条件。</text></g></svg>